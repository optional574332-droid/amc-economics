let currentTeacherAttendanceData = null;
async function loadTeacherAttendanceReport() {
  const cv = document.getElementById('tarCourse').value;
  const fromDate = document.getElementById('tarFrom').value;
  const toDate = document.getElementById('tarTo').value;
  const area = document.getElementById('teacherAttendanceReportArea');
  if (!fromDate || !toDate) { area.innerHTML = '<p class="text-red-500 text-center py-4 bangla-text">দুই তারিখ দিন</p>'; return; }
  area.innerHTML = '<p class="text-center py-4 dark:text-gray-300 bangla-text">⏳...</p>';
  await getCourseInfoMap();
  let fs = null, fy = null, fc = null;
  if (cv) [fc, fs, fy] = cv.split('|');
  let q = db.from('attendance_sessions').select('id, course_code, date, session, year, pin').eq('teacher_id', currentTeacher.id).gte('date', fromDate).lte('date', toDate).order('date', { ascending: false });
  if (fs) q = q.eq('session', fs);
  if (fy) q = q.eq('year', fy);
  if (fc) q = q.eq('course_code', fc);
  const { data: sessions, error: sErr } = await q;
  if (sErr) { area.innerHTML = `<p class="text-red-500 text-center py-4 bangla-text">❌ ${escapeHtml(sErr.message)}</p>`; return; }
  if (!sessions || !sessions.length) { area.innerHTML = '<p class="text-gray-400 text-center py-4 bangla-text">এই সময়ে কোনো ক্লাস নেই</p>'; return; }
  const sIds = sessions.map(s => s.id);
  const { data: records } = await db.from('attendance_records')
    .select('id, session_id, student_id, status, marked_at, device_id, students(name, class_roll, reg_no)')
    .in('session_id', sIds);
  const byS = {};
  sessions.forEach(s => { byS[s.id] = { session: s, records: [] }; });
  (records || []).forEach(r => { if (byS[r.session_id]) byS[r.session_id].records.push(r); });
  const rows = Object.values(byS).map(({ session, records }) => ({
    session, records,
    present: records.filter(r => r.status === 'present').length,
    absent: records.filter(r => r.status === 'absent').length,
    late: records.filter(r => r.status === 'late').length,
    excused: records.filter(r => r.status === 'excused').length
  }));
  currentTeacherAttendanceData = { fromDate, toDate, rows, courseLabel: cv || 'সব কোর্স' };
  const tP = rows.reduce((s, r) => s + r.present, 0);
  const tA = rows.reduce((s, r) => s + r.absent, 0);
  const tL = rows.reduce((s, r) => s + r.late, 0);
  const tE = rows.reduce((s, r) => s + r.excused, 0);
  area.innerHTML = `
    <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-xl mb-3">
      <p class="text-sm dark:text-white mb-2 bangla-text">
        <b>তারিখ:</b> <span class="num-display">${escapeHtml(fromDate)}</span> থেকে <span class="num-display">${escapeHtml(toDate)}</span> · <b>ক্লাস:</b> <span class="num-display">${sessions.length}</span>
      </p>
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="bg-emerald-50 dark:bg-emerald-900/30 p-2 rounded-lg"><p class="text-emerald-700 dark:text-emerald-300 font-bold text-xs">✅</p><p class="text-xl font-bold text-emerald-800 dark:text-emerald-200 num-display">${tP}</p></div>
        <div class="bg-red-50 dark:bg-red-900/30 p-2 rounded-lg"><p class="text-red-700 dark:text-red-300 font-bold text-xs">❌</p><p class="text-xl font-bold text-red-800 dark:text-red-200 num-display">${tA}</p></div>
        <div class="bg-amber-50 dark:bg-amber-900/30 p-2 rounded-lg"><p class="text-amber-700 dark:text-amber-300 font-bold text-xs">⏰</p><p class="text-xl font-bold text-amber-800 dark:text-amber-200 num-display">${tL}</p></div>
        <div class="bg-blue-50 dark:bg-blue-900/30 p-2 rounded-lg"><p class="text-blue-700 dark:text-blue-300 font-bold text-xs">📝</p><p class="text-xl font-bold text-blue-800 dark:text-blue-200 num-display">${tE}</p></div>
      </div>
    </div>
    <div class="space-y-3">
      ${rows.map(({ session: s, records }) => `
        <details class="bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 rounded-xl" open>
          <summary class="cursor-pointer p-3 font-bold dark:text-white bangla-text">
            📅 <span class="num-display">${escapeHtml(s.date)}</span> · 📚 <span class="num-display">${escapeHtml(courseLabel(s.course_code))}</span> · PIN <span class="num-display">${escapeHtml(s.pin)}</span>
          </summary>
          <div class="p-3 pt-0">
            ${records.length === 0 ? '<p class="text-gray-400 text-sm bangla-text">কেউ হাজিরা দেয়নি</p>' : `
              <p class="text-xs text-gray-500 dark:text-gray-400 mb-2 bangla-text">💡 status-এ ক্লিক করে পরিবর্তন</p>
              <table class="min-w-full text-xs border dark:border-gray-600">
                <thead class="bg-gray-100 dark:bg-gray-600">
                  <tr>
                    <th class="p-2 border dark:border-gray-600 dark:text-white num-cell">Roll</th>
                    <th class="p-2 border dark:border-gray-600 dark:text-white num-cell">Reg</th>
                    <th class="p-2 border dark:border-gray-600 dark:text-white text-left bangla-text">নাম</th>
                    <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">সময়</th>
                    <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">Device</th>
                    <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${sortStudents(records.map(r => ({ class_roll: r.students?.class_roll || '', ...r }))).map(r => {
                    const icons = { present: '✅ উপস্থিত', absent: '❌ অনুপস্থিত', late: '⏰ দেরি', excused: '📝 ছাড়' };
                    const dt = r.marked_at ? new Date(r.marked_at) : null;
                    return `<tr class="dark:text-white">
                      <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(r.students?.class_roll || '-')}</td>
                      <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(r.students?.reg_no || '-')}</td>
                      <td class="p-2 border dark:border-gray-600 bangla-text">${escapeHtml(r.students?.name || '-')}</td>
                      <td class="p-2 border dark:border-gray-600 text-center num-display">${dt ? dt.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}) : '-'}</td>
                      <td class="p-2 border dark:border-gray-600 text-center"><span class="device-badge">${shortDevice(r.device_id)}</span></td>
                      <td class="p-2 border dark:border-gray-600 text-center">
                        <button onclick="changeAttendanceStatus('${r.id}', '${r.status}')" class="bg-gray-100 dark:bg-gray-600 px-2 py-1 rounded text-xs bangla-text hover:bg-indigo-100 dark:hover:bg-indigo-800">${icons[r.status] || r.status}</button>
                      </td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>`}
          </div>
        </details>
      `).join('')}
    </div>`;
}

async function changeAttendanceStatus(recordId, currentStatus) {
  const result = await Swal.fire({
    title: 'Status পরিবর্তন',
    input: 'select',
    inputOptions: { present: '✅ উপস্থিত', absent: '❌ অনুপস্থিত', late: '⏰ দেরি', excused: '📝 ছাড়' },
    inputValue: currentStatus,
    showCancelButton: true,
    confirmButtonText: 'সেভ',
    cancelButtonText: 'বাতিল',
    confirmButtonColor: '#4f46e5'
  });
  if (!result.isConfirmed || result.value === currentStatus) return;
  showGlobalLoader();
  try {
    const { data, error } = await db.rpc('update_attendance_status', {
      p_record_id: recordId, p_new_status: result.value, p_teacher_id: currentTeacher.id
    });
    if (error || !data.ok) return toastError(data?.message || error?.message);
    toastSuccess('পরিবর্তিত');
    loadTeacherAttendanceReport();
  } finally { hideGlobalLoader(); }
}

async function exportTeacherAttendanceExcel() {
  if (!currentTeacherAttendanceData) return toastWarning('প্রথমে রিপোর্ট দেখুন');
  const { fromDate, toDate, rows } = currentTeacherAttendanceData;
  const data = [['Date', 'Course', 'PIN', 'Roll', 'Reg', 'Name', 'Status', 'Time', 'Device']];
  rows.forEach(({ session, records }) => {
    records.forEach(r => {
      const dt = r.marked_at ? new Date(r.marked_at) : null;
      data.push([
        session.date, courseLabel(session.course_code), session.pin,
        r.students?.class_roll || '', r.students?.reg_no || '',
        r.students?.name || '', r.status,
        dt ? dt.toLocaleTimeString('en-GB') : '',
        r.device_id || ''
      ]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
  XLSX.writeFile(wb, `TeacherReport_${fromDate}_to_${toDate}.xlsx`);
}

async function exportTeacherAttendancePDF() {
  if (!currentTeacherAttendanceData) return toastWarning('প্রথমে রিপোর্ট দেখুন');
  const { fromDate, toDate, rows } = currentTeacherAttendanceData;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  await setupBanglaFont(doc);
  doc.setFontSize(14);
  doc.text('AMC Economics - Teacher Attendance Report', 14, 15);
  doc.setFontSize(10);
  doc.text(`Period: ${fromDate} to ${toDate}`, 14, 22);
  let sY = 28;
  rows.forEach(({ session, records }) => {
    if (records.length === 0) return;
    doc.setFontSize(11);
    doc.text(`${session.date} - ${courseLabel(session.course_code)} (PIN: ${session.pin})`, 14, sY);
    doc.autoTable({
      head: [['Roll', 'Reg', 'Name', 'Status', 'Time', 'Device']],
      body: sortStudents(records.map(r => ({ class_roll: r.students?.class_roll || '', ...r })))
        .map(r => {
          const dt = r.marked_at ? new Date(r.marked_at) : null;
          return [
            r.students?.class_roll || '-',
            r.students?.reg_no || '-',
            r.students?.name || '-',
            r.status,
            dt ? dt.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'}) : '-',
            shortDevice(r.device_id)
          ];
        }),
      startY: sY + 4,
      styles: { fontSize: 8, font: 'HindSiliguri' },
      headStyles: { fillColor: [20, 184, 166], font: 'HindSiliguri' },
      margin: { left: 14 }
    });
    sY = doc.lastAutoTable.finalY + 8;
    if (sY > 180) { doc.addPage(); sY = 20; }
  });
  doc.save(`TeacherReport_${fromDate}_to_${toDate}.pdf`);
}

let currentMarkContext = null;

async function loadMarkEntry() {
  const cv = document.getElementById('mkCourse').value;
  const examVal = document.getElementById('mkExam').value;
  const customExam = document.getElementById('mkCustomExam').value.trim();
  const exam = examVal === 'Others' ? (customExam || 'Others') : examVal;
  if (!cv) return toastWarning('কোর্স সিলেক্ট করুন');
  if (examVal === 'Others' && !customExam) return toastWarning('পরীক্ষার নাম দিন');
  const [course, session, year] = cv.split('|');
  if (!session || !year) return toastWarning('কোর্স তথ্য অসম্পূর্ণ');

  showGlobalLoader();
  try {
    const { data: sRaw, error: sE } = await db.from('students').select('id, name, class_roll, reg_no').eq('session', session).eq('year', year).eq('status', 'active');
    if (sE) return toastError(sE.message);
    const students = sortStudents(sRaw || []);
    if (!students.length) { toastWarning('ছাত্র নেই'); return; }

    const { data: existing } = await db.from('marks').select('student_id, marks, is_published').eq('session', session).eq('year', year).eq('course_code', course).eq('exam_type', exam);
    const mMap = {};
    let anyPublished = false;
    existing?.forEach(m => {
      mMap[m.student_id] = m.marks;
      if (m.is_published) anyPublished = true;
    });

    currentMarkContext = { course, session, year, exam, students, mMap, isPublished: anyPublished };

    const isMobile = window.innerWidth < 768;
    const area = document.getElementById('markEntryArea');
    area.innerHTML = `
      <div class="space-y-3">
        <div class="flex justify-between items-center flex-wrap gap-2">
          <div>
            <p class="font-bold dark:text-white bangla-text">
              <span class="num-display">${escapeHtml(course)}</span> · <span class="num-display">${escapeHtml(exam)}</span>
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">
              <span class="num-display">${students.length}</span> জন ছাত্র · 
              <span class="num-display">${session}</span> · <span class="num-display">${year}</span>
            </p>
          </div>
          <div class="flex gap-2 flex-wrap">
            <button onclick="downloadMarksTemplate()" class="bg-gray-500 text-white px-4 py-2 rounded-lg btn-pop text-sm bangla-text">📥 Template</button>
            <button onclick="exportMarksExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg btn-pop text-sm bangla-text">📊 Excel</button>
            <button onclick="exportMarksPDF()" class="bg-red-600 text-white px-4 py-2 rounded-lg btn-pop text-sm bangla-text">📄 PDF</button>
          </div>
        </div>

        <div id="publishStatus" class="flex items-center gap-2">
          ${anyPublished 
            ? `<span class="published-badge bangla-text">✅ Published</span><p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">Locked — edit করতে Unpublish করুন</p>` 
            : `<span class="draft-badge bangla-text">📝 Draft</span><p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">Edit করা যাবে</p>`}
        </div>

        <div class="flex gap-2 flex-wrap">
          <button onclick="publishMarks(true)" class="bg-green-600 text-white px-4 py-2 rounded-lg btn-pop text-sm bangla-text">🔒 Publish</button>
          <button onclick="publishMarks(false)" class="bg-amber-600 text-white px-4 py-2 rounded-lg btn-pop text-sm bangla-text">🔓 Unpublish</button>
        </div>

        <input type="file" id="marksFile" accept=".xlsx,.xls" class="w-full text-sm dark:text-white">
        <button onclick="importMarksExcel()" class="w-full bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold btn-pop bangla-text">📊 Excel Import</button>

        <div id="marksGrid"></div>
        <div id="marksStatus" class="text-sm bangla-text"></div>
      </div>`;

    renderMarksGrid(isMobile ? 'card' : 'grid');
  } finally { hideGlobalLoader(); }
}

function renderMarksGrid(mode) {
  if (!currentMarkContext) return;
  const { students, mMap, isPublished } = currentMarkContext;
  const grid = document.getElementById('marksGrid');
  const disabled = isPublished ? 'disabled' : '';

  if (mode === 'card') {
    grid.innerHTML = `
      <div class="space-y-2 mt-4">
        ${students.map(s => `
          <div class="flex items-center gap-2 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl">
            <div class="flex-1">
              <p class="font-bold text-sm dark:text-white bangla-text">${escapeHtml(s.name)}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">রোল: <span class="num-display">${escapeHtml(s.class_roll)}</span></p>
            </div>
            <input type="number" min="0" max="100" value="${mMap[s.id] ?? ''}" ${disabled}
              class="mark-input w-20 border-2 rounded-lg p-2 text-center dark:bg-gray-600 dark:text-white dark:border-gray-500 disabled:opacity-50"
              style="font-family: Arial, sans-serif !important;"
              data-student-id="${escapeHtml(s.id)}">
          </div>`).join('')}
      </div>`;
  } else {
    grid.innerHTML = `
      <div class="overflow-x-auto max-h-[600px] overflow-y-auto mt-4">
        <table class="min-w-full text-sm border dark:border-gray-600">
          <thead class="bg-gray-100 dark:bg-gray-700 sticky top-0">
            <tr>
              <th class="p-2 border dark:border-gray-600 dark:text-white num-cell">Roll</th>
              <th class="p-2 border dark:border-gray-600 dark:text-white num-cell">Reg</th>
              <th class="p-2 border dark:border-gray-600 dark:text-white text-left bangla-text">নাম</th>
              <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">Marks</th>
            </tr>
          </thead>
          <tbody>
            ${students.map(s => `
              <tr class="marks-grid-row hover:bg-gray-50 dark:hover:bg-gray-700 dark:text-white">
                <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(s.class_roll)}</td>
                <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(s.reg_no || '-')}</td>
                <td class="p-2 border dark:border-gray-600 bangla-text">${escapeHtml(s.name)}</td>
                <td class="p-2 border dark:border-gray-600 text-center">
                  <input type="number" min="0" max="100" value="${mMap[s.id] ?? ''}" ${disabled}
                    class="mark-input w-20 border-2 rounded-lg p-2 text-center dark:bg-gray-600 dark:text-white dark:border-gray-500 disabled:opacity-50"
                    style="font-family: Arial, sans-serif !important;"
                    data-student-id="${escapeHtml(s.id)}">
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  grid.querySelectorAll('.mark-input').forEach(inp => {
    inp.addEventListener('change', () => autoSaveMark(inp));
    inp.addEventListener('blur', () => autoSaveMark(inp));
  });
}

let markSaveTimers = {};
function autoSaveMark(inp) {
  const sid = inp.dataset.studentId;
  if (markSaveTimers[sid]) clearTimeout(markSaveTimers[sid]);
  markSaveTimers[sid] = setTimeout(() => {
    saveMark(sid, inp.value, inp);
  }, 800);
}

async function saveMark(studentId, marks, inputEl) {
  if (String(marks).trim() === '') return;
  const ctx = currentMarkContext;
  if (!ctx) return;

  const num = Number(banglaToEnglish(marks));
  if (isNaN(num) || num < 0 || num > 100) {
    if (inputEl) inputEl.style.background = '#fecaca';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 1500);
    return toastWarning('নম্বর ০-১০০ হতে হবে');
  }

  if (ctx.mMap[studentId] === num) return;

  const { data, error } = await db.rpc('save_mark', {
    p_session: ctx.session, p_year: ctx.year, p_course_code: ctx.course,
    p_exam_type: ctx.exam, p_student_id: studentId, p_marks: num,
    p_teacher_id: currentTeacher ? currentTeacher.id : null
  });

  if (error || !data?.ok) {
    if (inputEl) inputEl.style.background = '#fecaca';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 1500);
    return toastError(data?.message || error?.message);
  }

  ctx.mMap[studentId] = num;
  if (inputEl) {
    inputEl.style.background = '#d1fae5';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 800);
  }
  toastSuccess('সেভ হয়েছে');
}

async function publishMarks(publish) {
  const ctx = currentMarkContext;
  if (!ctx) return;
  const ok = await confirmAction(
    publish ? 'Publish করবেন?' : 'Unpublish করবেন?',
    publish ? 'Publish করলে edit locked হয়ে যাবে।' : 'Unpublish করলে আবার edit unlock হবে।',
    publish ? 'Publish' : 'Unpublish',
    publish ? '#059669' : '#d97706'
  );
  if (!ok) return;

  showGlobalLoader();
  try {
    const { error } = await db.from('marks')
      .update({ 
        is_published: publish,
        published_at: publish ? new Date().toISOString() : null,
        published_by: publish ? currentTeacher.id : null
      })
      .eq('session', ctx.session).eq('year', ctx.year)
      .eq('course_code', ctx.course).eq('exam_type', ctx.exam);
    if (error) return toastError(error.message);
    ctx.isPublished = publish;
    toastSuccess(publish ? '✅ Published' : '🔓 Unpublished');
    const status = document.getElementById('publishStatus');
    if (status) {
      status.innerHTML = publish 
        ? `<span class="published-badge bangla-text">✅ Published</span><p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">Locked</p>` 
        : `<span class="draft-badge bangla-text">📝 Draft</span><p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">Edit করা যাবে</p>`;
    }
    renderMarksGrid(window.innerWidth < 768 ? 'card' : 'grid');
  } finally { hideGlobalLoader(); }
}

async function downloadMarksTemplate() {
  const ctx = currentMarkContext;
  if (!ctx) return;
  const data = [['Class Roll', 'Reg No', 'Name', ctx.exam]];
  ctx.students.forEach(s => data.push([s.class_roll, s.reg_no || '', s.name, '']));
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Marks');
  XLSX.writeFile(wb, `Marks_${ctx.course}_${ctx.exam}.xlsx`);
}

async function exportMarksExcel() {
  const ctx = currentMarkContext;
  if (!ctx) return;
  const data = [['Class Roll', 'Reg No', 'Name', ctx.exam]];
  ctx.students.forEach(s => data.push([s.class_roll, s.reg_no || '', s.name, ctx.mMap[s.id] ?? '']));
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Marks');

async function importMarksExcel() {
  const file = document.getElementById('marksFile')?.files[0];
  if (!file) return toastWarning('ফাইল সিলেক্ট করুন');
  const ctx = currentMarkContext;
  if (!ctx) return;
  const status = document.getElementById('marksStatus');
  status.innerHTML = '<p class="text-gray-500 bangla-text">⏳...</p>';

  const map = {};
  ctx.students.forEach(s => { map[s.class_roll] = s.id; });

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      let ok = 0, nf = 0, iv = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const roll = String(r[0] || '').trim();
        const mv = r[3];
        if (!roll) continue;
        const sid = map[roll];
        if (!sid) { nf++; continue; }
        if (mv === '' || mv === undefined || mv === null) continue;
        const num = Number(banglaToEnglish(mv));
        if (isNaN(num) || num < 0 || num > 100) { iv++; continue; }
        const { error } = await db.rpc('save_mark', {
          p_session: ctx.session, p_year: ctx.year, p_course_code: ctx.course,
          p_exam_type: ctx.exam, p_student_id: sid, p_marks: num,
          p_teacher_id: currentTeacher ? currentTeacher.id : null
        });
        if (error) iv++; else { ok++; ctx.mMap[sid] = num; }
      }
      status.innerHTML = `
        <div class="bg-emerald-50 dark:bg-emerald-900/30 p-4 rounded-xl">
          <p class="font-bold text-emerald-700 dark:text-emerald-300 mb-2 bangla-text">✅ Import সম্পন্ন</p>
          <p class="text-sm dark:text-white bangla-text">✓ সফল: <span class="num-display">${ok}</span></p>
          <p class="text-sm dark:text-white bangla-text">✗ পাওয়া যায়নি: <span class="num-display">${nf}</span></p>
          <p class="text-sm dark:text-white bangla-text">❌ Invalid: <span class="num-display">${iv}</span></p>
        </div>`;
      renderMarksGrid(window.innerWidth < 768 ? 'card' : 'grid');
    } catch (err) { status.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(err.message)}</p>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function loadStudentData() {
  const student = currentStudent;

  await getCourseInfoMap();
  // হাজিরার হিসাব
  const { data: mySessions } = await db.from('attendance_sessions').select('id, course_code, date').eq('session', student.session).eq('year', student.year);
  const total = mySessions?.length || 0;
  const { data: records } = await db.from('attendance_records').select('status, session_id, attendance_sessions(course_code, date)').eq('student_id', student.id);
  const att = records?.filter(r => r.status === 'present' || r.status === 'late').length || 0;
  const pct = total > 0 ? ((att / total) * 100).toFixed(1) : 0;
  const pC = pct >= 70 ? 'emerald' : pct >= 50 ? 'amber' : 'red';

  // নোটিশ
  const { data: notices } = await db.from('notices').select('*').or(`expires_at.is.null,expires_at.gte.${new Date().toISOString()}`).order('created_at', { ascending: false }).limit(5);

  // রুটিন ডাটা (ছাত্রের সেশন ও ইয়ার অনুযায়ী)
  const { data: rawRoutines } = await db.from('teacher_courses')
    .select('*, teachers(name)')
    .eq('session', student.session)
    .eq('year', student.year)
    .not('class_day', 'is', null)
    .not('time_slot', 'is', null);

  const courseMap = {};
  const courseCodes = [...new Set((rawRoutines || []).map(m => m.course_code))];
  if (courseCodes.length) {
    const { data: courses } = await db.from('courses').select('course_code, session, year, course_name').in('course_code', courseCodes);
    courses?.forEach(c => { courseMap[`${c.session}|${c.year}|${c.course_code}`] = c.course_name; });
  }

  await getCourseInfoMap();
  const routines = (rawRoutines || []).map(r => ({
    ...r,
    course_name: courseMap[`${r.session}|${r.year}|${r.course_code}`] || '',
    teacher_name: r.teachers?.name || 'Unknown'
  }));

  const weekOrder = { Sunday: 0, Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4 };
  routines.sort((a, b) => {
    if (weekOrder[a.class_day] !== weekOrder[b.class_day]) return weekOrder[a.class_day] - weekOrder[b.class_day];
    return routineTimeRank(a.time_slot) - routineTimeRank(b.time_slot);
  });

  const bnDay = { Sunday: 'রবিবার', Monday: 'সোমবার', Tuesday: 'মঙ্গলবার', Wednesday: 'বুধবার', Thursday: 'বৃহস্পতিবার' };
  const groupedRoutines = {};
  routines.forEach(p => {
    if (!groupedRoutines[p.class_day]) groupedRoutines[p.class_day] = [];
    groupedRoutines[p.class_day].push(p);
  });

  document.getElementById('studentContent').innerHTML = `
    <div class="bg-indigo-50 dark:bg-indigo-900/30 rounded-2xl p-5 mb-6 text-center">
      <p class="text-gray-500 dark:text-gray-400 text-sm bangla-text">${escapeHtml(student.name)}</p>
      <p class="text-xs text-gray-400 dark:text-gray-500 bangla-text">${escapeHtml(student.session)} · ${escapeHtml(student.year)} · রোল <span class="num-display">${escapeHtml(student.class_roll)}</span></p>
    </div>

    <!-- হাজিরার সারাংশ -->
    <div class="bg-${pC}-50 dark:bg-${pC}-900/30 rounded-2xl p-6 mb-6 text-center shadow-sm">
      <p class="text-5xl font-bold text-${pC}-600 dark:text-${pC}-300 num-display mb-1">${pct}%</p>
      <p class="text-gray-600 dark:text-gray-400 font-bold bangla-text">উপস্থিতির হার</p>
      <p class="text-xs text-gray-500 dark:text-gray-500 mt-2 bangla-text"><span class="num-display">${att}</span> / <span class="num-display">${total}</span> টি ক্লাস</p>
    </div>

    <!-- আমার ক্লাস রুটিন -->
    <h3 class="font-bold text-lg mb-3 dark:text-white bangla-text flex items-center gap-2"><span>📅</span> আমার ক্লাস রুটিন</h3>
    ${routines.length ? `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-8">
        ${Object.entries(groupedRoutines).map(([d, items]) => `
          <div class="bg-white dark:bg-gray-800 border-2 border-gray-100 dark:border-gray-700 rounded-xl overflow-hidden shadow-sm">
            <div class="bg-indigo-100 dark:bg-indigo-900/50 px-4 py-2 border-b border-indigo-200 dark:border-indigo-700">
              <h4 class="font-bold text-indigo-800 dark:text-indigo-200 bangla-text">${bnDay[d] || escapeHtml(d)}</h4>
            </div>
            <div class="divide-y divide-gray-100 dark:divide-gray-700">
              ${items.map(r => `
                <div class="p-3">
                  <div class="flex justify-between items-start gap-2">
                    <div>
                      <span class="bg-indigo-50 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 px-2 py-0.5 rounded text-xs font-bold num-display">${escapeHtml(r.time_slot)}</span>
                      <span class="font-bold text-sm dark:text-white bangla-text ml-1">${escapeHtml(courseLabel(r.course_code, r.course_name))}</span>
                    </div>
                  </div>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 bangla-text">👨‍🏫 ${escapeHtml(r.teacher_name)}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    ` : '<p class="text-gray-400 text-sm mb-8 bangla-text bg-gray-50 dark:bg-gray-800 p-4 rounded-xl text-center">এই ইয়ারের জন্য কোনো রুটিন পাওয়া যায়নি</p>'}

    <!-- হাজিরার ইতিহাস -->
    <h3 class="font-bold text-lg mb-3 dark:text-white bangla-text flex items-center gap-2"><span>📋</span> হাজিরার ইতিহাস</h3>
    <div class="space-y-1 mb-8 max-h-60 overflow-y-auto">
      ${records?.length ? records.map(r => {
        const ic = { present: '✅', absent: '❌', late: '⏰', excused: '📝' };
        return `<div class="bg-gray-50 dark:bg-gray-800 px-3 py-2 rounded-xl flex justify-between text-sm dark:text-white">
          <span class="bangla-text">${ic[r.status] || '✅'} <span class="num-display">${escapeHtml(r.attendance_sessions?.course_code ? courseLabel(r.attendance_sessions.course_code) : '-')}</span></span>
          <span class="text-gray-500 dark:text-gray-400 num-display">${escapeHtml(r.attendance_sessions?.date || '')}</span>
        </div>`;
      }).join('') : '<p class="text-gray-400 text-sm bangla-text">কোনো রেকর্ড নেই</p>'}
    </div>

    <!-- নোটিশ -->
    <h3 class="font-bold text-lg mb-3 dark:text-white bangla-text flex items-center gap-2"><span>📢</span> নোটিশ বোর্ড</h3>
    ${notices?.map(n => `
      <div class="${n.priority === 'urgent' ? 'bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500' : 'bg-pink-50 dark:bg-pink-900/20 border-l-4 border-pink-400'} p-4 rounded-r-xl mb-2 shadow-sm">
        <b class="dark:text-white bangla-text text-base">${n.priority === 'urgent' ? '🚨 ' : ''}${escapeHtml(n.title)}</b>
        <p class="text-sm text-gray-600 dark:text-gray-300 bangla-text mt-1">${escapeHtml(n.content)}</p>
      </div>`).join('') || '<p class="text-gray-400 text-sm bangla-text">কোনো নোটিশ নেই</p>'}
  `;
}

// NEW: Teacher Management (form / save / view / status)
// ============================================================
function openTeacherModal(html) {
  document.getElementById('attendanceModal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = html;
}

function showTeacherForm(id = '') {
  const t = id ? (allTeachers.find(x => x.id === id) || {}) : {};
  const isEdit = !!t.id;
  if (id && !isEdit) return toastError('শিক্ষক পাওয়া যায়নি');
  const inp = 'w-full border-2 rounded-xl p-2 dark:bg-gray-700 dark:text-white dark:border-gray-600';

  openTeacherModal(`
    <h3 class="text-xl font-bold mb-4 dark:text-white bangla-text">${isEdit ? '✏️ শিক্ষক এডিট' : '+ নতুন শিক্ষক'}</h3>
    <div class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
      <input id="tfName" value="${escapeHtml(t.name || '')}" placeholder="পূর্ণ নাম *" class="${inp} bangla-text">
      <div>
        <input id="tfUserId" value="${escapeHtml(t.user_id || '')}" placeholder="ইউজার আইডি * (লগইনের জন্য, Unique)" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" class="${inp}">
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 bangla-text">এই আইডি ও PIN দিয়ে শিক্ষক লগইন করবেন। ফাঁকা জায়গা (space) দেওয়া যাবে না।</p>
      </div>

      <div>
        <div class="relative">
          <input id="tfPin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="${isEdit ? 'নতুন PIN (বদলাতে চাইলে)' : 'PIN (৪-৬ ডিজিট) *'}" class="${inp} num-display pr-10">
          <button type="button" onclick="const p=document.getElementById('tfPin'); p.type = p.type==='password'?'text':'password';" class="absolute right-2 top-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-sm">👁️</button>
        </div>
        ${isEdit ? '<p class="text-xs text-gray-500 dark:text-gray-400 mt-1 bangla-text">PIN না বদলাতে চাইলে খালি রাখুন</p>' : ''}
      </div>

      <input id="tfNameCode" value="${escapeHtml(t.name_code || '')}" placeholder="নাম কোড" class="${inp} bangla-text">
      <input id="tfDesignation" value="${escapeHtml(t.designation || '')}" placeholder="পদবী" class="${inp} bangla-text">
      <input id="tfBCS" value="${escapeHtml(t.bcs_batch || '')}" placeholder="বিসিএস ব্যাচ" class="${inp} bangla-text">
      <input id="tfMobile" value="${escapeHtml(t.mobile || '')}" placeholder="মোবাইল নম্বর" class="${inp} num-display">
      <input id="tfEmail" value="${escapeHtml(t.email || '')}" placeholder="ইমেইল" class="${inp}">
      <input id="tfIdNo" value="${escapeHtml(t.id_no || '')}" placeholder="আইডি নং" class="${inp}">
      <input id="tfSubject" value="${escapeHtml(t.subject || '')}" placeholder="বিষয় (যেমন: Economics)" class="${inp} bangla-text">
      <textarea id="tfBiography" rows="2" placeholder="বায়োগ্রাফি" class="${inp} bangla-text">${escapeHtml(t.biography || '')}</textarea>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="saveTeacher('${escapeHtml(id)}')" class="flex-1 bg-emerald-600 text-white py-2 rounded font-bold bangla-text">সংরক্ষণ</button>
      <button onclick="closeModal()" class="flex-1 bg-gray-400 text-white py-2 rounded font-bold bangla-text">বাতিল</button>
    </div>
  `);
  document.getElementById('tfName').focus();
}

async function saveTeacher(id) {
  const val = k => (document.getElementById(k)?.value || '').trim();
  const name = val('tfName');
  const pin = banglaToEnglish(val('tfPin'));

  const profile = {
    subject: val('tfSubject') || null,
    name_code: val('tfNameCode') || null,
    designation: val('tfDesignation') || null,
    bcs_batch: val('tfBCS') || null,
    mobile: banglaToEnglish(val('tfMobile')) || null,
    email: val('tfEmail') || null,
    id_no: val('tfIdNo') || null,
    user_id: val('tfUserId').toLowerCase() || null,
    biography: val('tfBiography') || null
  };

  if (!name) return toastWarning('শিক্ষকের নাম দিন');
  if (!profile.user_id) return toastWarning('ইউজার আইডি দিন (এটি ছাড়া শিক্ষক লগইন করতে পারবেন না)');
  if (/\s/.test(profile.user_id)) return toastWarning('ইউজার আইডিতে ফাঁকা জায়গা (space) দেওয়া যাবে না');
  if (!id && pin.length < 4) return toastWarning('কমপক্ষে ৪-ডিজিটের PIN দিন');
  if (id && pin && pin.length < 4) return toastWarning('PIN কমপক্ষে ৪ ডিজিট হতে হবে (না বদলাতে চাইলে খালি রাখুন)');

  const isDup = e => /duplicate|unique/i.test(e?.message || '');
  showGlobalLoader();
  try {
    // ইউজার আইডি ইউনিক কিনা — সংরক্ষণের আগেই যাচাই (ডুপ্লিকেট হলে সতর্কবার্তা, কিছুই তৈরি/পরিবর্তন হবে না)
    {
      let q = db.from('teachers').select('id, name').eq('user_id', profile.user_id).limit(1);
      if (id) q = q.neq('id', id);
      const { data: taken, error: chkErr } = await q;
      if (chkErr) throw chkErr;
      if (taken && taken.length) {
        toastWarning('এই ইউজার আইডি আগেই ব্যবহৃত হয়েছে (' + (taken[0].name || '') + ') — অন্য আইডি দিন');
        return;
      }
    }

    if (id) {
      // এডিট: প্রোফাইল তথ্য (নাম বদলালে name_slug-ও আপডেট থাকে; তবে লগইন আর নাম/slug দিয়ে হয় না, user_id দিয়ে হয়)
      const slug = name.toLowerCase().replace(/\s+/g, '_');
      const { error } = await db.from('teachers').update({ name, name_slug: slug, ...profile }).eq('id', id);
      if (error) throw error;

      // নতুন PIN দিলে তবেই PIN বদলাবে
      if (pin) {
        const { data, error: pinErr } = await db.rpc('admin_set_teacher_pin', { p_teacher_id: id, p_pin: pin });
        if (pinErr || (data && data.ok === false)) {
          const msg = data?.message || pinErr?.message || '';
          const missing = /could not find|does not exist|PGRST202/i.test(msg + ' ' + (pinErr?.code || ''));
          toastWarning(missing
            ? 'তথ্য সংরক্ষণ হয়েছে, কিন্তু PIN বদলানো যায়নি — ডাটাবেসে PIN বদলের ফাংশন নেই'
            : 'তথ্য সংরক্ষণ হয়েছে, কিন্তু PIN বদলায়নি: ' + msg);
          closeModal();
          showAdminTab('manageTeacher');
          return;
        }
      }
    } else {
      // নতুন শিক্ষক: PIN নিরাপদভাবে আগের RPC দিয়েই তৈরি হয়
      const { data, error } = await db.rpc('admin_add_teacher', { p_name: name, p_pin: pin });
      if (error || !data || !data.ok) { toastError(data?.message || error?.message || 'ব্যর্থ'); return; }

      let newId = data.teacher_id || data.id || null;
      if (!newId) {
        const { data: found } = await db.from('teachers').select('id').eq('name', name)
          .order('created_at', { ascending: false }).limit(1);
        newId = found && found[0] ? found[0].id : null;
      }
      if (newId && Object.values(profile).some(v => v)) {
        const { error: upErr } = await db.from('teachers').update(profile).eq('id', newId);
        if (upErr) {
          toastWarning(isDup(upErr)
            ? 'শিক্ষক যোগ হয়েছে, কিন্তু ইউজার আইডি আগেই ব্যবহৃত — Edit থেকে বদলান'
            : 'শিক্ষক যোগ হয়েছে, কিন্তু অতিরিক্ত তথ্য সংরক্ষণ হয়নি: ' + upErr.message);
          closeModal();
          showAdminTab('manageTeacher');
          return;
        }
      }
    }
    toastSuccess('শিক্ষক তথ্য সংরক্ষণ হয়েছে');
    closeModal();
    showAdminTab('manageTeacher');
  } catch (e) {
    toastError(isDup(e) ? 'এই ইউজার আইডি আগেই ব্যবহৃত হয়েছে' : (e.message || 'ব্যর্থ'));
  } finally { hideGlobalLoader(); }
}

function viewTeacherProfile(id) {
  const t = allTeachers.find(x => x.id === id);
  if (!t) return;
  openTeacherModal(`
    <h3 class="text-xl font-bold mb-2 dark:text-white bangla-text">${escapeHtml(t.name)}</h3>
    <div class="space-y-2 text-sm dark:text-gray-300 bangla-text">
      <p><b>নাম কোড:</b> ${escapeHtml(t.name_code || '-')}</p>
      <p><b>পদবী:</b> ${escapeHtml(t.designation || '-')}</p>
      <p><b>বিসিএস ব্যাচ:</b> ${escapeHtml(t.bcs_batch || '-')}</p>
      <p><b>মোবাইল:</b> <span class="num-display">${escapeHtml(t.mobile || '-')}</span></p>
      <p><b>ইমেইল:</b> ${escapeHtml(t.email || '-')}</p>
      <p><b>আইডি:</b> ${escapeHtml(t.id_no || '-')}</p>
      <p><b>ইউজার আইডি:</b> ${escapeHtml(t.user_id || '-')}</p>
      <p><b>বায়োগ্রাফি:</b> ${escapeHtml(t.biography || 'নেই')}</p>
    </div>
    <button onclick="closeModal()" class="w-full mt-4 bg-gray-600 text-white py-2 rounded font-bold bangla-text">বন্ধ করুন</button>
  `);
}

async function toggleTeacherStatus(id, currentStatus) {
  const ok = await confirmAction('নিশ্চিত?', currentStatus ? 'শিক্ষক In-active করবেন?' : 'শিক্ষক Active করবেন?', 'হ্যাঁ');
  if (!ok) return;
  showGlobalLoader();
  try {
    const { error } = await db.from('teachers').update({ is_active: !currentStatus }).eq('id', id);
    if (error) throw error;
    toastSuccess('আপডেট হয়েছে');
    showAdminTab('manageTeacher');
  } catch (e) { toastError(e.message); }
  finally { hideGlobalLoader(); }
}
