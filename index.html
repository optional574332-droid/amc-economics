<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {} } };
  (function() {
    const saved = localStorage.getItem('amc_theme') || 'auto';
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved === 'dark' || (saved === 'auto' && prefersDark);
    if (isDark) document.documentElement.classList.add('dark');
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
  * { font-family: 'Hind Siliguri', sans-serif; }

  input[type="number"], input[type="tel"], input.mark-input,
  #studentRollInput, #homePinInput, #teacherUserId, #teacherPin, #ntPin, #tfUserId,
  #msRoll, #msReg, #msPhone, #msGuardianPhone,
  #edRoll, #edReg, #edPhone, #edGuardianPhone,
  #meRoll, #meSearch, #irRoll, #mapCourse, #pubCourse,
  #trackDeviceInput, #trackRollInput {
    font-family: 'Arial', 'Helvetica', 'Segoe UI', sans-serif !important;
    font-feature-settings: 'tnum' !important;
    font-variant-numeric: tabular-nums !important;
  }
  .num-display, .num-cell, .roll-display, .reg-display, .pin-display,
  span.num-display, span.num-cell {
    font-family: 'Arial', 'Helvetica', 'Segoe UI', sans-serif !important;
    font-feature-settings: 'tnum' !important;
    font-variant-numeric: tabular-nums !important;
  }

  .btn-pop { transition: all 0.15s ease; }
  .btn-pop:active { transform: scale(0.96); }
  .fade-in { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1;transform:translateY(0);} }
  .pulse-live { animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

  html.dark body { background: linear-gradient(to bottom right, #1e1b4b, #4c1d95, #831843); }

  #globalLoader {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    backdrop-filter: blur(2px); display: none;
    align-items: center; justify-content: center; z-index: 9999;
  }
  #globalLoader.active { display: flex; }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #activePinBanner { animation: bannerPulse 2.5s ease-in-out infinite; }
  @keyframes bannerPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
    50% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
  }

  .bangla-text { font-family: 'Hind Siliguri', sans-serif !important; }

  .suggestion-box {
    max-height: 240px; overflow-y: auto;
    border: 2px solid #6366f1; border-radius: 12px;
    background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
  html.dark .suggestion-box { background: #374151; border-color: #6366f1; }
  .suggestion-item {
    padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid #f3f4f6;
    transition: background 0.1s;
    display: flex; justify-content: space-between; align-items: center;
  }
  html.dark .suggestion-item { border-bottom-color: #4b5563; }
  .suggestion-item:hover, .suggestion-item.active { background: #eef2ff; }
  html.dark .suggestion-item:hover, html.dark .suggestion-item.active { background: #4f46e5; color: white; }
  .suggestion-item:last-child { border-bottom: none; }

  .marks-grid-row { transition: background 0.15s; }
  .marks-grid-row:hover { background: #f9fafb; }
  html.dark .marks-grid-row:hover { background: #374151; }

  #offlineBadge {
    position: fixed; bottom: 20px; right: 20px;
    padding: 12px 20px; border-radius: 16px; font-weight: bold;
    z-index: 9998; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: none;
  }
  #offlineBadge.active { display: block; }
  #offlineBadge.offline { background: #dc2626; color: white; }
  #offlineBadge.pending { background: #f59e0b; color: white; }

  .published-badge {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white; padding: 4px 12px; border-radius: 12px;
    font-size: 12px; font-weight: bold;
  }
  .draft-badge {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: white; padding: 4px 12px; border-radius: 12px;
    font-size: 12px; font-weight: bold;
  }

  .device-badge {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    color: #78350f;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
    display: inline-block;
  }
  html.dark .device-badge {
    background: linear-gradient(135deg, #78350f, #92400e);
    color: #fef3c7;
  }

  .suspicious-flag {
    background: linear-gradient(135deg, #fecaca, #fca5a5);
    color: #7f1d1d;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: bold;
    display: inline-block;
  }
  html.dark .suspicious-flag {
    background: linear-gradient(135deg, #7f1d1d, #991b1b);
    color: #fecaca;
  }

  .tracking-card {
    background: white;
    border-left: 4px solid #f59e0b;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    transition: transform 0.15s;
  }
  .tracking-card:hover { transform: translateX(4px); }
  html.dark .tracking-card { background: #374151; border-left-color: #fbbf24; }
</style>

let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();

  const btn = document.getElementById('installBtn');
  if (btn) {
    btn.classList.remove('hidden');
    console.log('✅ PWA Install prompt ready');

async function installPWA() {
  if (!deferredPrompt) {
    Swal.fire({
      title: '📲 অ্যাপ ইনস্টল',
      html: `
        <div class="text-left text-sm bangla-text">

function banglaToEnglish(str) {
  const b = '০১২৩৪৫৬৭৮৯', e = '0123456789';
  return String(str).replace(/[০-৯]/g, (d) => e[b.indexOf(d)]);
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function sortStudents(students) {
  return students.slice().sort((a, b) => {
    const ar = String(a.class_roll || '').trim();
    const br = String(b.class_roll || '').trim();
    const aM = ar.match(/^([A-Za-z-]*)(\d+)/);
    const bM = br.match(/^([A-Za-z-]*)(\d+)/);
    if (!aM || !bM) return ar.localeCompare(br);
    const aP = aM[1] || '', bP = bM[1] || '';
    const aN = parseInt(aM[2], 10), bN = parseInt(bM[2], 10);
    if (!aP && bP) return -1;
    if (aP && !bP) return 1;
    if (aP === bP) return aN - bN;
    return aP.localeCompare(bP);
  });
}

function shortDevice(deviceId) {
  if (!deviceId) return '-';
  return deviceId.substring(0, 10);
}

function detectSuspicious(records) {
  const flags = [];
  const byDevice = {};
  records.forEach(r => {
    if (!r.device_id) return;
    if (!byDevice[r.device_id]) byDevice[r.device_id] = [];
    byDevice[r.device_id].push(r);
  });
  Object.entries(byDevice).forEach(([devId, recs]) => {
    const uniqueStudents = new Set(recs.map(r => r.student_id)).size;
    if (uniqueStudents >= 5) {
      flags.push({
        deviceId: devId,
        type: 'many_students',
        count: uniqueStudents,
        message: `একই device থেকে ${uniqueStudents} জন ছাত্রের হাজিরা`
      });
    }
    const sorted = recs.sort((a, b) => new Date(a.marked_at) - new Date(b.marked_at));
    for (let i = 0; i < sorted.length - 1; i++) {
      const diff = new Date(sorted[i+1].marked_at) - new Date(sorted[i].marked_at);
      if (diff < 60000 && sorted[i].student_id !== sorted[i+1].student_id) {
        flags.push({
          deviceId: devId,
          type: 'rapid_fire',
          message: `১ মিনিটের মধ্যে ২টি হাজিরা (${new Date(sorted[i].marked_at).toLocaleTimeString('en-GB')})`
        });
        break;
      }
    }
  });
  return flags;
}

function updateOnlineStatus() {
  const badge = document.getElementById('offlineBadge');
  if (!navigator.onLine) {
    badge.classList.add('active', 'offline');
    badge.classList.remove('pending');
    badge.innerHTML = '📴 অফলাইন — হাজিরা local-এ জমা হবে';
  } else {
    const pending = getOfflineQueue().length;
    if (pending > 0) {
      badge.classList.add('active', 'pending');
      badge.classList.remove('offline');
      badge.innerHTML = `⏳ ${pending} টি হাজিরা sync হচ্ছে...`;
      syncOfflineQueue();
    } else {
      badge.classList.remove('active', 'offline', 'pending');
    }
  }
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

function getOfflineQueue() {
  try {
    const q = localStorage.getItem('amc_offline_queue');
    return q ? JSON.parse(q) : [];
  } catch (e) { return []; }
}
function saveOfflineQueue(q) { localStorage.setItem('amc_offline_queue', JSON.stringify(q)); }
function queueAttendance(pin, roll) {
  const q = getOfflineQueue();
  q.push({ pin, roll, deviceId, timestamp: Date.now() });
  saveOfflineQueue(q);
  updateOnlineStatus();
}
let isSyncingOffline = false;
async function syncOfflineQueue() {
  if (isSyncingOffline) return;          // একসাথে একাধিক sync এবং অসীম লুপ ঠেকায়
  const q = getOfflineQueue();
  if (!q.length) return;
  isSyncingOffline = true;
  try {
    const remaining = [];
    let synced = 0;
    for (const item of q) {
      try {
        const { data, error } = await db.rpc('student_mark_attendance_v2', {
          p_pin: item.pin, p_roll: item.roll, p_device_id: item.deviceId
        });
        if (error || !data?.ok) {
          remaining.push(item);
        } else {
          synced++;
        }
      } catch (e) {
        remaining.push(item);
      }
    }
    // sync চলাকালীন নতুন যে হাজিরা queue-তে যোগ হয়েছে তা হারিয়ে যাবে না
    const added = getOfflineQueue().slice(q.length);
    saveOfflineQueue(remaining.concat(added));
    if (synced > 0) toastSuccess(`${synced} টি হাজিরা sync হয়েছে`);
    updateOnlineStatus();
  } finally {
    isSyncingOffline = false;
  }
}

let banglaFontLoaded = false;
let banglaFontBase64 = null;
async function loadBanglaFont() {
  if (banglaFontLoaded) return banglaFontBase64;
  try {
    const r = await fetch('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/hindsiliguri/HindSiliguri-Regular.ttf');
    if (!r.ok) return null;
    const b = await r.arrayBuffer();
    const bytes = new Uint8Array(b);
    let bin = '';
    for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
    banglaFontBase64 = btoa(bin);
    banglaFontLoaded = true;
    return banglaFontBase64;
  } catch (e) { return null; }
}
async function setupBanglaFont(doc) {

      doc.setFont('HindSiliguri');

}

let courseInfoCache = null;
let courseInfoLoadedAt = 0;

async function getCourseInfoMap(force = false) {
  if (!force && courseInfoCache && (Date.now() - courseInfoLoadedAt) < 120000) return courseInfoCache;
  const map = {};
  try {
    const { data: oldC } = await db.from('courses').select('course_code, course_name');
    (oldC || []).forEach(c => {
      const k = String(c.course_code || '').trim().toUpperCase();
      if (k && c.course_name) map[k] = { name: c.course_name, short: '' };
    });
  } catch (e) { console.warn('courses load', e); }
  try {
    const { data: newC } = await db.from('courses_new').select('course_code, course_name, short_code');
    (newC || []).forEach(c => {
      const k = String(c.course_code || '').trim().toUpperCase();
      if (!k) return;
      map[k] = { name: c.course_name || (map[k] && map[k].name) || '', short: c.short_code || '' };
    });
  } catch (e) { console.warn('courses_new load', e); }
  courseInfoCache = map;
  courseInfoLoadedAt = Date.now();
  return map;
}
function invalidateCourseInfo() { courseInfoCache = null; courseInfoLoadedAt = 0; }

function courseInfo(code) {
  const k = String(code || '').trim().toUpperCase();
  return (courseInfoCache && courseInfoCache[k]) || { name: '', short: '' };
}
// ছোট নাম থাকলে ছোট নাম, না থাকলে পুরো নাম

let teacherDirLoading = false;  // নেটওয়ার্ক রিকোয়েস্ট চলছে কিনা
try {

// is_active: null / খালি / অনুপস্থিত হলে শিক্ষক "সক্রিয়" ধরা হবে। শুধু স্পষ্টভাবে false/0/'inactive' হলে লুকানো হবে।
function isTeacherActive(t) {
  const v = t ? t.is_active : undefined;
  if (v === null || v === undefined || v === '') return true;
  if (v === false || v === 0) return false;
  const str = String(v).trim().toLowerCase();
  return !(str === 'false' || str === '0' || str === 'inactive' || str === 'no');
}

function withTimeout(promise, ms) {
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_, reject) => setTimeout(() => reject(new Error('নেটওয়ার্ক ধীর — সময় শেষ হয়ে গেছে')), ms))
  ]);
}

async function fetchTeacherDirectoryData(retries = 2) {
  let lastErr = null;
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      // শুধু প্রয়োজনীয় কলাম — যাতে PIN সংক্রান্ত কোনো তথ্য পাবলিকলি না আসে
      const res = await withTimeout(
        db.from('teachers').select('id, name, designation, biography, mobile, is_active, subject').order('name'),
        12000
      );
      if (res.error) throw res.error;
      return res.data || [];
    } catch (err) {
      lastErr = err;
      if (attempt < retries) await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
    }
  }
  throw lastErr || new Error('অজানা ত্রুটি');
}

  } catch (err) {
    if (teacherDirCache) {
      // পুরোনো তালিকা আছে — সেটাই দেখাও, শুধু ছোট সতর্কতা

        </div>`;
    }
  } finally {
    teacherDirLoading = false;
  }
}

async function submitPin() {
  const pin = banglaToEnglish(document.getElementById('homePinInput').value.trim());
  if (pin.length !== 4) return toastWarning('৪-ডিজিটের PIN দিন');

  if (!navigator.onLine) {
    const cached = localStorage.getItem('amc_last_session_' + pin);
    if (cached) {
      currentPinSession = JSON.parse(cached);
      return showAttendanceForm();
    }
    return showModal('📴', 'অফলাইন', 'ইন্টারনেট নেই। আগে একবার অনলাইনে PIN দিন।', 'red');
  }

  showGlobalLoader();
  try {
    const { data: sessions } = await db.from('attendance_sessions')
      .select('*').eq('pin', pin).eq('is_active', true)
      .gte('expires_at', new Date().toISOString())
      .order('created_at', { ascending: false }).limit(1);
    if (!sessions || !sessions.length) {
      return showModal('❌', 'ভুল PIN', 'এই PIN সঠিক নয় বা মেয়াদ শেষ', 'red');
    }
    currentPinSession = sessions[0];
    await enrichPinSession(currentPinSession);   // শিক্ষকের নাম ও কোর্সের নাম যোগ
    localStorage.setItem('amc_last_session_' + pin, JSON.stringify(currentPinSession));
    showAttendanceForm();
  } finally { hideGlobalLoader(); }
}

// নিশ্চিতকরণ স্ক্রিনের জন্য: শিক্ষকের নাম + কোর্সের নাম সেশন অবজেক্টে বসানো (ব্যর্থ হলেও হাজিরা আটকাবে না)
async function enrichPinSession(sess) {
  if (!sess) return sess;
  try {
    if (sess.teacher_id && !sess.teacher_name) {
      const { data: t } = await db.from('teachers').select('name').eq('id', sess.teacher_id).maybeSingle();
      if (t && t.name) sess.teacher_name = t.name;
    }
  } catch (e) { console.warn('teacher name', e); }
  try {
    await getCourseInfoMap();
    const info = courseInfo(sess.course_code);
    sess.course_name = info.name || info.short || sess.course_name || '';
  } catch (e) { console.warn('course name', e); }
  return sess;
}

// 🎯 নতুন: সেশন ও ইয়ার ফিল্টার + Exact Match + Partial Match
// ============================================================
async function loadStudentSuggestions(query) {
  const s = currentPinSession;
  if (!s) return;

  // অফলাইন হ্যান্ডলিং
  if (!navigator.onLine) {
    const cached = localStorage.getItem('amc_students_' + s.session + '_' + s.year);
    if (cached) {
      const all = JSON.parse(cached);
      let filtered = all.filter(st =>
        (st.class_roll && st.class_roll.toString() === query) ||
        (st.reg_no && st.reg_no.toString() === query)
      );
      if (filtered.length === 0) {
        filtered = all.filter(st =>
          (st.class_roll && st.class_roll.toString().includes(query)) ||
          (st.reg_no && st.reg_no.toString().includes(query))
        );
      }
      return renderSuggestions(filtered.slice(0, 10));
    }
    return;
  }

  try {
    // ১. Exact Match (হুবহু মিল) — শুধু সেই সেশন ও ইয়ারে
    let { data: exactMatch } = await db.from('students')
      .select('id, name, class_roll, reg_no')
      .eq('session', s.session)
      .eq('year', s.year)
      .eq('status', 'active')
      .or(`class_roll.eq.${query},reg_no.eq.${query}`)
      .limit(5);

    // ২. Exact Match না পেলে Partial Match — তবুও সেশন ও ইয়ার সীমিত
    if (!exactMatch || exactMatch.length === 0) {
      const { data: partialMatch } = await db.from('students')
        .select('id, name, class_roll, reg_no')
        .eq('session', s.session)
        .eq('year', s.year)
        .eq('status', 'active')
        .or(`class_roll.ilike.%${query}%,reg_no.ilike.%${query}%`)
        .limit(10);
      exactMatch = partialMatch || [];
    }

    renderSuggestions(exactMatch);
  } catch (err) {
    console.error('Suggestion error:', err);
    renderSuggestions([]);
  }
}

function renderSuggestions(students) {
  if (!students || !students.length) {
    hideSuggestionBox();
    document.getElementById('studentPreview').innerHTML = `<p class="text-red-500 text-sm font-bold bangla-text">❌ এই রোলে কোনো ছাত্র নেই</p>`;
    document.getElementById('submitAttendanceBtn').disabled = true;
    return;
  }
  const sorted = sortStudents(students);
  const box = document.getElementById('suggestionBox');
  box.classList.remove('hidden');
  box.className = 'suggestion-box mb-3';
  box.innerHTML = sorted.map(stu => `
    <div class="suggestion-item" data-id="${escapeHtml(stu.id)}" data-roll="${escapeHtml(stu.class_roll)}" data-name="${escapeHtml(stu.name)}" data-reg="${escapeHtml(stu.reg_no || '')}">
      <div>
        <div class="font-bold text-sm bangla-text"><span class="num-display">${escapeHtml(stu.class_roll)}</span> — ${escapeHtml(stu.name)}</div>
        <div class="text-xs text-gray-500 dark:text-gray-400 bangla-text">রেজি: <span class="num-display">${escapeHtml(stu.reg_no || '-')}</span></div>
      </div>
      <span class="text-indigo-500">›</span>
    </div>`).join('');
  box.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('click', () => selectStudent(item.dataset.id, item.dataset.roll, item.dataset.name, item.dataset.reg));
  });
}

async function findAndSubmit() {
  const roll = banglaToEnglish(document.getElementById('studentRollInput').value.trim());
  if (!roll) return toastWarning('রোল লিখুন');

  const s = currentPinSession;
  if (!s) return toastError('সেশন পাওয়া যায়নি, আবার PIN দিন');

  let student = null;

  // অফলাইন
  if (!navigator.onLine) {
    const cached = localStorage.getItem('amc_students_' + s.session + '_' + s.year);
    if (cached) {
      const all = JSON.parse(cached);
      student = all.find(st => st.class_roll === roll || st.reg_no === roll);
    }
  } else {
    // ১. Exact Match প্রথমে
    const { data: exactData } = await db.from('students')
      .select('id, name, class_roll, reg_no')
      .eq('session', s.session)
      .eq('year', s.year)
      .eq('status', 'active')
      .or(`class_roll.eq.${roll},reg_no.eq.${roll}`)
      .limit(1);

    if (exactData && exactData.length > 0) {
      student = exactData[0];
    } else {
      // ২. Exact না পেলে Partial Match
      const { data: partialData } = await db.from('students')
        .select('id, name, class_roll, reg_no')
        .eq('session', s.session)
        .eq('year', s.year)
        .eq('status', 'active')
        .or(`class_roll.ilike.%${roll}%,reg_no.ilike.%${roll}%`)
        .limit(1);
      
      if (partialData && partialData.length > 0) {
        student = partialData[0];
      }
    }
  }

  if (!student) {
    document.getElementById('studentPreview').innerHTML = `<p class="text-red-500 text-center text-sm font-bold bangla-text">❌ এই রোলে (${escapeHtml(roll)}) কোনো ছাত্র নেই</p>`;
    return;
  }

  if (navigator.onLine && (!s.teacher_name || !s.course_name)) await enrichPinSession(s);
  showConfirmationScreen(student, s);
}

// ============================================================
// কোর্স ড্রপডাউন: ডুপ্লিকেট কোর্স বাদ দেওয়ার হেল্পার
// ============================================================
function dedupeCourses(list) {
  const seen = new Set();
  const unique = [];
  (list || []).forEach(c => {
    const key = `${c.course_code}|${c.session}|${c.year}`;
    if (!seen.has(key)) { seen.add(key); unique.push(c); }
  });
  return unique;
}

// ✅ Helper Functions for Dropdown + Non-Major Manual Entry
// ============================================================
function attrEsc(v) {
  return String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function loadAcademicCoursesForMap() {
  const { data } = await db.from('courses_new').select('*').order('course_code');
  const sel = document.getElementById('mapCourseSelect');
  if (sel) {
    sel.innerHTML = '<option value="">কোর্স সিলেক্ট করুন</option>' + 
      (data || []).map(c => `<option value="${attrEsc(c.course_code)}|${attrEsc(c.course_name)}">${escapeHtml(c.course_code)} - ${escapeHtml(c.course_name)}</option>`).join('') +
      '<option value="NON_MAJOR">✍️ Other / Non-Major (Manual Entry)</option>';
  }
}

function fillCourseDetails() {
  const sel = document.getElementById('mapCourseSelect');
  const codeInput = document.getElementById('mapCourse');
  const nameInput = document.getElementById('mapCourseName');

  if (!sel || !sel.value) {
    codeInput.value = ''; nameInput.value = '';
    codeInput.readOnly = true; nameInput.readOnly = true;
    codeInput.classList.add('bg-gray-100', 'dark:bg-gray-600');
    nameInput.classList.add('bg-gray-100', 'dark:bg-gray-600');
    codeInput.placeholder = "কোর্স কোড";
    nameInput.placeholder = "কোর্সের নাম";
    return;
  }

  if (sel.value === 'NON_MAJOR') {
    codeInput.value = ''; nameInput.value = '';
    codeInput.readOnly = false; nameInput.readOnly = false;
    codeInput.classList.remove('bg-gray-100', 'dark:bg-gray-600');
    nameInput.classList.remove('bg-gray-100', 'dark:bg-gray-600');
    codeInput.placeholder = "ম্যানুয়ালি কোর্স কোড লিখুন";
    nameInput.placeholder = "ম্যানুয়ালি কোর্সের নাম লিখুন";
    codeInput.focus();
  } else {
    const idx = sel.value.indexOf('|');
    const code = idx === -1 ? sel.value : sel.value.slice(0, idx);
    const name = idx === -1 ? '' : sel.value.slice(idx + 1);
    codeInput.value = code; nameInput.value = name;
    codeInput.readOnly = true; nameInput.readOnly = true;
    codeInput.classList.add('bg-gray-100', 'dark:bg-gray-600');
    nameInput.classList.add('bg-gray-100', 'dark:bg-gray-600');
  }
}

async function loadAcademicCoursesForRoutine() {
  const year = document.getElementById('rtYear').value;
  const sel = document.getElementById('rtCourseSelect');
  const codeInput = document.getElementById('rtCourse');
  
  if (!year) {
    if (sel) sel.innerHTML = '<option value="">কোর্স সিলেক্ট করুন</option>';
    codeInput.value = '';
    codeInput.readOnly = true;
    codeInput.classList.add('bg-gray-100', 'dark:bg-gray-600');
    return;
  }

  let cat = 'Honours';
  if (year === 'XI' || year === 'XII') cat = 'Higher Secondary';
  else if (year === 'Preliminary' || year === 'Final') cat = 'Masters';

  const { data } = await db.from('courses_new').select('*').eq('category', cat).eq('year_name', year).order('course_code');
  if (sel) {
    sel.innerHTML = '<option value="">কোর্স সিলেক্ট করুন</option>' + 
      (data || []).map(c => `<option value="${attrEsc(c.course_code)}">${escapeHtml(c.course_code)} - ${escapeHtml(c.course_name)}</option>`).join('') +
      '<option value="NON_MAJOR">✍️ Other / Non-Major (Manual Entry)</option>';
  }
  codeInput.value = '';
  codeInput.readOnly = true;
  codeInput.classList.add('bg-gray-100', 'dark:bg-gray-600');
}

function fillRoutineCourse() {
  const sel = document.getElementById('rtCourseSelect');
  const codeInput = document.getElementById('rtCourse');

  if (!sel || !sel.value) {
    codeInput.value = ''; codeInput.readOnly = true;
    codeInput.classList.add('bg-gray-100', 'dark:bg-gray-600');
    codeInput.placeholder = "কোর্স কোড";
    return;
  }

  if (sel.value === 'NON_MAJOR') {
    codeInput.value = ''; codeInput.readOnly = false;
    codeInput.classList.remove('bg-gray-100', 'dark:bg-gray-600');

    codeInput.focus();
  } else {
    codeInput.value = sel.value; codeInput.readOnly = true;
    codeInput.classList.add('bg-gray-100', 'dark:bg-gray-600');

}

// ---------- ক্যাটাগরি → ইয়ার ----------
const AC_CATEGORY_ORDER = ['Higher Secondary', 'Honours', 'Masters'];
const AC_YEAR_MAP = {
  'Higher Secondary': ['XI', 'XII'],
  'Honours': ['1st Year', '2nd Year', '3rd Year', '4th Year'],
  'Masters': ['Preliminary', 'Final']
};

function acFillYears(catId, yearId, selected) {
  const cat = document.getElementById(catId)?.value;
  const ySel = document.getElementById(yearId);
  if (!ySel) return;
  const years = AC_YEAR_MAP[cat] || [];
  ySel.innerHTML = years.map(y => `<option value="${attrEsc(y)}"${y === selected ? ' selected' : ''}>${escapeHtml(y)}</option>`).join('');
}

// ---------- কোর্স তালিকা ----------
let acCoursesCache = [];

async function loadAcademicCourseList() {
  const box = document.getElementById('acCourseList');
  if (!box) return;
  box.innerHTML = `<div class="flex flex-col items-center justify-center py-8 gap-3"><div class="w-9 h-9 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div><p class="text-gray-500 dark:text-gray-400 bangla-text text-sm">লোড হচ্ছে...</p></div>`;
  try {
    const res = await withTimeout(db.from('courses_new').select('*').order('course_code'), 12000);
    if (res.error) throw res.error;
    acCoursesCache = res.data || [];
    renderAcademicCourseList();
  } catch (err) {
    box.innerHTML = `
      <div class="text-center py-6">
        <p class="text-red-500 bangla-text mb-2">❌ তালিকা লোড হয়নি</p>
        <p class="text-xs text-gray-400 mb-3">${escapeHtml(err.message || '')}</p>
        <button onclick="loadAcademicCourseList()" class="bg-teal-600 text-white px-4 py-2 rounded-xl font-bold btn-pop bangla-text">🔄 আবার চেষ্টা করুন</button>
      </div>`;
  }
}

function renderAcademicCourseList() {
  const box = document.getElementById('acCourseList');
  if (!box) return;
  const filterCat = document.getElementById('acFilterCategory')?.value || '';
  const items = acCoursesCache.map((c, idx) => ({ c, idx })).filter(x => !filterCat || x.c.category === filterCat);
  const cnt = document.getElementById('acCourseCount');
  if (cnt) cnt.textContent = `(${items.length})`;

  if (!items.length) {
    box.innerHTML = '<p class="text-center text-gray-400 py-6 bangla-text text-sm">কোনো কোর্স যোগ করা হয়নি</p>';
    return;
  }

  const catRank = c => { const i = AC_CATEGORY_ORDER.indexOf(c.category); return i === -1 ? 99 : i; };
  const yearRank = c => { const i = (AC_YEAR_MAP[c.category] || []).indexOf(c.year_name); return i === -1 ? 99 : i; };
  items.sort((x, y) =>
    catRank(x.c) - catRank(y.c) ||
    yearRank(x.c) - yearRank(y.c) ||
    String(x.c.course_code || '').localeCompare(String(y.c.course_code || ''), undefined, { numeric: true })
  );

  const groups = {};
  items.forEach(x => {
    const key = `${x.c.category || '—'} · ${x.c.year_name || '—'}`;
    (groups[key] = groups[key] || []).push(x);
  });

  box.innerHTML = Object.entries(groups).map(([title, list]) => `
    <div class="mb-4">
      <p class="text-xs font-bold text-teal-700 dark:text-teal-300 mb-1 bangla-text">${escapeHtml(title)} <span class="text-gray-400">(${list.length})</span></p>
      ${list.map(({ c, idx }) => `
        <div class="flex items-center justify-between gap-2 bg-gray-50 dark:bg-gray-700 px-3 py-2 rounded-lg mb-1">
          <div class="min-w-0 flex-1">
            <p class="font-bold text-sm dark:text-white bangla-text break-words"><span class="num-display">${escapeHtml(c.course_code)}</span> - ${escapeHtml(c.short_code || c.course_name || '')}</p>
            ${c.short_code && c.course_name ? `<p class="text-xs text-gray-500 dark:text-gray-400 bangla-text break-words">${escapeHtml(c.course_name)}</p>` : ''}
          </div>
          <button onclick="editAcademicCourse(${idx})" class="bg-amber-100 text-amber-700 hover:bg-amber-500 hover:text-white px-2 py-1 rounded text-sm transition btn-pop" title="Edit">✏️</button>
          <button onclick="deleteAcademicCourse(${idx})" class="bg-red-100 text-red-600 hover:bg-red-600 hover:text-white px-2 py-1 rounded text-sm transition btn-pop" title="Delete">🗑️</button>
        </div>`).join('')}
    </div>`).join('');
}

// কোন কোর্স কোথায় ব্যবহৃত হচ্ছে (ম্যাপিং / রুটিন / হাজিরা সেশন)
async function getCourseUsage(code) {
  const codes = [...new Set([String(code), String(code).toUpperCase()])];
  const out = { mapped: 0, routine: 0, sessions: 0 };
  try {
    const { data } = await db.from('teacher_courses').select('id, class_day, time_slot').in('course_code', codes);
    (data || []).forEach(r => { out.mapped++; if (r.class_day && r.time_slot) out.routine++; });
  } catch (e) { console.warn(e); }
  try {
    const { data, error } = await db.from('class_routines').select('id').in('course_code', codes);
    if (!error) out.routine += (data || []).length;
  } catch (e) { /* টেবিল না থাকলে সমস্যা নেই */ }
  try {
    const { count } = await db.from('attendance_sessions').select('id', { count: 'exact', head: true }).in('course_code', codes);
    out.sessions = count || 0;
  } catch (e) { console.warn(e); }
  return out;
}

function acMatch(q, c) {
  if (c.id !== undefined && c.id !== null) return q.eq('id', c.id);
  return q.eq('category', c.category).eq('year_name', c.year_name).eq('course_code', c.course_code);
}

    showCancelButton: true,

    cancelButtonText: 'বাতিল',
    confirmButtonColor: '#0d9488',
    focusConfirm: false,
    didOpen: () => {
      const fill = (sel) => {

    }

  if (!res.isConfirmed) return;
  const v = res.value;

  const dup = acCoursesCache.some((o, i) => i !== idx && o.category === v.category && o.year_name === v.year_name && String(o.course_code).toLowerCase() === v.course_code.toLowerCase());

  showGlobalLoader();

      if (u.mapped || u.routine || u.sessions) {

        });

    await loadAcademicCourseList();
  } catch (e) { toastError(e.message || 'আপডেট ব্যর্থ'); }
  finally { hideGlobalLoader(); }

// ROUTINE CONFLICT DETECTION (একই শিক্ষক / রুম / কোর্স একই সময়ে নয়)
// ============================================================
function normKey(v) { return String(v ?? '').trim().toLowerCase(); }

async function checkScheduleConflict({ table, teacherId, courseCode, day, time, room }) {
  const dayCol = table === 'class_routines' ? 'day_name' : 'class_day';
  const { data, error } = await db.from(table).select('*').eq(dayCol, day).eq('time_slot', time);
  if (error) throw error;
  const rows = data || [];

  const tRow = rows.find(r => String(r.teacher_id) === String(teacherId));
  const cRow = rows.find(r => normKey(r.course_code) === normKey(courseCode));
  const rRow = room ? rows.find(r => normKey(r.room_no) === normKey(room)) : null;
  if (!tRow && !cRow && !rRow) return [];

  await getCourseInfoMap();
  const ids = [...new Set([tRow, cRow, rRow].filter(Boolean).map(r => r.teacher_id).filter(Boolean))];
  const nameOf = {};
  if (ids.length) {
    const { data: ts } = await db.from('teachers').select('id, name').in('id', ids);
    (ts || []).forEach(t => { nameOf[t.id] = t.name; });
  }
  const out = [];
  if (tRow) out.push(`👨‍🏫 এই শিক্ষক এই সময়ে আগেই <b>${escapeHtml(courseLabel(tRow.course_code))}</b> ক্লাসে বুক আছেন।`);
  if (rRow) out.push(`🏫 রুম <b>${escapeHtml(room)}</b> এই সময়ে আগেই বুক আছে (${escapeHtml(courseLabel(rRow.course_code))}, ${escapeHtml(nameOf[rRow.teacher_id] || 'অজানা শিক্ষক')})।`);
  if (cRow) out.push(`📚 কোর্স <b>${escapeHtml(courseLabel(cRow.course_code))}</b> এই সময়ে আগেই বরাদ্দ আছে (${escapeHtml(nameOf[cRow.teacher_id] || 'অজানা শিক্ষক')})।`);
  return out;
}

function showConflictAlert(list, day, time) {
  return Swal.fire({
    icon: 'warning',
    title: '⚠️ Conflict!',
    html: `<div style="text-align:left;font-size:14px">
      <p style="margin-bottom:8px"><b>এই শিক্ষক / রুম / কোর্স এই সময়ে আগেই বুক করা আছে।</b></p>
      <p style="margin-bottom:8px;color:#6b7280">${escapeHtml(day)} · ${escapeHtml(time)}</p>
      ${list.map(t => `<p style="margin:6px 0">${t}</p>`).join('')}
      <p style="margin-top:10px;color:#6b7280;font-size:12px">অন্য দিন/সময় বা অন্য শিক্ষক বেছে নিন। কিছুই সংরক্ষণ হয়নি।</p>
    </div>`,
    confirmButtonText: 'ঠিক আছে',
    confirmButtonColor: '#dc2626'
  });
}

async function saveRoutine() {
  const day = document.getElementById('rtDay').value;
  const time = document.getElementById('rtTime').value.trim();
  const year = document.getElementById('rtYear').value;
  const course = document.getElementById('rtCourse').value.trim();
  const teacher = document.getElementById('rtTeacher').value;
  const room = document.getElementById('rtRoom').value.trim();
  let cat = 'Honours';
  if (year === 'XI' || year === 'XII') cat = 'Higher Secondary';
  else if (year === 'Preliminary' || year === 'Final') cat = 'Masters';
  if (!time || !year || !course || !teacher) return toastWarning('সময়, ইয়ার, কোর্স ও শিক্ষক দিন');

  // ⚠️ কনফ্লিক্ট যাচাই — ডাটাবেসে সেভ করার আগেই
  if (day && time) {
    showGlobalLoader();
    let conflicts;
    try {
      conflicts = await checkScheduleConflict({ table: 'class_routines', teacherId: teacher, courseCode: course, day, time, room });
    } catch (e) {
      hideGlobalLoader();
      return toastError('কনফ্লিক্ট যাচাই করা যায়নি: ' + (e.message || 'নেটওয়ার্ক সমস্যা'));
    }
    hideGlobalLoader();
    if (conflicts.length) return showConflictAlert(conflicts, day, time);
  }

  showGlobalLoader();
  try {
    const { error } = await db.from('class_routines').insert([{
      day_name: day, time_slot: time, year_name: year, course_code: course,
      teacher_id: teacher, room_no: room, category: cat
    }]);
    if (error) throw error;
    toastSuccess('রুটিনে যোগ হয়েছে');
    document.getElementById('rtTime').value = '';
    document.getElementById('rtCourseSelect').value = '';
    fillRoutineCourse();
    document.getElementById('rtRoom').value = '';
  } catch (e) { toastError(e.message); }
  finally { hideGlobalLoader(); }
}

          <button class="delete-teacher-btn bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold bangla-text" data-id="${escapeHtml(t.id)}" data-name="${escapeHtml(t.name)}">🗑️</button>

function editTeacher(id, name) {
  document.getElementById('attendanceModal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = `
    <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-3 bangla-text">✏️ শিক্ষকের নাম</h3>
    <input id="editTeacherName" value="${escapeHtml(name)}" class="w-full border-2 rounded-xl p-3 mb-3 dark:bg-gray-700 dark:text-white dark:border-gray-600 bangla-text">
    <div id="editTeacherStatus" class="text-sm mb-3 bangla-text"></div>
    <button id="saveTeacherEditBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold btn-pop bangla-text">💾</button>
    <button onclick="closeModal()" class="w-full mt-2 text-gray-500 dark:text-gray-400 py-2 text-sm bangla-text">বাতিল</button>
  `;
  document.getElementById('saveTeacherEditBtn').addEventListener('click', async () => {
    const nn = document.getElementById('editTeacherName').value.trim();
    const st = document.getElementById('editTeacherStatus');
    if (!nn) { st.innerHTML = '<p class="text-red-500 bangla-text">❌ নাম দিন</p>'; return; }
    const slug = nn.toLowerCase().replace(/\s+/g, '_');
    const { error } = await db.from('teachers').update({ name: nn, name_slug: slug }).eq('id', id);
    if (error) { st.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(error.message)}</p>`; return; }
    closeModal();
    toastSuccess('আপডেট');
    loadTeachers();
  });
  document.getElementById('editTeacherName').focus();
}

async function deleteTeacher(id, name) {
  const ok = await confirmAction('শিক্ষক মুছবেন?', `"${name}" কে?`);
  if (!ok) return;
  showGlobalLoader();
  try {
    const { error } = await db.from('teachers').delete().eq('id', id);
    if (error) return toastError(error.message);
    toastSuccess('মুছে ফেলা হয়েছে');
    loadTeachers();
  } finally { hideGlobalLoader(); }
}

let pendingExcelStudents = null;
async function previewExcel() {
  const file = document.getElementById('excelFile')?.files[0];
  if (!file) return toastWarning('ফাইল সিলেক্ট করুন');
  const area = document.getElementById('excelPreviewArea');
  area.innerHTML = '<p class="text-center py-4 dark:text-gray-300 bangla-text">⏳...</p>';
  const session = document.getElementById('asSession').value.trim();
  const year = document.getElementById('asYear').value;
  if (!session) { area.innerHTML = '<p class="text-red-500 text-center bangla-text">❌ সেশন লিখুন</p>'; return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      const valid = [], dup = [], inv = [];
      const sR = new Set(), sG = new Set();
      rows.slice(1).forEach((r, i) => {
        const n = i + 2;
        const roll = String(r[0] || '').trim();
        const reg = String(r[1] || '').trim();
        const name = String(r[2] || '').trim();
        if (!roll || !name) { inv.push({ row: n }); return; }
        if (sR.has(roll)) { dup.push({ row: n, roll }); return; }
        if (reg && sG.has(reg)) { dup.push({ row: n, roll, reg }); return; }
        sR.add(roll);
        if (reg) sG.add(reg);
        valid.push({ session, year, class_roll: roll, reg_no: reg || null, name, status: 'active' });
      });
      let ex = [];
      if (valid.length) {
        const { data: existing } = await db.from('students').select('class_roll').eq('session', session).eq('year', year).in('class_roll', valid.map(v => v.class_roll));
        if (existing) { const s = new Set(existing.map(e => e.class_roll)); ex = valid.filter(v => s.has(v.class_roll)); }
      }
      const dbR = new Set(ex.map(e => e.class_roll));
      const finalV = valid.filter(v => !dbR.has(v.class_roll));
      pendingExcelStudents = finalV;
      area.innerHTML = `
        <div class="bg-white dark:bg-gray-700 border-2 border-indigo-200 dark:border-indigo-700 rounded-xl p-4 space-y-3">
          <h4 class="font-bold text-sm text-gray-700 dark:text-white bangla-text">📊 রিপোর্ট</h4>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="bg-emerald-50 dark:bg-emerald-900/30 p-2 rounded-lg">
              <p class="text-emerald-700 dark:text-emerald-300 font-bold text-xs bangla-text">✅ সঠিক</p>
              <p class="text-2xl font-bold text-emerald-800 dark:text-emerald-200 num-display">${finalV.length}</p>
            </div>
            <div class="bg-amber-50 dark:bg-amber-900/30 p-2 rounded-lg">
              <p class="text-amber-700 dark:text-amber-300 font-bold text-xs bangla-text">⚠️ Dup</p>
              <p class="text-2xl font-bold text-amber-800 dark:text-amber-200 num-display">${dup.length}</p>
            </div>
            <div class="bg-red-50 dark:bg-red-900/30 p-2 rounded-lg">
              <p class="text-red-700 dark:text-red-300 font-bold text-xs bangla-text">❌ Invalid</p>
              <p class="text-2xl font-bold text-red-800 dark:text-red-200 num-display">${inv.length}</p>
            </div>
            <div class="bg-orange-50 dark:bg-orange-900/30 p-2 rounded-lg">
              <p class="text-orange-700 dark:text-orange-300 font-bold text-xs bangla-text">🔁 DB-তে</p>
              <p class="text-2xl font-bold text-orange-800 dark:text-orange-200 num-display">${ex.length}</p>
            </div>
          </div>
          ${finalV.length ? `<button id="confirmExcelImportBtn" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold btn-pop bangla-text">✅ <span class="num-display">${finalV.length}</span> জন যোগ</button>` : '<p class="text-center text-red-500 text-sm bangla-text">যোগ করার ডাটা নেই</p>'}
        </div>`;
      const btn = document.getElementById('confirmExcelImportBtn');
      if (btn) btn.addEventListener('click', () => confirmExcelImport(btn));
    } catch (err) { area.innerHTML = `<p class="text-red-500 text-center py-4 bangla-text">❌ ${escapeHtml(err.message)}</p>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmExcelImport(btn) {
  if (!pendingExcelStudents || !pendingExcelStudents.length) return toastWarning('ডাটা নেই');
  btn.disabled = true; btn.textContent = '⏳...';
  const { error } = await db.from('students').insert(pendingExcelStudents);
  if (error) { btn.disabled = false; btn.textContent = 'আবার চেষ্টা'; return toastError(error.message); }
  toastSuccess(`${pendingExcelStudents.length} জন যোগ হয়েছে`);
  pendingExcelStudents = null;
  document.getElementById('excelPreviewArea').innerHTML = '';
  document.getElementById('excelFile').value = '';
}

async function addStudentManual() {

  if (!session || !roll || !name) { status.innerHTML = '<p class="text-red-500 bangla-text">❌ সেশন, রোল, নাম দিন</p>'; return; }
  const { error } = await db.from('students').insert({

async function bulkUpdateStudents() {
  const file = document.getElementById('bulkFile')?.files[0];
  if (!file) return toastWarning('ফাইল সিলেক্ট করুন');
  const status = document.getElementById('bulkStatus');
  const session = document.getElementById('buSession').value.trim();
  const year = document.getElementById('buYear').value;
  if (!session) { status.innerHTML = '<p class="text-red-500 bangla-text">❌ সেশন লিখুন</p>'; return; }
  status.innerHTML = '<p class="text-gray-500 bangla-text">⏳...</p>';
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      const updates = rows.slice(1).map(r => ({
        class_roll: String(r[0] || '').trim(),
        reg_no: String(r[1] || '').trim(),
        name: String(r[2] || '').trim()
      })).filter(u => u.class_roll);
      if (!updates.length) { status.innerHTML = '<p class="text-red-500 bangla-text">❌ ডাটা নেই</p>'; return; }
      const { data, error } = await db.rpc('bulk_update_students', { p_session: session, p_year: year, p_updates: updates });
      if (error) { status.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(error.message)}</p>`; return; }
      status.innerHTML = `
        <div class="bg-emerald-50 dark:bg-emerald-900/30 p-4 rounded-xl">
          <p class="font-bold text-emerald-700 dark:text-emerald-300 mb-2 bangla-text">✅ সম্পন্ন</p>
          <p class="text-sm dark:text-white bangla-text">✓ সফল: <span class="num-display">${data.updated}</span></p>
          <p class="text-sm dark:text-white bangla-text">✗ পাওয়া যায়নি: <span class="num-display">${data.not_found}</span></p>
        </div>`;
    } catch (err) { status.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(err.message)}</p>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function loadStudentList() {
  const session = document.getElementById('lstSession')?.value.trim();
  const year = document.getElementById('lstYear')?.value;
  const status = document.getElementById('lstStatus')?.value;
  const search = document.getElementById('lstSearch')?.value.trim().toLowerCase();
  let q = db.from('students').select('id, session, year, class_roll, reg_no, name, status, phone');
  if (session) q = q.eq('session', session);
  if (year) q = q.eq('year', year);
  if (status) q = q.eq('status', status);
  const { data, error } = await q;
  if (error) { document.getElementById('studentListArea').innerHTML = `<p class="text-red-500 bangla-text">❌ ${error.message}</p>`; return; }
  let students = sortStudents(data || []);
  if (search) students = students.filter(s =>
    (s.name && s.name.toLowerCase().includes(search)) ||
    (s.class_roll && s.class_roll.toLowerCase().includes(search)) ||
    (s.reg_no && s.reg_no.toLowerCase().includes(search))
  );
  if (!students.length) { document.getElementById('studentListArea').innerHTML = `<p class="text-gray-400 text-sm text-center py-8 bangla-text">কিছু পাওয়া যায়নি</p>`; return; }
  const icons = { active: '✅', tc: '📤', inactive: '❌', graduated: '🎓', suspended: '⛔' };
  const area = document.getElementById('studentListArea');
  area.innerHTML = `
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-2 bangla-text">মোট: <span class="num-display">${students.length}</span></p>
    <div class="overflow-y-auto max-h-[500px] space-y-2">
      ${students.map(s => `
        <div class="bg-gray-50 dark:bg-gray-700 p-3 rounded-xl flex justify-between items-center gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <span>${icons[s.status] || '✅'}</span>
              <b class="text-sm dark:text-white bangla-text">${escapeHtml(s.name)}</b>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate bangla-text">
              রোল: <span class="num-display">${escapeHtml(s.class_roll)}</span> · রেজি: <span class="num-display">${escapeHtml(s.reg_no || '-')}</span> · ${escapeHtml(s.session)} · ${escapeHtml(s.year)}
            </p>
          </div>
          <button class="student-action-btn bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-xs" data-id="${escapeHtml(s.id)}">⚙️</button>
        </div>`).join('')}
    </div>`;
  area.querySelectorAll('.student-action-btn').forEach(b => b.addEventListener('click', () => showStudentActions(b.dataset.id)));
}

async function changeStudentStatus(id, ns) {
  const l = { active: 'সক্রিয়', tc: 'টিসি', inactive: 'নিষ্ক্রিয়', graduated: 'গ্র্যাজুয়েটেড' };
  const ok = await confirmAction('নিশ্চিত?', `"${l[ns]}" মার্ক করবেন?`, 'হ্যাঁ', '#3b82f6');
  if (!ok) return;
  const u = { status: ns };
  if (ns === 'tc') u.tc_date = new Date().toISOString().split('T')[0];
  const { error } = await db.from('students').update(u).eq('id', id);
  if (error) return toastError(error.message);
  closeModal();
  toastSuccess(`${l[ns]} মার্ক হয়েছে`);
  loadStudentList();
}

async function deleteStudentPermanently(id, name) {
  const ok1 = await confirmAction('মুছবেন?', `⚠️ "${name}" কে?`, 'হ্যাঁ, মুছুন', '#dc2626');
  if (!ok1) return;
  const ok2 = await confirmAction('নিশ্চিত?', 'শেষবার।', 'হ্যাঁ', '#dc2626');
  if (!ok2) return;
  showGlobalLoader();
  try {
    const { error } = await db.from('students').delete().eq('id', id);
    if (error) return toastError(error.message);
    closeModal();
    toastSuccess('মুছে ফেলা হয়েছে');
    loadStudentList();
  } finally { hideGlobalLoader(); }
}

async function saveMapping() {
  const teacher_id = document.getElementById('mapTeacher').value;
  const session = document.getElementById('mapSession').value.trim();
  const year = document.getElementById('mapYear').value;
  const course_code = document.getElementById('mapCourse').value.trim().toUpperCase();
  const course_name = document.getElementById('mapCourseName').value.trim();
  const class_day = document.getElementById('mapDay').value;
  const time_slot = document.getElementById('mapTime').value;
  if (!teacher_id || !session || !year || !course_code) return toastWarning('শিক্ষক, সেশন, ইয়ার, কোর্স দিন');

  // ⚠️ কনফ্লিক্ট যাচাই — ডাটাবেসে সেভ করার আগেই (দিন ও সময় দেওয়া থাকলে)
  if (class_day && time_slot) {
    showGlobalLoader();
    let conflicts;
    try {
      conflicts = await checkScheduleConflict({ table: 'teacher_courses', teacherId: teacher_id, courseCode: course_code, day: class_day, time: time_slot, room: '' });
    } catch (e) {
      hideGlobalLoader();
      return toastError('কনফ্লিক্ট যাচাই করা যায়নি: ' + (e.message || 'নেটওয়ার্ক সমস্যা'));
    }
    hideGlobalLoader();
    if (conflicts.length) return showConflictAlert(conflicts, class_day, time_slot);
  }

  showGlobalLoader();
  try {
    const { error: e1 } = await db.from('teacher_courses').insert({
      teacher_id, session, year, course_code,
      class_day: class_day || null,
      time_slot: time_slot || null
    });
    if (e1) {
      if (e1.message.includes('duplicate')) return toastWarning('এই ম্যাপিং আগেই আছে');
      return toastError(e1.message);
    }
    const { error: e2 } = await db.from('courses').upsert({ session, year, course_code, course_name: course_name || null }, { onConflict: 'session,year,course_code' });
    if (e2) console.error(e2);
    toastSuccess('ম্যাপিং ও রুটিন সংরক্ষিত');
    document.getElementById('mapCourseSelect').value = '';
    fillCourseDetails();
    loadMappings();
  } finally { hideGlobalLoader(); }
}

    const { data: c } = await db.from('courses').select('course_name').eq('session', m.session).eq('year', m.year).eq('course_code', m.course_code).maybeSingle();

async function deleteMapping(id) {

let currentRoutineData = null;
const ROUTINE_TIME_ORDER = ['9.00-9.45','9.45-10.30','10.30-11.15','11.15-12.00','12.00-12.45','12.45-1.30','1.30-2.00 (Tifin)','2.00-2.45','2.45-3.30'];
function routineTimeRank(t) { const i = ROUTINE_TIME_ORDER.indexOf(t); return i === -1 ? 99 : i; }

async function loadRoutineViewer() {
  const day = document.getElementById('rvDay').value;
  const year = document.getElementById('rvYear').value;
  const teacherId = document.getElementById('rvTeacher').value;
  const area = document.getElementById('routineViewerArea');
  area.innerHTML = '<p class="text-center py-4 dark:text-gray-300 bangla-text">⏳ লোড হচ্ছে...</p>';
  try {
    let q = db.from('teacher_courses').select('*, teachers(name)').not('class_day', 'is', null).not('time_slot', 'is', null);
    if (day) q = q.eq('class_day', day);
    if (year) q = q.eq('year', year);
    if (teacherId) q = q.eq('teacher_id', teacherId);
    const { data: mappings, error } = await q;
    if (error) throw error;
    if (!mappings || !mappings.length) {
      area.innerHTML = '<p class="text-center text-gray-500 py-4 bangla-text">এই ফিল্টারে কোনো রুটিন পাওয়া যায়নি</p>';
      currentRoutineData = null;
      return;
    }
    const courseMap = {};
    const courseCodes = [...new Set(mappings.map(m => m.course_code))];
    if (courseCodes.length) {
      const { data: courses } = await db.from('courses').select('course_code, session, year, course_name').in('course_code', courseCodes);
      courses?.forEach(c => { courseMap[`${c.session}|${c.year}|${c.course_code}`] = c.course_name; });
    }
    await getCourseInfoMap();
    const processed = mappings.map(m => ({
      ...m,
      course_name: courseMap[`${m.session}|${m.year}|${m.course_code}`] || '',
      teacher_name: m.teachers?.name || 'Unknown'
    }));
    const weekOrder = { Sunday: 0, Monday: 1, Tuesday: 2, Wednesday: 3, Thursday: 4 };
    processed.sort((a, b) => {
      if (weekOrder[a.class_day] !== weekOrder[b.class_day]) return weekOrder[a.class_day] - weekOrder[b.class_day];
      return routineTimeRank(a.time_slot) - routineTimeRank(b.time_slot);
    });
    currentRoutineData = processed;
    const bnDay = { Sunday: 'রবিবার', Monday: 'সোমবার', Tuesday: 'মঙ্গলবার', Wednesday: 'বুধবার', Thursday: 'বৃহস্পতিবার' };
    const grouped = {};
    processed.forEach(p => {
      if (!grouped[p.class_day]) grouped[p.class_day] = [];
      grouped[p.class_day].push(p);
    });
    area.innerHTML = `
      <div class="space-y-4">
        ${Object.entries(grouped).map(([d, items]) => `
          <div class="bg-white dark:bg-gray-800 border-2 border-gray-200 dark:border-gray-600 rounded-xl overflow-hidden">
            <div class="bg-purple-100 dark:bg-purple-900/50 px-4 py-2 border-b border-purple-200 dark:border-purple-700">
              <h4 class="font-bold text-purple-800 dark:text-purple-200 bangla-text">${bnDay[d] || escapeHtml(d)}</h4>
            </div>
            <div class="divide-y divide-gray-200 dark:divide-gray-700">
              ${items.map(r => `
                <div class="p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                  <div class="flex-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="bg-indigo-100 text-indigo-700 dark:bg-indigo-900 dark:text-indigo-300 px-2 py-0.5 rounded text-xs font-bold num-display">${escapeHtml(r.time_slot)}</span>
                      <span class="font-bold dark:text-white bangla-text">${escapeHtml(courseLabel(r.course_code, r.course_name))}</span>
                    </div>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 bangla-text">শিক্ষক: ${escapeHtml(r.teacher_name)}</p>
                  </div>
                  <div class="text-right">
                    <span class="bg-gray-100 dark:bg-gray-600 text-gray-600 dark:text-gray-300 px-2 py-1 rounded text-xs num-display">${escapeHtml(r.session)} · ${escapeHtml(r.year)}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  } catch (err) {
    area.innerHTML = `<p class="text-red-500 text-center py-4 bangla-text">❌ ${escapeHtml(err.message)}</p>`;
  }
}

async function exportRoutineExcel() {
  if (!currentRoutineData || !currentRoutineData.length) return toastWarning('প্রথমে রুটিন দেখুন');
  const data = [['Day', 'Time', 'Course Code', 'Course Name', 'Teacher', 'Session', 'Year']];
  currentRoutineData.forEach(r => {
    data.push([r.class_day, r.time_slot, r.course_code, r.course_name || '', r.teacher_name, r.session, r.year]);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Routine');
  XLSX.writeFile(wb, `Routine_${Date.now()}.xlsx`);
}

async function exportRoutinePDF() {
  if (!currentRoutineData || !currentRoutineData.length) return toastWarning('প্রথমে রুটিন দেখুন');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  await setupBanglaFont(doc);
  doc.setFontSize(14);
  doc.text('AMC Economics - Class Routine', 14, 15);
  doc.autoTable({
    head: [['Day', 'Time', 'Course', 'Teacher', 'Session/Year']],
    body: currentRoutineData.map(r => [
      r.class_day, r.time_slot,
      courseLabel(r.course_code, r.course_name),
      r.teacher_name, r.session + ' · ' + r.year
    ]),
    startY: 22,
    styles: { fontSize: 8, font: 'HindSiliguri' },
    headStyles: { fillColor: [147, 51, 234], font: 'HindSiliguri' }
  });
  doc.save(`Routine_${Date.now()}.pdf`);
}

async function loadSessionList() {
  const { data: sessions } = await db.from('students').select('session, year, is_archived').order('session', { ascending: false });

  const combos = {};
  sessions.forEach(s => {
    const k = `${s.session}|${s.year}`;
    if (!combos[k]) combos[k] = { session: s.session, year: s.year, is_archived: s.is_archived, count: 0 };
    combos[k].count++;
  });
  const list = Object.values(combos);
  document.getElementById('sessionListArea').innerHTML = `
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm border dark:border-gray-600">
        <thead class="bg-gray-100 dark:bg-gray-700">
          <tr>

            <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">ইয়ার</th>
            <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">ছাত্র</th>
            <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">অবস্থা</th>
            <th class="p-2 border dark:border-gray-600 dark:text-white bangla-text">কার্যক্রম</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(c => `
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-700">
              <td class="p-2 border dark:border-gray-600 text-center dark:text-white bangla-text">${escapeHtml(c.session)}</td>
              <td class="p-2 border dark:border-gray-600 text-center dark:text-white bangla-text">${escapeHtml(c.year)}</td>
              <td class="p-2 border dark:border-gray-600 text-center dark:text-white num-cell">${c.count}</td>
              <td class="p-2 border dark:border-gray-600 text-center bangla-text">${c.is_archived ? '<span class="text-amber-600">📦 আর্কাইভ</span>' : '<span class="text-emerald-600">✅ সক্রিয়</span>'}</td>
              <td class="p-2 border dark:border-gray-600 text-center">
                ${!c.is_archived ? `<button class="archive-btn bg-amber-500 text-white px-3 py-1 rounded text-xs bangla-text" data-session="${escapeHtml(c.session)}" data-year="${escapeHtml(c.year)}">📦 Archive</button>` : `<button class="delete-btn bg-red-600 text-white px-3 py-1 rounded text-xs bangla-text" data-session="${escapeHtml(c.session)}" data-year="${escapeHtml(c.year)}">🗑️ Delete</button>`}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  document.querySelectorAll('.archive-btn').forEach(b => b.addEventListener('click', () => archiveSession(b.dataset.session, b.dataset.year)));
  document.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', () => deleteArchivedSession(b.dataset.session, b.dataset.year)));
}

async function archiveSession(session, year) {
  const ok = await confirmAction('আর্কাইভ?', `সেশন ${session} · ${year}?`, 'আর্কাইভ', '#f59e0b');
  if (!ok) return;
  showGlobalLoader();
  try {
    const { data, error } = await db.rpc('archive_session', { p_session: session, p_year: year });
    if (error || !data.ok) return toastError(data?.message || error?.message);
    toastSuccess('আর্কাইভ সম্পন্ন');
    loadSessionList();
  } finally { hideGlobalLoader(); }
}

// ============================================================
async function downloadFullBackup() {
  showGlobalLoader();
  try {
    const tables = ['students', 'teachers', 'courses', 'teacher_courses',
                    'attendance_sessions', 'attendance_records', 'marks', 'notices'];
    const backup = { version: '1.0', timestamp: new Date().toISOString(), data: {} };
    for (const t of tables) {
      const { data, error } = await db.from(t).select('*');
      if (error) console.warn(t, error);
      backup.data[t] = data || [];
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 16).replace(':', '-');
    a.href = url;
    a.download = `amc_backup_${ts}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toastSuccess('Backup ডাউনলোড হয়েছে');
  } catch (err) {
    toastError(err.message);
  } finally { hideGlobalLoader(); }
}

async function restoreFromBackup() {
  const file = document.getElementById('restoreFile')?.files[0];
  if (!file) return toastWarning('Backup file সিলেক্ট করুন');
  const status = document.getElementById('backupStatus');

  const ok1 = await confirmAction('⚠️ Restore?', 'এই কাজে বর্তমান সব data মুছে যাবে!', 'চলুন', '#dc2626');
  if (!ok1) return;
  const ok2 = await confirmAction('শেষবার?', 'নিশ্চিত?', 'হ্যাঁ, Restore', '#dc2626');
  if (!ok2) return;

  status.innerHTML = '<p class="text-gray-500 bangla-text">⏳ Restore হচ্ছে...</p>';
  showGlobalLoader();
  try {
    const text = await file.text();
    const backup = JSON.parse(text);
    if (!backup.data) throw new Error('Invalid backup');

    const delOrder = ['attendance_records', 'marks', 'attendance_sessions',
                     'teacher_courses', 'courses', 'students', 'notices'];
    for (const t of delOrder) {
      if (backup.data[t] !== undefined) {
        await db.from(t).delete().neq('id', '00000000-0000-0000-0000-000000000000');
      }
    }

    const insOrder = ['teachers', 'students', 'courses', 'teacher_courses',
                     'notices', 'attendance_sessions', 'attendance_records', 'marks'];
    for (const t of insOrder) {
      const rows = backup.data[t];
      if (!rows || !rows.length) continue;
      const { error } = await db.from(t).insert(rows);
      if (error) console.warn(t, error);
    }

    status.innerHTML = '<p class="text-emerald-600 font-bold bangla-text">✅ Restore সম্পন্ন!</p>';
    toastSuccess('Restore সফল');
  } catch (err) {
    status.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(err.message)}</p>`;
    toastError(err.message);
  } finally { hideGlobalLoader(); }
}

async function exportTableExcel(table) {
  showGlobalLoader();
  try {
    const { data, error } = await db.from(table).select('*');
    if (error) throw error;
    if (!data || !data.length) return toastWarning('ডাটা নেই');
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, table);
    XLSX.writeFile(wb, `${table}_${new Date().toISOString().slice(0, 10)}.xlsx`);
    toastSuccess(`${table} ডাউনলোড`);
  } catch (err) {
    toastError(err.message);
  } finally { hideGlobalLoader(); }
}

async function teacherLogin() {
  const userId = document.getElementById('teacherUserId').value.trim().toLowerCase();
  const pin = banglaToEnglish(document.getElementById('teacherPin').value.trim());
  const errEl = document.getElementById('teacherErr');
  errEl.textContent = '';
  if (!userId || !pin) {
    errEl.textContent = 'ইউজার আইডি ও PIN দিন';
    return;
  }
  showGlobalLoader();
  try {
    // লগইন এখন শিক্ষকের নাম দিয়ে নয় — ইউনিক ইউজার আইডি + PIN দিয়ে
    const { data, error } = await db.rpc('teacher_login', { p_user_id: userId, p_pin: pin });
    if (error) {
      // ফাংশন না থাকা/ডাটাবেস ত্রুটি আসল কারণসহ দেখানো হবে (ভুল পাসওয়ার্ড বলে ভুল বোঝানো হবে না)

    }

function setupManualSearch() {
  const si = document.getElementById('meSearch');
  let timer = null;
  si.addEventListener('input', (e) => {
    const q = banglaToEnglish(e.target.value.trim());
    if (timer) clearTimeout(timer);
    if (!q || q.length < 1) { document.getElementById('meSuggestionBox').classList.add('hidden'); return; }
    timer = setTimeout(() => searchStudentForManual(q), 300);
  });
}

async function searchStudentForManual(query) {
  const cv = document.getElementById('meCourse').value;
  if (!cv) return;
  const [, session, year] = cv.split('|');

  // অফলাইন
  if (!navigator.onLine) {
    const cached = localStorage.getItem('amc_students_' + session + '_' + year);
    if (cached) {
      const all = JSON.parse(cached);
      let filtered = all.filter(st => st.class_roll === query || st.reg_no === query);
      if (filtered.length === 0) {
        filtered = all.filter(st => (st.class_roll && st.class_roll.includes(query)) || (st.reg_no && st.reg_no.includes(query)));
      }
      renderManualSuggestions(filtered);
    }
    return;
  }

  // ১. Exact Match প্রথমে
  let { data: exactMatch } = await db.from('students')
    .select('id, name, class_roll, reg_no')
    .eq('session', session).eq('year', year).eq('status', 'active')
    .or(`class_roll.eq.${query},reg_no.eq.${query}`)
    .limit(5);

  // ২. Exact না পেলে Partial Match
  if (!exactMatch || exactMatch.length === 0) {
    const { data: partialMatch } = await db.from('students')
      .select('id, name, class_roll, reg_no')
      .eq('session', session).eq('year', year).eq('status', 'active')
      .or(`class_roll.ilike.%${query}%,reg_no.ilike.%${query}%`)
      .limit(10);
    exactMatch = partialMatch || [];
  }

  renderManualSuggestions(exactMatch);
}

function renderManualSuggestions(students) {
  const box = document.getElementById('meSuggestionBox');
  if (!students || !students.length) {
    box.classList.remove('hidden');
    box.className = 'suggestion-box mb-3';
    box.innerHTML = '<div class="p-3 text-sm text-red-500 bangla-text">❌ কিছু পাওয়া যায়নি</div>';
    return;
  }
  const sorted = sortStudents(students);
  box.classList.remove('hidden');
  box.className = 'suggestion-box mb-3';
  box.innerHTML = sorted.map(s => `
    <div class="suggestion-item" data-roll="${escapeHtml(s.class_roll)}" data-name="${escapeHtml(s.name)}">
      <div>
        <div class="font-bold text-sm bangla-text"><span class="num-display">${escapeHtml(s.class_roll)}</span> — ${escapeHtml(s.name)}</div>
        <div class="text-xs text-gray-500 dark:text-gray-400 bangla-text">রেজি: <span class="num-display">${escapeHtml(s.reg_no || '-')}</span></div>
      </div>
      <span class="text-indigo-500">›</span>
    </div>`).join('');
  box.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('click', () => {
      document.getElementById('meRoll').value = item.dataset.roll;
      document.getElementById('meSearch').value = `${item.dataset.roll} — ${item.dataset.name}`;
      box.classList.add('hidden');
      box.innerHTML = '';
    });
  });
}

// SMART PIN BANNER — বাংলাদেশ সময় (UTC+6) অনুযায়ী আজকের ক্লাস
// ============================================================
let scheduledBannerInterval = null;
const BD_DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function getBangladeshNow() {
  const d = new Date(Date.now() + 6 * 3600 * 1000);   // UTC+6 (ডিভাইসের টাইমজোন যাই হোক)
  return {
    day: BD_DAY_NAMES[d.getUTCDay()],
    minutes: d.getUTCHours() * 60 + d.getUTCMinutes(),
    dateStr: d.toISOString().slice(0, 10)
  };
}

// "9.45-10.30" → 585 (মিনিট)। ১–৭ টা হলে বিকেল ধরা হবে (যেমন 2.00 → 14:00)
function parseSlotStartMinutes(slot) {
  const m = String(slot || '').match(/^\s*(\d{1,2})[.:](\d{2})/);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const mi = parseInt(m[2], 10);
  if (h < 8) h += 12;
  return h * 60 + mi;
}

async function loadScheduledClassBanner() {
  const c = document.getElementById('scheduledClassBannerContainer');
  if (!c) return;
  if (!currentTeacher) { c.innerHTML = ''; return; }

  const bd = getBangladeshNow();
  const { data, error } = await db.from('teacher_courses').select('*')
    .eq('teacher_id', currentTeacher.id).eq('class_day', bd.day).not('time_slot', 'is', null);
  if (error || !data) return;   // নেটওয়ার্ক সমস্যায় আগের অবস্থা অপরিবর্তিত

  // ক্লাসের (সময় − ১০ মিনিট) থেকে (সময় + ৩০ মিনিট) এর মধ্যে
  const due = data.filter(r => {
    const st = parseSlotStartMinutes(r.time_slot);
    return st !== null && bd.minutes >= st - 10 && bd.minutes <= st + 30;
  });
  if (!due.length) { c.innerHTML = ''; return; }

  // যে কোর্সের PIN ইতিমধ্যে চালু আছে, তার ব্যানার দেখানোর দরকার নেই
  const { data: act } = await db.from('attendance_sessions').select('course_code, session, year')
    .eq('teacher_id', currentTeacher.id).eq('is_active', true).gte('expires_at', new Date().toISOString());
  const pending = due.filter(r => !(act || []).some(a => a.course_code === r.course_code && a.session === r.session && a.year === r.year));
  if (!pending.length) { c.innerHTML = ''; return; }

  await getCourseInfoMap();
  c.innerHTML = pending.map(r => {
    const info = courseInfo(r.course_code);
    const name = info.name || info.short || r.course_code;
    return `
      <div class="mb-4 bg-gradient-to-r from-amber-500 to-orange-600 text-white p-5 rounded-2xl shadow-xl border-4 border-amber-300 fade-in">
        <p class="text-xs font-bold tracking-wider opacity-90 mb-1">⏰ CLASS TIME</p>
        <p class="text-xl md:text-2xl font-bold leading-snug">
          Your scheduled class: ${escapeHtml(name)} (<span class="num-display">${escapeHtml(r.course_code)}</span>), ${escapeHtml(r.session)}, ${escapeHtml(r.year)}, <span class="num-display">${escapeHtml(r.time_slot)}</span>. Generate PIN now.
        </p>
        <button data-code="${attrEsc(r.course_code)}" data-session="${attrEsc(r.session)}" data-year="${attrEsc(r.year)}"
          onclick="generateScheduledPin(this)"
          class="mt-4 w-full bg-white text-orange-700 text-xl font-bold py-4 rounded-2xl btn-pop shadow-lg">
          🎲 Generate PIN
        </button>
      </div>`;
  }).join('');
}

function subscribeLive(sessionId) {
  if (liveChannel) { db.removeChannel(liveChannel); liveChannel = null; }
  if (liveReportInterval) { clearInterval(liveReportInterval); liveReportInterval = null; }

  const refresh = async () => {
    const { data, error } = await db.from('attendance_records').select('marked_at, students(name, class_roll)').eq('session_id', sessionId);
    const rows = error || !data ? [] : data;
    const el = document.getElementById('liveCount');
    if (el) el.innerHTML = `<p class="text-6xl font-bold text-emerald-600 num-display">${rows.length}</p><p class="text-gray-500 dark:text-gray-400 bangla-text">উপস্থিত</p>`;
    const el2 = document.getElementById('liveList');
    if (el2) el2.innerHTML = rows.sort((a,b) => new Date(b.marked_at) - new Date(a.marked_at))
      .map(r => `<div class="bg-emerald-50 dark:bg-emerald-900/30 px-3 py-2 rounded-lg flex justify-between">
        <span class="dark:text-white bangla-text">✅ ${escapeHtml(r.students?.name)}</span>
        <span class="text-xs text-gray-400 num-display">${new Date(r.marked_at).toLocaleTimeString('en-GB')}</span>
      </div>`).join('');
  };

  liveChannel = db.channel('live_' + sessionId).on('postgres_changes', {
    event: '*', schema: 'public', table: 'attendance_records',
    filter: `session_id=eq.${sessionId}`
  }, refresh).subscribe();

  liveReportInterval = setInterval(refresh, 5000);

  refresh();
}

    const stu = student && student.length > 0 ? student[0] : null;
    if (!stu) return toastError('ছাত্র পাওয়া যায়নি');
    const { error } = await db.from('attendance_records').upsert({
      session_id: sess.id, student_id: stu.id, status, marked_by: currentTeacher.id
    }, { onConflict: 'session_id,student_id' });
    if (error) return toastError(error.message);
    toastSuccess('সেভ: ' + stu.name);
    document.getElementById('meRoll').value = '';
    document.getElementById('meSearch').value = '';
  } finally { hideGlobalLoader(); }
}
