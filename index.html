<html lang="en">
<head>

<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#4F46E5">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: {} } };
  (function() {
    const saved = localStorage.getItem('amc_theme') || 'auto';
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = saved === 'dark' || (saved === 'auto' && prefersDark);
    if (isDark) document.documentElement.classList.add('dark');
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap');
  .hidden { display: none; }
  .teacher-bottom-nav.hidden { display: none; }
  * { font-family: 'Inter', 'Hind Siliguri', sans-serif; }

  input[type="number"], input[type="tel"], input.mark-input,
  #studentRollInput, #teacherUserId, #teacherPin, #ntPin, #tfUserId,
  #msRoll, #msReg, #msPhone, #msGuardianPhone,
  #edRoll, #edReg, #edPhone, #edGuardianPhone,
  #meRoll, #meSearch, #irRoll, #mapCourse, #pubCourse,
  #trackDeviceInput, #trackRollInput, #studentRegVerify, #rvSession, .pin-box {
    font-family: 'Arial', 'Helvetica', 'Segoe UI', sans-serif !important;
    font-feature-settings: 'tnum' !important;
    font-variant-numeric: tabular-nums !important;
  }
  .num-display, .num-cell, .roll-display, .reg-display, .pin-display {
    font-family: 'Arial', 'Helvetica', 'Segoe UI', sans-serif !important;
    font-feature-settings: 'tnum' !important;
    font-variant-numeric: tabular-nums !important;
  }

  .btn-pop { transition: all 0.15s ease; }
  .btn-pop:active { transform: scale(0.96); }
  .fade-in { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1;transform:translateY(0);} }
  .pulse-live { animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

  html.dark body { background: linear-gradient(to bottom right, #1e1b4b, #4c1d95, #831843); }

  #globalLoader { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 9999; }
  #globalLoader.active { display: flex; }
  .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* OTP PIN boxes */
  .pin-box {
    width: 64px; height: 76px;
    text-align: center; font-size: 34px; font-weight: 800;
    border: 3px solid #c7d2fe; border-radius: 18px;
    background: #eef2ff; color: #312e81;
    transition: all 0.15s ease;
    caret-color: transparent;
  }
  .pin-box:focus { border-color: #6366f1; background: #fff; box-shadow: 0 0 0 4px rgba(99,102,241,0.25); }
  html.dark .pin-box { background: #1e1b4b; border-color: #4c1d95; color: #e0e7ff; }
  html.dark .pin-box:focus { border-color: #818cf8; background: #312e81; }

  /* Bottom nav */
  .teacher-bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    z-index: 50; border-top: 1px solid rgba(255,255,255,0.1);
  }
  .teacher-bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 2px; color: #94a3b8; font-size: 10px; font-weight: 600;
    background: none; border: none; padding: 6px 2px; border-radius: 10px;
  }
  .teacher-bottom-nav button.active { color: #a5b4fc; }
  .teacher-bottom-nav button span { font-size: 20px; }

  /* Brand */
  .brand-chip {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; box-shadow: 0 4px 12px rgba(99,102,241,0.4);
  }

  /* Cards */
  .glass-card {
    background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
    border-radius: 16px; border: 1px solid rgba(255,255,255,0.3);
  }
  html.dark .glass-card {
    background: rgba(30,27,75,0.7); border-color: rgba(255,255,255,0.08);
  }
</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen pb-20 bg-gradient-to-br from-indigo-50 via-white to-purple-50 dark:from-indigo-950 dark:via-purple-950 dark:to-pink-950">

<div id="globalLoader"><div class="spinner"></div></div>
<div id="offlineBadge" class="hidden fixed top-16 left-1/2 -translate-x-1/2 bg-red-500 text-white px-4 py-1 rounded-full text-sm z-50">Offline</div>

<div id="networkBanner" class="hidden relative z-30 bg-orange-500 text-white px-4 py-2 text-center text-sm font-bold items-center justify-center gap-2 shadow-lg">
  <span>🐌 Slow network detected — attendance will be optimized</span>
</div>

<div class="teacher-bottom-nav hidden" id="teacherBottomNav">
  <button onclick="showTeacherTab('takeAttendance'); setActiveBottomNav('takeAttendance')" id="nav-takeAttendance" class="active"><span>📝</span>Attend</button>
  <button onclick="showTeacherTab('liveReport'); setActiveBottomNav('liveReport')" id="nav-liveReport"><span>🔴</span>Live</button>
  <button onclick="showTeacherTab('attendanceReport'); setActiveBottomNav('attendanceReport')" id="nav-attendanceReport"><span>📊</span>Reports</button>
  <button onclick="showTeacherTab('markEntry'); setActiveBottomNav('markEntry')" id="nav-markEntry"><span>✍️</span>Marks</button>
  <button onclick="toggleMoreMenu(event)" id="nav-more"><span>⚙️</span>More</button>
</div>

<nav class="bg-white/10 dark:bg-black/30 backdrop-blur-md shadow-lg sticky top-0 z-40">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3"><div class="brand-chip">🎓</div><div class="leading-tight"><h1 class="text-white font-extrabold text-lg tracking-tight">AMC Economics</h1><p class="text-white/70 text-[11px] font-semibold tracking-wide">Attendance System</p></div></div>
    <div class="flex gap-2 text-sm items-center flex-wrap justify-end">
      
      <button id="installBtn" onclick="installPWA()" class="hidden bg-emerald-500 text-white px-3 py-2 rounded-lg btn-pop text-sm animate-pulse font-bold">
        📲 Install
      </button>

      <button onclick="showSection('notice')" class="bg-pink-500 text-white px-3 py-2 rounded-lg btn-pop hidden md:block font-semibold">📢 Notices</button>
      <button onclick="showSection('teacherDirectory')" class="bg-cyan-500 text-white px-3 py-2 rounded-lg btn-pop hidden md:block font-semibold">👨‍🏫 Faculty</button>
      
      <button onclick="toggleTheme()" id="themeToggleBtn" type="button" aria-label="Switch to dark mode" title="Switch theme" class="bg-white/20 text-white px-3 py-2 rounded-lg btn-pop text-lg">🌙</button>
      
      <div class="hidden md:flex gap-2">
        <button onclick="showSection('adminLogin')" class="bg-white/20 text-white px-3 py-2 rounded-lg btn-pop font-semibold">Admin</button>
        <button onclick="showSection('teacherLogin')" class="bg-white/20 text-white px-3 py-2 rounded-lg btn-pop font-semibold">Teacher</button>
        <button onclick="showSection('studentLogin')" class="bg-white/20 text-white px-3 py-2 rounded-lg btn-pop font-semibold">Student</button>
      </div>

      <button id="mobileMenuToggle" onclick="toggleMobileMenu(event)" aria-controls="mobileMenu" aria-expanded="false" aria-label="Open navigation menu" class="md:hidden bg-white/20 text-white px-3 py-2 rounded-lg btn-pop text-lg">☰</button>
    </div>
  </div>
  <div id="mobileMenu" class="hidden md:hidden bg-[#102a43] text-white px-4 py-3 flex flex-col gap-2 border-t border-white/20">
    <button onclick="showSection('notice'); closeMobileMenu()" class="text-left py-2 border-b border-indigo-700 font-semibold">📢 Notice Board</button>
    <button onclick="showSection('teacherDirectory'); closeMobileMenu()" class="text-left py-2 border-b border-indigo-700 font-semibold">👨‍🏫 Faculty Directory</button>
    <button onclick="showSection('adminLogin'); closeMobileMenu()" class="text-left py-2 border-b border-indigo-700 font-semibold">Admin Login</button>
    <button onclick="showSection('teacherLogin'); closeMobileMenu()" class="text-left py-2 border-b border-indigo-700 font-semibold">Teacher Login</button>
    <button onclick="showSection('studentLogin'); closeMobileMenu()" class="text-left py-2 font-semibold">Student Login</button>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 py-6">
  <div id="app"></div>
</main>
