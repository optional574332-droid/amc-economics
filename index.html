<style>

  * { font-family: 'Hind Siliguri', sans-serif; }

  input[type="number"], input[type="tel"], input.mark-input,

  html.dark body { background: linear-gradient(to bottom right, #1e1b4b, #4c1d95, #831843); }

  #globalLoader {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    backdrop-filter: blur(2px); display: none;
    align-items: center; justify-content: center; z-index: 9999;

  #globalLoader.active { display: flex; }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #activePinBanner { animation: bannerPulse 2.5s ease-in-out infinite; }
  @keyframes bannerPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
    50% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
  }

  .bangla-text { font-family: 'Hind Siliguri', sans-serif !important; }

  .suggestion-box {
    max-height: 240px; overflow-y: auto;
    border: 2px solid #6366f1; border-radius: 12px;
    background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
  html.dark .suggestion-box { background: #374151; border-color: #6366f1; }
  .suggestion-item {
    padding: 10px 14px; cursor: pointer;
    border-bottom: 1px solid #f3f4f6;
    transition: background 0.1s;
    display: flex; justify-content: space-between; align-items: center;
  }
  html.dark .suggestion-item { border-bottom-color: #4b5563; }
  .suggestion-item:hover, .suggestion-item.active { background: #eef2ff; }
  html.dark .suggestion-item:hover, html.dark .suggestion-item.active { background: #4f46e5; color: white; }
  .suggestion-item:last-child { border-bottom: none; }

  /* ✅ Marks grid */
  .marks-grid-row {
    transition: background 0.15s;
  }
  .marks-grid-row:hover {
    background: #f9fafb;
  }
  html.dark .marks-grid-row:hover {
    background: #374151;
  }

  /* ✅ Offline badge */
  #offlineBadge {
    position: fixed; bottom: 20px; right: 20px;
    padding: 12px 20px;
    border-radius: 16px;
    font-weight: bold;
    z-index: 9998;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: none;
  }
  #offlineBadge.active { display: block; }
  #offlineBadge.offline { background: #dc2626; color: white; }

<script>
// ============================================================
// ⚙️ CONFIG
// ============================================================
const SUPABASE_URL = 'https://zalzlqabfbpxnavbxchx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_O3FCdhsMo4gviKn_B6_XLg_5tA-V5S0';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTeacher = null;
let currentStudent = null;
let currentPinSession = null;
let liveChannel = null;
let pinTimerInterval = null;
let activeSessionCheckInterval = null;

let deviceId = localStorage.getItem('amc_device_id');
if (!deviceId) {
  deviceId = 'dev_' + Math.random().toString(36).slice(2) + Date.now();
  localStorage.setItem('amc_device_id', deviceId);
}

// ============================================================
// 🔢 Helpers
// ============================================================
function banglaToEnglish(str) {
  const b = '০১২৩৪৫৬৭৮৯', e = '0123456789';
  return String(str).replace(/[০-৯]/g, (d) => e[b.indexOf(d)]);
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function sortStudents(students) {
  return students.slice().sort((a, b) => {
    const ar = String(a.class_roll || '').trim();
    const br = String(b.class_roll || '').trim();
    const aM = ar.match(/^([A-Za-z-]*)(\d+)/);
    const bM = br.match(/^([A-Za-z-]*)(\d+)/);
    if (!aM || !bM) return ar.localeCompare(br);
    const aP = aM[1] || '', bP = bM[1] || '';
    const aN = parseInt(aM[2], 10), bN = parseInt(bM[2], 10);
    if (!aP && bP) return -1;
    if (aP && !bP) return 1;
    if (aP === bP) return aN - bN;
    return aP.localeCompare(bP);
  });
}

// ============================================================
// 🎨 SweetAlert2
// ============================================================
const Toast = Swal.mixin({
  toast: true, position: 'top-end',
  showConfirmButton: false, timer: 2200, timerProgressBar: true,
  didOpen: (t) => {
    t.addEventListener('mouseenter', Swal.stopTimer);
    t.addEventListener('mouseleave', Swal.resumeTimer);
  }
});
function toastSuccess(msg) { Toast.fire({ icon: 'success', title: msg }); }
function toastError(msg) { Toast.fire({ icon: 'error', title: msg, timer: 4000 }); }
function toastWarning(msg) { Toast.fire({ icon: 'warning', title: msg, timer: 3500 }); }
function toastInfo(msg) { Toast.fire({ icon: 'info', title: msg }); }

async function confirmAction(title, text, confirmText = 'হ্যাঁ, নিশ্চিত', confirmColor = '#dc2626') {
  const res = await Swal.fire({
    title, text, icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: confirmColor,
    cancelButtonColor: '#6b7280',
    confirmButtonText: confirmText,
    cancelButtonText: 'বাতিল',
    reverseButtons: true
  });
  return res.isConfirmed;
}

function showGlobalLoader() { document.getElementById('globalLoader').classList.add('active'); }
function hideGlobalLoader() { document.getElementById('globalLoader').classList.remove('active'); }

// ============================================================
// 🌐 OFFLINE DETECTION + QUEUE
// ============================================================
function updateOnlineStatus() {
  const badge = document.getElementById('offlineBadge');
  if (!navigator.onLine) {
    badge.classList.add('active', 'offline');
    badge.classList.remove('pending');
    badge.innerHTML = '📴 অফলাইন — হাজিরা local-এ জমা হবে';
  } else {
    const pending = getOfflineQueue().length;
    if (pending > 0) {
      badge.classList.add('active', 'pending');
      badge.classList.remove('offline');
      badge.innerHTML = `⏳ ${pending} টি হাজিরা sync হচ্ছে...`;
      syncOfflineQueue();
    } else {
      badge.classList.remove('active', 'offline', 'pending');
    }
  }
}

window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);

function getOfflineQueue() {
  try {
    const q = localStorage.getItem('amc_offline_queue');
    return q ? JSON.parse(q) : [];
  } catch (e) { return []; }
}

function saveOfflineQueue(q) {
  localStorage.setItem('amc_offline_queue', JSON.stringify(q));
}

function queueAttendance(pin, roll) {
  const q = getOfflineQueue();
  q.push({ pin, roll, deviceId, timestamp: Date.now() });
  saveOfflineQueue(q);
  updateOnlineStatus();
}

async function syncOfflineQueue() {
  const q = getOfflineQueue();
  if (!q.length) return;
  const remaining = [];
  let synced = 0;
  for (const item of q) {
    try {
      const { data, error } = await db.rpc('student_mark_attendance_v2', {
        p_pin: item.pin, p_roll: item.roll, p_device_id: item.deviceId
      });
      if (error || !data.ok) {
        // PIN expired বা already marked → skip
        synced++;
      } else {
        synced++;
      }
    } catch (e) {
      remaining.push(item);
    }
  }
  saveOfflineQueue(remaining);
  if (synced > 0) toastSuccess(`${synced} টি হাজিরা sync হয়েছে`);
  updateOnlineStatus();
}

// ============================================================
// 🌙 Theme
// ============================================================
function toggleTheme() {
  const isDark = document.documentElement.classList.contains('dark');
  const next = isDark ? 'light' : 'dark';
  if (next === 'dark') document.documentElement.classList.add('dark');
  else document.documentElement.classList.remove('dark');
  localStorage.setItem('amc_theme', next);
  updateThemeIcon();
  toastInfo(next === 'dark' ? '🌙 Dark mode' : '☀️ Light mode');
}
function updateThemeIcon() {
  const b = document.getElementById('themeToggleBtn');
  if (b) b.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  if ((localStorage.getItem('amc_theme') || 'auto') === 'auto') {
    if (e.matches) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
    updateThemeIcon();
  }
});

// ============================================================
// 🔤 Bangla Font
// ============================================================
let banglaFontLoaded = false;
let banglaFontBase64 = null;
async function loadBanglaFont() {
  if (banglaFontLoaded) return banglaFontBase64;
  try {
    const r = await fetch('https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/hindsiliguri/HindSiliguri-Regular.ttf');
    if (!r.ok) return null;
    const b = await r.arrayBuffer();
    const bytes = new Uint8Array(b);
    let bin = '';
    for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
    banglaFontBase64 = btoa(bin);
    banglaFontLoaded = true;
    return banglaFontBase64;
  } catch (e) { return null; }
}
async function setupBanglaFont(doc) {
  const f = await loadBanglaFont();
  if (f) {
    try {
      doc.addFileToVFS('HindSiliguri-Regular.ttf', f);
      doc.addFont('HindSiliguri-Regular.ttf', 'HindSiliguri', 'normal');
      doc.setFont('HindSiliguri');
      return true;
    } catch (e) { return false; }
  }
  return false;
}

async function submitPin() {
  const pin = banglaToEnglish(document.getElementById('homePinInput').value.trim());
  if (pin.length !== 4) return toastWarning('৪-ডিজিটের PIN দিন');

  if (!navigator.onLine) {
    // Offline mode: PIN cached session থাকলে সরাসরি form
    const cached = localStorage.getItem('amc_last_session_' + pin);
    if (cached) {
      currentPinSession = JSON.parse(cached);
      return showAttendanceForm();
    }
    return showModal('📴', 'অফলাইন', 'ইন্টারনেট নেই। আগে একবার অনলাইনে PIN দিন।', 'red');
  }

  showGlobalLoader();
  try {
    const { data: sessions } = await db.from('attendance_sessions')
      .select('*').eq('pin', pin).eq('is_active', true)
      .gte('expires_at', new Date().toISOString())
      .order('created_at', { ascending: false }).limit(1);
    if (!sessions || !sessions.length) {
      return showModal('❌', 'ভুল PIN', 'এই PIN সঠিক নয় বা মেয়াদ শেষ', 'red');
    }
    currentPinSession = sessions[0];
    localStorage.setItem('amc_last_session_' + pin, JSON.stringify(currentPinSession));
    showAttendanceForm();
  } finally { hideGlobalLoader(); }
}

async function loadStudentSuggestions(query) {
  const s = currentPinSession;
  // Offline হলে local student list
  if (!navigator.onLine) {
    const cached = localStorage.getItem('amc_students_' + s.session + '_' + s.year);
    if (cached) {
      const all = JSON.parse(cached);
      const filtered = all.filter(st =>
        (st.class_roll && st.class_roll.toLowerCase().includes(query.toLowerCase())) ||
        (st.reg_no && st.reg_no.toLowerCase().includes(query.toLowerCase()))
      ).slice(0, 10);
      return renderSuggestions(filtered);
    }
    return;
  }
  const { data: students } = await db.from('students')
    .select('id, name, class_roll, reg_no')
    .eq('session', s.session).eq('year', s.year).eq('status', 'active')
    .or(`class_roll.ilike.%${query}%,reg_no.ilike.%${query}%`)
    .limit(10);
  renderSuggestions(students || []);
}

function renderSuggestions(students) {
  if (!students || !students.length) {
    hideSuggestionBox();
    document.getElementById('studentPreview').innerHTML = `<p class="text-red-500 text-sm font-bold bangla-text">❌ এই রোলে কোনো ছাত্র নেই</p>`;
    document.getElementById('submitAttendanceBtn').disabled = true;
    return;
  }
  const sorted = sortStudents(students);
  const box = document.getElementById('suggestionBox');
  box.classList.remove('hidden');
  box.className = 'suggestion-box mb-3';
  box.innerHTML = sorted.map(stu => `
    <div class="suggestion-item" data-id="${escapeHtml(stu.id)}" data-roll="${escapeHtml(stu.class_roll)}" data-name="${escapeHtml(stu.name)}">
      <div>
        <div class="font-bold text-sm bangla-text"><span class="num-display">${escapeHtml(stu.class_roll)}</span> — ${escapeHtml(stu.name)}</div>
        <div class="text-xs text-gray-500 dark:text-gray-400 bangla-text">রেজি: <span class="num-display">${escapeHtml(stu.reg_no || '-')}</span></div>
      </div>
      <span class="text-indigo-500">›</span>
    </div>`).join('');
  box.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('click', () => selectStudent(item.dataset.id, item.dataset.roll, item.dataset.name));
  });
}

function hideSuggestionBox() {
  const b = document.getElementById('suggestionBox');
  if (b) { b.classList.add('hidden'); b.innerHTML = ''; }
}

async function findAndSubmit() {
  const roll = banglaToEnglish(document.getElementById('studentRollInput').value.trim());
  if (!roll) return toastWarning('রোল লিখুন');

  // Offline → queue
  if (!navigator.onLine) {
    queueAttendance(currentPinSession.pin, roll);
    showSuccessAndNext('(অফলাইন — পরে sync হবে)');
    return;
  }

  showGlobalLoader();
  try {
    const { data, error } = await db.rpc('student_mark_attendance_v2', {
      p_pin: currentPinSession.pin, p_roll: roll, p_device_id: deviceId
    });
    if (error) {
      document.getElementById('studentPreview').innerHTML = `<p class="text-red-500 text-center text-sm font-bold bangla-text">❌ নেটওয়ার্ক ত্রুটি</p>`;
      return;
    }
    if (!data.ok) {
      document.getElementById('studentPreview').innerHTML = `<p class="text-amber-600 text-center text-sm font-bold bangla-text">⚠️ ${escapeHtml(data.message)}</p>`;
      return;
    }
    showSuccessAndNext(data.student_name);
  } finally { hideGlobalLoader(); }
}

async function adminLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPass').value;
  document.getElementById('adminErr').textContent = '';
  showGlobalLoader();
  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) { document.getElementById('adminErr').textContent = 'ভুল ইমেইল বা পাসওয়ার্ড'; return; }
    const { data: t } = await db.from('teachers').select('is_admin').eq('auth_user_id', data.user.id).maybeSingle();
    if (!t || !t.is_admin) {
      await db.auth.signOut();
      document.getElementById('adminErr').textContent = 'আপনি অ্যাডমিন নন';
      return;
    }
    showSection('adminDashboard');
    showAdminTab('manageTeacher');
    toastSuccess('অ্যাডমিন লগইন সফল');
  } finally { hideGlobalLoader(); }
}

async function logout() {
  if (pinTimerInterval) { clearInterval(pinTimerInterval); pinTimerInterval = null; }
  if (activeSessionCheckInterval) { clearInterval(activeSessionCheckInterval); activeSessionCheckInterval = null; }
  await db.auth.signOut();
  currentTeacher = null; currentStudent = null;
  if (liveChannel) { await db.removeChannel(liveChannel); liveChannel = null; }
  showSection('home');
  toastInfo('লগআউট হয়েছে');
}

let pendingExcelStudents = null;
async function previewExcel() {
  const file = document.getElementById('excelFile')?.files[0];
  if (!file) return toastWarning('ফাইল সিলেক্ট করুন');
  const area = document.getElementById('excelPreviewArea');
  area.innerHTML = '<p class="text-center py-4 dark:text-gray-300 bangla-text">⏳...</p>';
  const session = document.getElementById('asSession').value.trim();
  const year = document.getElementById('asYear').value;
  if (!session) { area.innerHTML = '<p class="text-red-500 text-center bangla-text">❌ সেশন লিখুন</p>'; return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      const valid = [], dup = [], inv = [];
      const sR = new Set(), sG = new Set();
      rows.slice(1).forEach((r, i) => {
        const n = i + 2;
        const roll = String(r[0] || '').trim();
        const reg = String(r[1] || '').trim();
        const name = String(r[2] || '').trim();
        if (!roll || !name) { inv.push({ row: n }); return; }
        if (sR.has(roll)) { dup.push({ row: n, roll }); return; }
        if (reg && sG.has(reg)) { dup.push({ row: n, roll, reg }); return; }
        sR.add(roll);
        if (reg) sG.add(reg);
        valid.push({ session, year, class_roll: roll, reg_no: reg || null, name, status: 'active' });
      });
      let ex = [];
      if (valid.length) {
        const { data: existing } = await db.from('students').select('class_roll').eq('session', session).eq('year', year).in('class_roll', valid.map(v => v.class_roll));
        if (existing) { const s = new Set(existing.map(e => e.class_roll)); ex = valid.filter(v => s.has(v.class_roll)); }
      }
      const dbR = new Set(ex.map(e => e.class_roll));
      const finalV = valid.filter(v => !dbR.has(v.class_roll));
      pendingExcelStudents = finalV;
      area.innerHTML = `
        <div class="bg-white dark:bg-gray-700 border-2 border-indigo-200 dark:border-indigo-700 rounded-xl p-4 space-y-3">
          <h4 class="font-bold text-sm text-gray-700 dark:text-white bangla-text">📊 রিপোর্ট</h4>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="bg-emerald-50 dark:bg-emerald-900/30 p-2 rounded-lg">
              <p class="text-emerald-700 dark:text-emerald-300 font-bold text-xs bangla-text">✅ সঠিক</p>
              <p class="text-2xl font-bold text-emerald-800 dark:text-emerald-200 num-display">${finalV.length}</p>
            </div>
            <div class="bg-amber-50 dark:bg-amber-900/30 p-2 rounded-lg">
              <p class="text-amber-700 dark:text-amber-300 font-bold text-xs bangla-text">⚠️ Dup</p>
              <p class="text-2xl font-bold text-amber-800 dark:text-amber-200 num-display">${dup.length}</p>
            </div>
            <div class="bg-red-50 dark:bg-red-900/30 p-2 rounded-lg">
              <p class="text-red-700 dark:text-red-300 font-bold text-xs bangla-text">❌ Invalid</p>
              <p class="text-2xl font-bold text-red-800 dark:text-red-200 num-display">${inv.length}</p>
            </div>
            <div class="bg-orange-50 dark:bg-orange-900/30 p-2 rounded-lg">
              <p class="text-orange-700 dark:text-orange-300 font-bold text-xs bangla-text">🔁 DB-তে</p>
              <p class="text-2xl font-bold text-orange-800 dark:text-orange-200 num-display">${ex.length}</p>
            </div>
          </div>
          ${finalV.length ? `<button id="confirmExcelImportBtn" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold btn-pop bangla-text">✅ <span class="num-display">${finalV.length}</span> জন যোগ</button>` : '<p class="text-center text-red-500 text-sm bangla-text">যোগ করার ডাটা নেই</p>'}
        </div>`;
      const btn = document.getElementById('confirmExcelImportBtn');
      if (btn) btn.addEventListener('click', () => confirmExcelImport(btn));
    } catch (err) { area.innerHTML = `<p class="text-red-500 text-center py-4 bangla-text">❌ ${escapeHtml(err.message)}</p>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function confirmExcelImport(btn) {
  if (!pendingExcelStudents || !pendingExcelStudents.length) return toastWarning('ডাটা নেই');
  btn.disabled = true; btn.textContent = '⏳...';
  const { error } = await db.from('students').insert(pendingExcelStudents);
  if (error) { btn.disabled = false; btn.textContent = 'আবার চেষ্টা'; return toastError(error.message); }
  toastSuccess(`${pendingExcelStudents.length} জন যোগ হয়েছে`);
  pendingExcelStudents = null;
  document.getElementById('excelPreviewArea').innerHTML = '';
  document.getElementById('excelFile').value = '';
}

async function bulkUpdateStudents() {

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      const updates = rows.slice(1).map(r => ({
        class_roll: String(r[0] || '').trim(),
        reg_no: String(r[1] || '').trim(),

      const { data, error } = await db.rpc('bulk_update_students', { p_session: session, p_year: year, p_updates: updates });

          <p class="text-sm dark:text-white bangla-text">✗ পাওয়া যায়নি: <span class="num-display">${data.not_found}</span></p>
        </div>`;
    } catch (err) { status.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(err.message)}</p>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function changeStudentStatus(id, ns) {
  const l = { active: 'সক্রিয়', tc: 'টিসি', inactive: 'নিষ্ক্রিয়', graduated: 'গ্র্যাজুয়েটেড' };
  const ok = await confirmAction('নিশ্চিত?', `"${l[ns]}" মার্ক করবেন?`, 'হ্যাঁ', '#3b82f6');
  if (!ok) return;
  const u = { status: ns };
  if (ns === 'tc') u.tc_date = new Date().toISOString().split('T')[0];
  const { error } = await db.from('students').update(u).eq('id', id);
  if (error) return toastError(error.message);
  closeModal();
  toastSuccess(`${l[ns]} মার্ক হয়েছে`);
  loadStudentList();
}

async function deleteStudentPermanently(id, name) {
  const ok1 = await confirmAction('মুছবেন?', `⚠️ "${name}" কে?`, 'হ্যাঁ, মুছুন', '#dc2626');
  if (!ok1) return;
  const ok2 = await confirmAction('নিশ্চিত?', 'শেষবার।', 'হ্যাঁ', '#dc2626');
  if (!ok2) return;
  showGlobalLoader();
  try {
    const { error } = await db.from('students').delete().eq('id', id);
    if (error) return toastError(error.message);
    closeModal();
    toastSuccess('মুছে ফেলা হয়েছে');
    loadStudentList();
  } finally { hideGlobalLoader(); }
}

async function saveMapping() {
  const teacher_id = document.getElementById('mapTeacher').value;
  const session = document.getElementById('mapSession').value.trim();
  const year = document.getElementById('mapYear').value;
  const course_code = document.getElementById('mapCourse').value.trim().toUpperCase();
  const course_name = document.getElementById('mapCourseName').value.trim();
  if (!teacher_id || !session || !course_code) return toastWarning('শিক্ষক, সেশন, কোর্স দিন');
  showGlobalLoader();
  try {
    const { error: e1 } = await db.from('teacher_courses').insert({ teacher_id, session, year, course_code });
    if (e1 && !e1.message.includes('duplicate')) return toastError(e1.message);
    const { error: e2 } = await db.from('courses').upsert({ session, year, course_code, course_name: course_name || null }, { onConflict: 'session,year,course_code' });
    if (e2) console.error(e2);
    toastSuccess('ম্যাপিং সংরক্ষিত');
    document.getElementById('mapCourse').value = '';
    document.getElementById('mapCourseName').value = '';
    loadMappings();
  } finally { hideGlobalLoader(); }
}

async function loadMappings() {
  const { data } = await db.from('teacher_courses').select('*, teachers(name)').order('created_at', { ascending: false }).limit(50);
  if (!data || !data.length) { document.getElementById('mappingList').innerHTML = '<p class="text-gray-400 text-sm bangla-text">কোনো ম্যাপিং নেই</p>'; return; }
  const h = await Promise.all(data.map(async m => {
    const { data: c } = await db.from('courses').select('course_name').eq('session', m.session).eq('year', m.year).eq('course_code', m.course_code).maybeSingle();
    const dn = c?.course_name ? `${c.course_name}-${m.course_code}` : m.course_code;
    return `<div class="bg-cyan-50 dark:bg-cyan-900/30 px-3 py-2 rounded-lg text-sm mb-1 flex justify-between items-center">
      <span class="dark:text-white bangla-text">${escapeHtml(m.teachers?.name)} → <b class="num-display">${escapeHtml(dn)}</b></span>
      <span class="text-xs text-gray-500 dark:text-gray-400 bangla-text">${escapeHtml(m.session)} · ${escapeHtml(m.year)}</span>
    </div>`;
  }));
  document.getElementById('mappingList').innerHTML = h.join('');
}

let currentAttendanceData = null;
async function loadAttendanceReport() {
  const session = document.getElementById('arSession').value.trim();
  const year = document.getElementById('arYear').value;
  const area = document.getElementById('attendanceReportArea');
  if (!session || !year) { area.innerHTML = '<p class="text-red-500 text-center py-4 bangla-text">সেশন ও ইয়ার দিন</p>'; return; }
  area.innerHTML = '<p class="text-center py-4 dark:text-gray-300 bangla-text">⏳...</p>';
  try {
    const { data: sR } = await db.from('students').select('id, class_roll, reg_no, name').eq('session', session).eq('year', year).eq('status', 'active');
    const students = sortStudents(sR || []);
    if (!students.length) { area.innerHTML = '<p class="text-center text-gray-400 py-4 bangla-text">ছাত্র নেই</p>'; return; }
    const { data: courses } = await db.from('courses').select('*').eq('session', session).eq('year', year).order('course_code');
    if (!courses || !courses.length) { area.innerHTML = '<p class="text-center text-gray-400 py-4 bangla-text">কোর্স নেই</p>'; return; }
    const { data: sessions } = await db.from('attendance_sessions').select('id, course_code').eq('session', session).eq('year', year);
    const sIds = sessions?.map(s => s.id) || [];
    let records = [];
    if (sIds.length) {
      const { data: recs } = await db.from('attendance_records').select('student_id, session_id, status').in('session_id', sIds);
      records = recs || [];
    }
    const sMap = {};
    sessions?.forEach(s => { sMap[s.id] = s.course_code; });
    const report = students.map(stu => {
      const cc = {};
      courses.forEach(c => { cc[c.course_code] = 0; });
      records.filter(r => r.student_id === stu.id).forEach(r => {
        const code = sMap[r.session_id];
        if (code && (r.status === 'present' || r.status === 'late')) cc[code] = (cc[code] || 0) + 1;
      });
      const total = Object.values(cc).reduce((a, b) => a + b, 0);
      return { class_roll: stu.class_roll, reg_no: stu.reg_no || '', name: stu.name, courseCounts: cc, total };
    });
    const dH = courses.map(c => c.course_name ? `${c.course_name}-${c.course_code}` : c.course_code);
    currentAttendanceData = { session, year, courses, displayHeaders: dH, report };
    area.innerHTML = `
      <p class="text-sm text-gray-600 dark:text-gray-300 mb-2 bangla-text">
        <b>সেশন:</b> ${escapeHtml(session)} | <b>ইয়ার:</b> ${escapeHtml(year)} | <b>ছাত্র:</b> <span class="num-display">${report.length}</span> | <b>কোর্স:</b> <span class="num-display">${courses.length}</span>
      </p>
      <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
        <table class="min-w-full text-xs border dark:border-gray-600">
          <thead class="bg-gray-100 dark:bg-gray-700 sticky top-0">
            <tr>
              <th class="p-2 border dark:border-gray-600 dark:text-white num-cell" rowspan="2">Roll</th>
              <th class="p-2 border dark:border-gray-600 dark:text-white num-cell" rowspan="2">Reg No.</th>
              <th class="p-2 border dark:border-gray-600 dark:text-white text-left bangla-text" rowspan="2">Student Name</th>
              <th class="p-2 border dark:border-gray-600 dark:text-white bg-indigo-100 dark:bg-indigo-900 bangla-text" colspan="${courses.length}">Course Name/Code</th>
              <th class="p-2 border dark:border-gray-600 dark:text-white bg-amber-100 dark:bg-amber-900 num-cell" rowspan="2">Total</th>
            </tr>
            <tr class="bg-indigo-50 dark:bg-indigo-900/50">
              ${dH.map(h => `<th class="p-2 border dark:border-gray-600 dark:text-white num-display">${escapeHtml(h)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${report.map(r => `
              <tr class="hover:bg-gray-50 dark:hover:bg-gray-700 dark:text-white">
                <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(r.class_roll)}</td>
                <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(r.reg_no)}</td>
                <td class="p-2 border dark:border-gray-600 bangla-text">${escapeHtml(r.name)}</td>
                ${courses.map(c => `<td class="p-2 border dark:border-gray-600 text-center num-cell">${r.courseCounts[c.course_code] || 0}</td>`).join('')}
                <td class="p-2 border dark:border-gray-600 text-center font-bold bg-amber-50 dark:bg-amber-900/30 num-cell">${r.total}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (err) { area.innerHTML = `<p class="text-red-500 text-center py-4 bangla-text">❌ ${escapeHtml(err.message)}</p>`; }
}

async function exportAttendanceExcel() {
  if (!currentAttendanceData) return toastWarning('প্রথমে রিপোর্ট দেখুন');
  const { session, year, courses, displayHeaders, report } = currentAttendanceData;
  const row1 = ['', '', '', 'Course Name/Code', ...Array(courses.length - 1).fill(''), 'Total Class'];
  const row2 = ['Roll', 'Reg No.', 'Student Name', ...displayHeaders, 'Total Class'];
  const data = [row1, row2];
  report.forEach(r => data.push([r.class_roll, r.reg_no, r.name, ...courses.map(c => r.courseCounts[c.course_code] || 0), r.total]));
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{ wch: 6 }, { wch: 15 }, { wch: 28 }, ...courses.map(() => ({ wch: 12 })), { wch: 12 }];
  ws['!merges'] = [{ s: { r: 0, c: 3 }, e: { r: 0, c: 3 + courses.length - 1 } }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
  XLSX.writeFile(wb, `Attendance_${session}_${year}.xlsx`);
}

async function exportAttendancePDF() {
  if (!currentAttendanceData) return toastWarning('প্রথমে রিপোর্ট দেখুন');
  const { session, year, courses, displayHeaders, report } = currentAttendanceData;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  await setupBanglaFont(doc);
  doc.setFontSize(14);
  doc.text('AMC Economics - Attendance Report', 14, 15);
  doc.setFontSize(10);
  doc.text(`Session: ${session} | Year: ${year}`, 14, 22);
  doc.autoTable({
    head: [[
      { content: 'Roll', rowSpan: 2, styles: { valign: 'middle' } },
      { content: 'Reg No.', rowSpan: 2, styles: { valign: 'middle' } },
      { content: 'Student Name', rowSpan: 2, styles: { valign: 'middle' } },
      { content: 'Course Name/Code', colSpan: courses.length, styles: { halign: 'center' } },
      { content: 'Total', rowSpan: 2, styles: { valign: 'middle' } }
    ], displayHeaders],
    body: report.map(r => [r.class_roll, r.reg_no, r.name, ...courses.map(c => r.courseCounts[c.course_code] || 0), r.total]),
    startY: 28,
    styles: { fontSize: 8, font: 'HindSiliguri' },
    headStyles: { fillColor: [79, 70, 229], font: 'HindSiliguri', textColor: 255, halign: 'center' }
  });

// ============================================================
async function downloadFullBackup() {
  showGlobalLoader();
  try {
    const tables = ['students', 'teachers', 'courses', 'teacher_courses',
                    'attendance_sessions', 'attendance_records', 'marks', 'notices'];
    const backup = { version: '1.0', timestamp: new Date().toISOString(), data: {} };
    for (const t of tables) {
      const { data, error } = await db.from(t).select('*');
      if (error) console.warn(t, error);
      backup.data[t] = data || [];
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 16).replace(':', '-');
    a.href = url;
    a.download = `amc_backup_${ts}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toastSuccess('Backup ডাউনলোড হয়েছে');
  } catch (err) {
    toastError(err.message);
  } finally { hideGlobalLoader(); }
}

async function restoreFromBackup() {
  const file = document.getElementById('restoreFile')?.files[0];
  if (!file) return toastWarning('Backup file সিলেক্ট করুন');
  const status = document.getElementById('backupStatus');

  const ok1 = await confirmAction('⚠️ Restore?', 'এই কাজে বর্তমান সব data মুছে যাবে!', 'চলুন', '#dc2626');
  if (!ok1) return;
  const ok2 = await confirmAction('শেষবার?', 'নিশ্চিত?', 'হ্যাঁ, Restore', '#dc2626');
  if (!ok2) return;

  status.innerHTML = '<p class="text-gray-500 bangla-text">⏳ Restore হচ্ছে...</p>';
  showGlobalLoader();
  try {
    const text = await file.text();
    const backup = JSON.parse(text);
    if (!backup.data) throw new Error('Invalid backup');

    // Delete in safe order
    const delOrder = ['attendance_records', 'marks', 'attendance_sessions',
                     'teacher_courses', 'courses', 'students', 'notices'];
    for (const t of delOrder) {
      if (backup.data[t] !== undefined) {
        await db.from(t).delete().neq('id', '00000000-0000-0000-0000-000000000000');
      }
    }

    // Insert in dependency order
    const insOrder = ['teachers', 'students', 'courses', 'teacher_courses',
                     'notices', 'attendance_sessions', 'attendance_records', 'marks'];
    for (const t of insOrder) {
      const rows = backup.data[t];
      if (!rows || !rows.length) continue;
      const { error } = await db.from(t).insert(rows);
      if (error) console.warn(t, error);
    }

    status.innerHTML = '<p class="text-emerald-600 font-bold bangla-text">✅ Restore সম্পন্ন!</p>';
    toastSuccess('Restore সফল');
  } catch (err) {
    status.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(err.message)}</p>`;
    toastError(err.message);
  } finally { hideGlobalLoader(); }
}

  if (pinTimerInterval) { clearInterval(pinTimerInterval); pinTimerInterval = null; }

  if (tab === 'takeAttendance') {
    const { data: activeSess } = await db.from('attendance_sessions').select('*').eq('teacher_id', currentTeacher.id).eq('is_active', true).gte('expires_at', new Date().toISOString()).order('created_at', { ascending: false }).limit(1);
    if (activeSess && activeSess.length > 0) {
      const s = activeSess[0];
      const m = Math.max(0, Math.floor((new Date(s.expires_at) - new Date()) / 60000));
      el.innerHTML = `
        <div class="space-y-4 max-w-lg">
          <h3 class="text-lg font-bold dark:text-white bangla-text">📝 হাজিরা নিন</h3>

          </div>
          <div id="pinDisplay"></div>
        </div>`;

function setupManualSearch() {
  const si = document.getElementById('meSearch');
  let timer = null;
  si.addEventListener('input', (e) => {
    const q = banglaToEnglish(e.target.value.trim());
    if (timer) clearTimeout(timer);
    if (!q || q.length < 1) { document.getElementById('meSuggestionBox').classList.add('hidden'); return; }
    timer = setTimeout(() => searchStudentForManual(q), 300);
  });
}

async function searchStudentForManual(query) {
  const cv = document.getElementById('meCourse').value;
  if (!cv) return;
  const [, session, year] = cv.split('|');
  const { data: students } = await db.from('students')
    .select('id, name, class_roll, reg_no')
    .eq('session', session).eq('year', year).eq('status', 'active')
    .or(`name.ilike.%${query}%,class_roll.ilike.%${query}%,reg_no.ilike.%${query}%`)
    .limit(10);
  const box = document.getElementById('meSuggestionBox');
  if (!students || !students.length) {
    box.classList.remove('hidden');
    box.className = 'suggestion-box mb-3';
    box.innerHTML = '<div class="p-3 text-sm text-red-500 bangla-text">❌ কিছু পাওয়া যায়নি</div>';
    return;
  }
  const sorted = sortStudents(students);
  box.classList.remove('hidden');
  box.className = 'suggestion-box mb-3';
  box.innerHTML = sorted.map(s => `
    <div class="suggestion-item" data-roll="${escapeHtml(s.class_roll)}" data-name="${escapeHtml(s.name)}">
      <div>
        <div class="font-bold text-sm bangla-text"><span class="num-display">${escapeHtml(s.class_roll)}</span> — ${escapeHtml(s.name)}</div>
        <div class="text-xs text-gray-500 dark:text-gray-400 bangla-text">রেজি: <span class="num-display">${escapeHtml(s.reg_no || '-')}</span></div>
      </div>
      <span class="text-indigo-500">›</span>
    </div>`).join('');
  box.querySelectorAll('.suggestion-item').forEach(item => {
    item.addEventListener('click', () => {
      document.getElementById('meRoll').value = item.dataset.roll;
      document.getElementById('meSearch').value = `${item.dataset.roll} — ${item.dataset.name}`;
      box.classList.add('hidden');
      box.innerHTML = '';
    });
  });
}

async function openBulkPresent() {
  const cv = document.getElementById('meCourse').value;
  const date = document.getElementById('meDate').value;
  if (!cv || !date) return toastWarning('কোর্স ও তারিখ দিন');
  const [course_code, session, year] = cv.split('|');
  showGlobalLoader();
  try {
    let { data: sess } = await db.from('attendance_sessions').select('*')
      .eq('teacher_id', currentTeacher.id).eq('session', session).eq('year', year)
      .eq('course_code', course_code).eq('date', date).maybeSingle();
    if (!sess) {
      const { data: pd, error: pe } = await db.rpc('teacher_create_session', {
        p_teacher_id: currentTeacher.id, p_session: session, p_year: year,
        p_course_code: course_code, p_date: date
      });
      if (pe || !pd?.ok) return toastError('সেশন তৈরি ব্যর্থ');
      const { data: ns } = await db.from('attendance_sessions').select('*').eq('id', pd.session_id).maybeSingle();
      sess = ns;
    }
    const ok = await confirmAction('সবাই উপস্থিত?', 'যারা হাজিরা দিয়েছে বাদ দিয়ে বাকি সবাইকে present মার্ক।', 'হ্যাঁ', '#059669');
    if (!ok) return;
    const { data, error } = await db.rpc('bulk_mark_all_present', { p_session_id: sess.id, p_teacher_id: currentTeacher.id });
    if (error || !data.ok) return toastError(data?.message || error?.message);
    toastSuccess(`${data.added} জনকে উপস্থিত মার্ক`);
  } finally { hideGlobalLoader(); }
}

async function loadActivePinBanner() {
  if (!currentTeacher) return;
  const c = document.getElementById('activePinBannerContainer');
  if (!c) return;
  const { data } = await db.from('attendance_sessions').select('*').eq('teacher_id', currentTeacher.id).eq('is_active', true).gte('expires_at', new Date().toISOString()).order('created_at', { ascending: false }).limit(1);
  if (!data || !data.length) {
    c.innerHTML = '';
    if (activeSessionCheckInterval) { clearInterval(activeSessionCheckInterval); activeSessionCheckInterval = null; }
    return;
  }
  const s = data[0];
  c.innerHTML = `
    <div id="activePinBanner" class="mb-4 bg-gradient-to-r from-emerald-500 to-emerald-600 dark:from-emerald-700 dark:to-emerald-800 text-white p-4 rounded-2xl shadow-lg">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div>
          <p class="text-xs opacity-90 bangla-text">🟢 চলমান ক্লাস</p>
          <p class="font-bold text-lg bangla-text"><span class="num-display">${escapeHtml(s.course_code)}</span> — PIN: <span class="font-mono text-2xl tracking-wider num-display">${escapeHtml(s.pin)}</span></p>
          <p class="text-xs opacity-90 mt-1 bangla-text">📅 <span class="num-display">${escapeHtml(s.date)}</span> · ⏰ <span id="bannerTimer" class="num-display">...</span></p>
        </div>
        <button onclick="closeActivePinFromBanner('${escapeHtml(s.id)}')" class="bg-white text-red-600 px-4 py-2 rounded-xl font-bold btn-pop text-sm bangla-text">🔒 PIN বন্ধ</button>
      </div>
    </div>`;
  if (activeSessionCheckInterval) clearInterval(activeSessionCheckInterval);
  const expiry = new Date(s.expires_at).getTime();
  const tick = () => {
    const diff = expiry - Date.now();
    const el = document.getElementById('bannerTimer');
    if (!el) return;
    if (diff <= 0) {
      el.textContent = 'মেয়াদ শেষ';
      clearInterval(activeSessionCheckInterval);
      activeSessionCheckInterval = null;
      setTimeout(() => loadActivePinBanner(), 1500);
      return;
    }
    const m = Math.floor(diff / 60000), sec = Math.floor((diff % 60000) / 1000);
    el.textContent = `${m}:${String(sec).padStart(2, '0')} বাকি`;
  };
  tick();
  activeSessionCheckInterval = setInterval(tick, 1000);
  setTimeout(() => { if (currentTeacher) loadActivePinBanner(); }, 30000);
}

async function closeActivePinFromBanner(sessionId) {
  const ok = await confirmAction('PIN বন্ধ?', 'শিক্ষার্থীরা আর হাজিরা দিতে পারবে না।', 'বন্ধ', '#dc2626');
  if (!ok) return;
  showGlobalLoader();
  try {
    const { data, error } = await db.rpc('close_attendance_session', { p_session_id: sessionId, p_teacher_id: currentTeacher.id });
    if (error || !data.ok) return toastError(data?.message || error?.message);
    toastSuccess('PIN বন্ধ');
    loadActivePinBanner();
    const tc = document.getElementById('teacherContent');
    if (tc && tc.querySelector('#atCourseSelect')) showTeacherTab('takeAttendance');
  } finally { hideGlobalLoader(); }
}

async function generatePin() {
  const sel = document.getElementById('atCourseSelect');
  if (!sel || !sel.value) return toastWarning('কোর্স সিলেক্ট করুন');
  const [course_code, session, year] = sel.value.split('|');
  const date = document.getElementById('atDate').value;
  if (!date) return toastWarning('তারিখ দিন');
  showGlobalLoader();
  try {
    const { data, error } = await db.rpc('teacher_create_session', {
      p_teacher_id: currentTeacher.id, p_session: session, p_year: year,
      p_course_code: course_code, p_date: date
    });
    if (error || !data.ok) return toastError(data?.message || 'PIN তৈরি ব্যর্থ');
    toastSuccess('PIN তৈরি হয়েছে');
    renderPinDisplay(data.pin, data.session_id, 45, new Date(Date.now() + 45 * 60000).toISOString());
    loadActivePinBanner();
  } finally { hideGlobalLoader(); }
}

function renderPinDisplay(pin, sessionId, mLeft, expiresAt) {
  const el = document.getElementById('pinDisplay');
  if (!el) return;
  el.innerHTML = `
    <div class="bg-indigo-50 dark:bg-indigo-900/40 rounded-2xl p-6 text-center">
      <p class="text-gray-500 dark:text-gray-400 mb-1 bangla-text">ছাত্রদের দেখান</p>
      <p class="text-7xl font-bold text-indigo-600 dark:text-indigo-300 tracking-widest num-display">${escapeHtml(pin)}</p>
      <p class="pin-timer text-gray-600 dark:text-gray-300 mt-3 bangla-text" id="pinTimerDisplay">⏰ <span class="num-display">${mLeft}</span> মিনিট</p>
      <button id="closePinBtn" class="mt-4 bg-red-600 text-white px-6 py-3 rounded-xl font-bold btn-pop w-full bangla-text">🔒 PIN বন্ধ</button>
    </div>`;
  const expiry = expiresAt ? new Date(expiresAt).getTime() : (Date.now() + mLeft * 60000);
  if (pinTimerInterval) clearInterval(pinTimerInterval);
  pinTimerInterval = setInterval(() => {
    const diff = expiry - Date.now();
    const t = document.getElementById('pinTimerDisplay');
    const btn = document.getElementById('closePinBtn');
    if (diff <= 0) {
      clearInterval(pinTimerInterval); pinTimerInterval = null;
      if (t) t.innerHTML = '⏰ মেয়াদ শেষ';
      if (btn) btn.disabled = true;
      loadActivePinBanner();
      return;
    }
    const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
    if (t) t.innerHTML = `⏰ <span class="num-display">${m}:${String(s).padStart(2, '0')}</span> বাকি`;
  }, 1000);
  const btn = document.getElementById('closePinBtn');
  if (btn) btn.addEventListener('click', () => closePin(sessionId));
}

async function closePin(sessionId) {
  const ok = await confirmAction('PIN বন্ধ?', 'শিক্ষার্থীরা আর হাজিরা দিতে পারবে না।', 'বন্ধ', '#dc2626');
  if (!ok) return;
  showGlobalLoader();
  try {
    const { data, error } = await db.rpc('close_attendance_session', { p_session_id: sessionId, p_teacher_id: currentTeacher.id });
    if (error || !data.ok) return toastError(data?.message || error?.message);
    if (pinTimerInterval) { clearInterval(pinTimerInterval); pinTimerInterval = null; }
    const el = document.getElementById('pinDisplay');
    if (el) el.innerHTML = `<div class="bg-gray-100 dark:bg-gray-700 rounded-2xl p-6 text-center"><p class="text-4xl mb-2">🔒</p><p class="text-gray-600 dark:text-gray-300 font-bold bangla-text">PIN বন্ধ</p></div>`;
    toastSuccess('PIN বন্ধ');
    loadActivePinBanner();
  } finally { hideGlobalLoader(); }
}

async function loadLiveSessions() {
  const { data } = await db.from('attendance_sessions').select('*').eq('teacher_id', currentTeacher.id).eq('is_active', true).gte('expires_at', new Date().toISOString()).order('created_at', { ascending: false });
  const sel = document.getElementById('liveSessionSelect');
  sel.innerHTML = data?.map(s => `<option value="${s.id}">${escapeHtml(s.course_code)} — ${escapeHtml(s.date)} — PIN ${escapeHtml(s.pin)}</option>`).join('') || '<option>কোনো সেশন নেই</option>';
  if (data && data.length) {
    sel.onchange = () => subscribeLive(sel.value);
    subscribeLive(data[0].id);
  }
}

function subscribeLive(sessionId) {
  if (liveChannel) { db.removeChannel(liveChannel); liveChannel = null; }
  const refresh = async () => {
    const { data, error } = await db.from('attendance_records').select('marked_at, students(name, class_roll)').eq('session_id', sessionId);
    const rows = error || !data ? [] : data;
    const el = document.getElementById('liveCount');
    if (el) el.innerHTML = `<p class="text-6xl font-bold text-emerald-600 num-display">${rows.length}</p><p class="text-gray-500 dark:text-gray-400 bangla-text">উপস্থিত</p>`;
    const el2 = document.getElementById('liveList');
    if (el2) el2.innerHTML = rows.sort((a,b) => new Date(b.marked_at) - new Date(a.marked_at))
      .map(r => `<div class="bg-emerald-50 dark:bg-emerald-900/30 px-3 py-2 rounded-lg flex justify-between">
        <span class="dark:text-white bangla-text">✅ ${escapeHtml(r.students?.name)}</span>
        <span class="text-xs text-gray-400 num-display">${new Date(r.marked_at).toLocaleTimeString('en-GB')}</span>
      </div>`).join('');
  };
  liveChannel = db.channel('live_' + sessionId).on('postgres_changes', {
    event: '*', schema: 'public', table: 'attendance_records',
    filter: `session_id=eq.${sessionId}`
  }, refresh).subscribe();
  refresh();
}

async function manualAttendance() {
  const cv = document.getElementById('meCourse').value;
  const date = document.getElementById('meDate').value;
  const roll = document.getElementById('meRoll').value.trim();
  const status = document.getElementById('meStatus').value;
  if (!cv || !date || !roll) return toastWarning('সব তথ্য দিন');
  const [course_code, session, year] = cv.split('|');
  showGlobalLoader();
  try {
    let { data: sess } = await db.from('attendance_sessions').select('*').eq('teacher_id', currentTeacher.id).eq('session', session).eq('year', year).eq('course_code', course_code).eq('date', date).maybeSingle();
    if (!sess) {
      const { data: pd, error: pe } = await db.rpc('teacher_create_session', {
        p_teacher_id: currentTeacher.id, p_session: session, p_year: year,
        p_course_code: course_code, p_date: date
      });
      if (pe || !pd?.ok || !pd?.session_id) return toastError('সেশন তৈরি ব্যর্থ');
      const { data: ns } = await db.from('attendance_sessions').select('*').eq('id', pd.session_id).maybeSingle();
      sess = ns;
    }
    const { data: student } = await db.from('students').select('id, name').eq('session', session).eq('year', year).eq('status', 'active').or(`class_roll.eq.${roll},reg_no.eq.${roll}`).maybeSingle();
    if (!student) return toastError('ছাত্র পাওয়া যায়নি');
    const { error } = await db.from('attendance_records').upsert({
      session_id: sess.id, student_id: student.id, status, marked_by: currentTeacher.id
    }, { onConflict: 'session_id,student_id' });
    if (error) return toastError(error.message);
    toastSuccess('সেভ: ' + student.name);
    document.getElementById('meRoll').value = '';
    document.getElementById('meSearch').value = '';
  } finally { hideGlobalLoader(); }
}

let currentTeacherAttendanceData = null;
async function loadTeacherAttendanceReport() {
  const cv = document.getElementById('tarCourse').value;
  const fromDate = document.getElementById('tarFrom').value;
  const toDate = document.getElementById('tarTo').value;
  const area = document.getElementById('teacherAttendanceReportArea');
  if (!fromDate || !toDate) { area.innerHTML = '<p class="text-red-500 text-center py-4 bangla-text">দুই তারিখ দিন</p>'; return; }
  area.innerHTML = '<p class="text-center py-4 dark:text-gray-300 bangla-text">⏳...</p>';
  let fs = null, fy = null, fc = null;
  if (cv) [fc, fs, fy] = cv.split('|');
  let q = db.from('attendance_sessions').select('id, course_code, date, session, year, pin').eq('teacher_id', currentTeacher.id).gte('date', fromDate).lte('date', toDate).order('date', { ascending: false });
  if (fs) q = q.eq('session', fs);
  if (fy) q = q.eq('year', fy);
  if (fc) q = q.eq('course_code', fc);
  const { data: sessions, error: sErr } = await q;
  if (sErr) { area.innerHTML = `<p class="text-red-500 text-center py-4 bangla-text">❌ ${escapeHtml(sErr.message)}</p>`; return; }
  if (!sessions || !sessions.length) { area.innerHTML = '<p class="text-gray-400 text-center py-4 bangla-text">এই সময়ে কোনো ক্লাস নেই</p>'; return; }
  const sIds = sessions.map(s => s.id);
  const { data: records } = await db.from('attendance_records').select('id, session_id, student_id, status, students(name, class_roll, reg_no)').in('session_id', sIds);
  const byS = {};
  sessions.forEach(s => { byS[s.id] = { session: s, records: [] }; });
  (records || []).forEach(r => { if (byS[r.session_id]) byS[r.session_id].records.push(r); });
  const rows = Object.values(byS).map(({ session, records }) => ({
    session, records,
    present: records.filter(r => r.status === 'present').length,
    absent: records.filter(r => r.status === 'absent').length,
    late: records.filter(r => r.status === 'late').length,
    excused: records.filter(r => r.status === 'excused').length
  }));
  currentTeacherAttendanceData = { fromDate, toDate, rows, courseLabel: cv || 'সব কোর্স' };
  const tP = rows.reduce((s, r) => s + r.present, 0);
  const tA = rows.reduce((s, r) => s + r.absent, 0);
  const tL = rows.reduce((s, r) => s + r.late, 0);
  const tE = rows.reduce((s, r) => s + r.excused, 0);

    <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-xl mb-3">
      <p class="text-sm dark:text-white mb-2 bangla-text">
        <b>তারিখ:</b> <span class="num-display">${escapeHtml(fromDate)}</span> থেকে <span class="num-display">${escapeHtml(toDate)}</span> · <b>ক্লাস:</b> <span class="num-display">${sessions.length}</span>
      </p>
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="bg-emerald-50 dark:bg-emerald-900/30 p-2 rounded-lg"><p class="text-emerald-700 dark:text-emerald-300 font-bold text-xs">✅</p><p class="text-xl font-bold text-emerald-800 dark:text-emerald-200 num-display">${tP}</p></div>
        <div class="bg-red-50 dark:bg-red-900/30 p-2 rounded-lg"><p class="text-red-700 dark:text-red-300 font-bold text-xs">❌</p><p class="text-xl font-bold text-red-800 dark:text-red-200 num-display">${tA}</p></div>
        <div class="bg-amber-50 dark:bg-amber-900/30 p-2 rounded-lg"><p class="text-amber-700 dark:text-amber-300 font-bold text-xs">⏰</p><p class="text-xl font-bold text-amber-800 dark:text-amber-200 num-display">${tL}</p></div>
        <div class="bg-blue-50 dark:bg-blue-900/30 p-2 rounded-lg"><p class="text-blue-700 dark:text-blue-300 font-bold text-xs">📝</p><p class="text-xl font-bold text-blue-800 dark:text-blue-200 num-display">${tE}</p></div>
      </div>
    </div>
    <div class="space-y-3">
      ${rows.map(({ session: s, records }) => `
        <details class="bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 rounded-xl" open>
          <summary class="cursor-pointer p-3 font-bold dark:text-white bangla-text">
            📅 <span class="num-display">${escapeHtml(s.date)}</span> · 📚 <span class="num-display">${escapeHtml(s.course_code)}</span> · PIN <span class="num-display">${escapeHtml(s.pin)}</span>
          </summary>
          <div class="p-3 pt-0">
            ${records.length === 0 ? '<p class="text-gray-400 text-sm bangla-text">কেউ হাজিরা দেয়নি</p>' : `

              <table class="min-w-full text-xs border dark:border-gray-600">
                <thead class="bg-gray-100 dark:bg-gray-600">
                  <tr>
                    <th class="p-2 border dark:border-gray-600 dark:text-white num-cell">Roll</th>
                    <th class="p-2 border dark:border-gray-600 dark:text-white num-cell">Reg</th>

                  </tr>
                </thead>

                    const icons = { present: '✅ উপস্থিত', absent: '❌ অনুপস্থিত', late: '⏰ দেরি', excused: '📝 ছাড়' };

                      <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(r.students?.class_roll || '-')}</td>
                      <td class="p-2 border dark:border-gray-600 text-center num-cell">${escapeHtml(r.students?.reg_no || '-')}</td>
                      <td class="p-2 border dark:border-gray-600 bangla-text">${escapeHtml(r.students?.name || '-')}</td>

                      </td>

                  }).join('')}
                </tbody>
              </table>`}
          </div>
        </details>
      `).join('')}
    </div>`;

async function changeAttendanceStatus(recordId, currentStatus) {
  const result = await Swal.fire({
    title: 'Status পরিবর্তন',
    input: 'select',
    inputOptions: { present: '✅ উপস্থিত', absent: '❌ অনুপস্থিত', late: '⏰ দেরি', excused: '📝 ছাড়' },
    inputValue: currentStatus,
    showCancelButton: true,
    confirmButtonText: 'সেভ',
    cancelButtonText: 'বাতিল',
    confirmButtonColor: '#4f46e5'
  });
  if (!result.isConfirmed || result.value === currentStatus) return;
  showGlobalLoader();
  try {
    const { data, error } = await db.rpc('update_attendance_status', {
      p_record_id: recordId, p_new_status: result.value, p_teacher_id: currentTeacher.id
    });
    if (error || !data.ok) return toastError(data?.message || error?.message);
    toastSuccess('পরিবর্তিত');
    loadTeacherAttendanceReport();
  } finally { hideGlobalLoader(); }
}

async function exportTeacherAttendancePDF() {
  if (!currentTeacherAttendanceData) return toastWarning('প্রথমে রিপোর্ট দেখুন');
  const { fromDate, toDate, rows } = currentTeacherAttendanceData;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  await setupBanglaFont(doc);

  if (!session || !year) return toastWarning('কোর্স তথ্য অসম্পূর্ণ');

  showGlobalLoader();

    const { data: sRaw, error: sE } = await db.from('students').select('id, name, class_roll, reg_no').eq('session', session).eq('year', year).eq('status', 'active');

                <td class="p-2 border dark:border-gray-600 bangla-text">${escapeHtml(s.name)}</td>
                <td class="p-2 border dark:border-gray-600 text-center">
                  <input type="number" min="0" max="100" value="${mMap[s.id] ?? ''}" ${disabled}
                    class="mark-input w-20 border-2 rounded-lg p-2 text-center dark:bg-gray-600 dark:text-white dark:border-gray-500 disabled:opacity-50"
                    style="font-family: Arial, sans-serif !important;"
                    data-student-id="${escapeHtml(s.id)}">
                </td>
              </tr>`).join('')}
          </tbody>

}

let markSaveTimers = {};
function autoSaveMark(inp) {
  const sid = inp.dataset.studentId;
  if (markSaveTimers[sid]) clearTimeout(markSaveTimers[sid]);
  markSaveTimers[sid] = setTimeout(() => {
    saveMark(sid, inp.value, inp);
  }, 800);
}

async function saveMark(studentId, marks, inputEl) {
  if (String(marks).trim() === '') return;
  const ctx = currentMarkContext;
  if (!ctx) return;

  const num = Number(banglaToEnglish(marks));
  if (isNaN(num) || num < 0 || num > 100) {
    if (inputEl) inputEl.style.background = '#fecaca';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 1500);
    return toastWarning('নম্বর ০-১০০ হতে হবে');
  }

  if (ctx.mMap[studentId] === num) return; // same value skip

  const { data, error } = await db.rpc('save_mark', {
    p_session: ctx.session, p_year: ctx.year, p_course_code: ctx.course,
    p_exam_type: ctx.exam, p_student_id: studentId, p_marks: num,
    p_teacher_id: currentTeacher ? currentTeacher.id : null
  });

  if (error || !data?.ok) {
    if (inputEl) inputEl.style.background = '#fecaca';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 1500);
    return toastError(data?.message || error?.message);
  }

  ctx.mMap[studentId] = num;
  if (inputEl) {
    inputEl.style.background = '#d1fae5';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 800);
  }
  toastSuccess('সেভ হয়েছে');
}

function toggleMarkMode() {
  // Just visual feedback — no state change
  toastInfo('View/Update mode active');
}

async function publishMarks(publish) {
  const ctx = currentMarkContext;
  if (!ctx) return;
  const ok = await confirmAction(
    publish ? 'Publish করবেন?' : 'Unpublish করবেন?',
    publish ? 'Publish করলে edit locked হয়ে যাবে।' : 'Unpublish করলে আবার edit unlock হবে।',
    publish ? 'Publish' : 'Unpublish',
    publish ? '#059669' : '#d97706'
  );
  if (!ok) return;

  showGlobalLoader();
  try {
    const { error } = await db.from('marks')
      .update({ 
        is_published: publish,
        published_at: publish ? new Date().toISOString() : null,
        published_by: publish ? currentTeacher.id : null
      })
      .eq('session', ctx.session).eq('year', ctx.year)
      .eq('course_code', ctx.course).eq('exam_type', ctx.exam);
    if (error) return toastError(error.message);
    ctx.isPublished = publish;
    toastSuccess(publish ? '✅ Published' : '🔓 Unpublished');
    const status = document.getElementById('publishStatus');
    if (status) {
      status.innerHTML = publish 
        ? `<span class="published-badge bangla-text">✅ Published</span><p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">Locked</p>` 
        : `<span class="draft-badge bangla-text">📝 Draft</span><p class="text-xs text-gray-500 dark:text-gray-400 bangla-text">Edit করা যাবে</p>`;
    }
    renderMarksGrid(window.innerWidth < 768 ? 'card' : 'grid');
  } finally { hideGlobalLoader(); }
}

async function downloadMarksTemplate() {
  const ctx = currentMarkContext;
  if (!ctx) return;
  const data = [['Class Roll', 'Reg No', 'Name', ctx.exam]];
  ctx.students.forEach(s => data.push([s.class_roll, s.reg_no || '', s.name, '']));
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Marks');
  XLSX.writeFile(wb, `Marks_${ctx.course}_${ctx.exam}.xlsx`);
}

async function exportMarksExcel() {
  const ctx = currentMarkContext;
  if (!ctx) return;
  const data = [['Class Roll', 'Reg No', 'Name', ctx.exam]];
  ctx.students.forEach(s => data.push([s.class_roll, s.reg_no || '', s.name, ctx.mMap[s.id] ?? '']));
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Marks');
  XLSX.writeFile(wb, `Marks_${ctx.course}_${ctx.exam}.xlsx`);
}

async function exportMarksPDF() {
  const ctx = currentMarkContext;
  if (!ctx) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait' });
  await setupBanglaFont(doc);
  doc.setFontSize(14);
  doc.text(`Marks - ${ctx.course} (${ctx.exam})`, 14, 15);
  doc.setFontSize(10);
  doc.text(`Session: ${ctx.session} | Year: ${ctx.year}`, 14, 22);
  doc.autoTable({
    head: [['Roll', 'Reg', 'Name', 'Marks']],
    body: ctx.students.map(s => [s.class_roll, s.reg_no || '-', s.name, ctx.mMap[s.id] ?? '-']),
    startY: 28,
    styles: { fontSize: 9, font: 'HindSiliguri' },
    headStyles: { fillColor: [139, 92, 246], font: 'HindSiliguri' }
  });
  doc.save(`Marks_${ctx.course}_${ctx.exam}.pdf`);
}

async function importMarksExcel() {
  const file = document.getElementById('marksFile')?.files[0];
  if (!file) return toastWarning('ফাইল সিলেক্ট করুন');
  const ctx = currentMarkContext;
  if (!ctx) return;
  const status = document.getElementById('marksStatus');
  status.innerHTML = '<p class="text-gray-500 bangla-text">⏳...</p>';

  const map = {};
  ctx.students.forEach(s => { map[s.class_roll] = s.id; });

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
      let ok = 0, nf = 0, iv = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const roll = String(r[0] || '').trim();
        const mv = r[3];
        if (!roll) continue;
        const sid = map[roll];
        if (!sid) { nf++; continue; }
        if (mv === '' || mv === undefined || mv === null) continue;
        const num = Number(banglaToEnglish(mv));
        if (isNaN(num) || num < 0 || num > 100) { iv++; continue; }
        const { error } = await db.rpc('save_mark', {
          p_session: ctx.session, p_year: ctx.year, p_course_code: ctx.course,
          p_exam_type: ctx.exam, p_student_id: sid, p_marks: num,
          p_teacher_id: currentTeacher ? currentTeacher.id : null
        });
        if (error) iv++; else { ok++; ctx.mMap[sid] = num; }
      }
      status.innerHTML = `
        <div class="bg-emerald-50 dark:bg-emerald-900/30 p-4 rounded-xl">
          <p class="font-bold text-emerald-700 dark:text-emerald-300 mb-2 bangla-text">✅ Import সম্পন্ন</p>
          <p class="text-sm dark:text-white bangla-text">✓ সফল: <span class="num-display">${ok}</span></p>
          <p class="text-sm dark:text-white bangla-text">✗ পাওয়া যায়নি: <span class="num-display">${nf}</span></p>
          <p class="text-sm dark:text-white bangla-text">❌ Invalid: <span class="num-display">${iv}</span></p>
        </div>`;
      renderMarksGrid(window.innerWidth < 768 ? 'card' : 'grid');
    } catch (err) { status.innerHTML = `<p class="text-red-500 bangla-text">❌ ${escapeHtml(err.message)}</p>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function studentLogin() {
  const session = document.getElementById('studentSession').value.trim();
  const roll = document.getElementById('studentRoll').value.trim();
  document.getElementById('studentErr').textContent = '';
  showGlobalLoader();
  try {
    const { data, error } = await db.from('students').select('id, name, session, year, class_roll, reg_no, status').eq('session', session).or(`class_roll.eq.${roll},reg_no.eq.${roll}`).maybeSingle();
    if (error || !data) { document.getElementById('studentErr').textContent = 'ভুল তথ্য'; return; }
    currentStudent = data;
    showSection('studentDashboard');
    loadStudentData();
    toastSuccess(`স্বাগতম, ${data.name}`);
  } finally { hideGlobalLoader(); }
}

async function loadStudentData() {
  const student = currentStudent;
  const { data: mySessions } = await db.from('attendance_sessions').select('id, course_code, date').eq('session', student.session).eq('year', student.year);
  const total = mySessions?.length || 0;
  const { data: records } = await db.from('attendance_records').select('status, session_id, attendance_sessions(course_code, date)').eq('student_id', student.id);
  const att = records?.filter(r => r.status === 'present' || r.status === 'late').length || 0;
  const pct = total > 0 ? ((att / total) * 100).toFixed(1) : 0;
  const pC = pct >= 70 ? 'emerald' : pct >= 50 ? 'amber' : 'red';
  const { data: notices } = await db.from('notices').select('*').or(`expires_at.is.null,expires_at.gte.${new Date().toISOString()}`).order('created_at', { ascending: false }).limit(5);
  document.getElementById('studentContent').innerHTML = `
    <div class="bg-indigo-50 dark:bg-indigo-900/30 rounded-2xl p-5 mb-4 text-center">
      <p class="text-gray-500 dark:text-gray-400 text-sm bangla-text">${escapeHtml(student.name)}</p>
      <p class="text-xs text-gray-400 dark:text-gray-500 bangla-text">${escapeHtml(student.session)} · ${escapeHtml(student.year)} · রোল <span class="num-display">${escapeHtml(student.class_roll)}</span></p>
    </div>
    <div class="bg-${pC}-50 dark:bg-${pC}-900/30 rounded-2xl p-6 mb-4 text-center">
      <p class="text-5xl font-bold text-${pC}-600 dark:text-${pC}-300 num-display">${pct}%</p>
      <p class="text-gray-500 dark:text-gray-400 bangla-text">উপস্থিতির হার</p>
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-2 bangla-text"><span class="num-display">${att}</span> / <span class="num-display">${total}</span></p>
    </div>
    <h3 class="font-bold mb-2 dark:text-white bangla-text">📋 হাজিরার ইতিহাস</h3>
    <div class="space-y-1 mb-6 max-h-60 overflow-y-auto">
      ${records?.length ? records.map(r => {
        const ic = { present: '✅', absent: '❌', late: '⏰', excused: '📝' };
        return `<div class="bg-gray-50 dark:bg-gray-700 px-3 py-2 rounded-xl flex justify-between text-sm dark:text-white">
          <span class="bangla-text">${ic[r.status] || '✅'} <span class="num-display">${escapeHtml(r.attendance_sessions?.course_code || '-')}</span></span>
          <span class="text-gray-500 dark:text-gray-400 num-display">${escapeHtml(r.attendance_sessions?.date || '')}</span>
        </div>`;
      }).join('') : '<p class="text-gray-400 text-sm bangla-text">কোনো রেকর্ড নেই</p>'}
    </div>
    <h3 class="font-bold mb-2 dark:text-white bangla-text">📢 নোটিশ</h3>
    ${notices?.map(n => `
      <div class="${n.priority === 'urgent' ? 'bg-red-50 dark:bg-red-900/30 border-l-4 border-red-500' : 'bg-pink-50 dark:bg-pink-900/30'} p-3 rounded-xl mb-2">
        <b class="dark:text-white bangla-text">${n.priority === 'urgent' ? '🚨 ' : ''}${escapeHtml(n.title)}</b>
        <p class="text-sm text-gray-600 dark:text-gray-300 bangla-text">${escapeHtml(n.content)}</p>
      </div>`).join('') || '<p class="text-gray-400 text-sm bangla-text">কোনো নোটিশ নেই</p>'}
  `;
}
