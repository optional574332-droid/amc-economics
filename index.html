<script>
// ============================================================
// ⚙️ কনফিগারেশন
// ============================================================
const SUPABASE_URL = 'https://zalzlqabfbpxnavbxchx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_O3FCdhsMo4gviKn_B6_XLg_5tA-V5S0';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTeacher = null;
let currentStudent = null;
let currentPinSession = null;
let liveChannel = null;
let pinTimerInterval = null;

let deviceId = localStorage.getItem('amc_device_id');
if (!deviceId) {
  deviceId = 'dev_' + Math.random().toString(36).slice(2) + Date.now();
  localStorage.setItem('amc_device_id', deviceId);
}

// ============================================================
// 🔤 বাংলা ফন্ট লোডার
// ============================================================
let banglaFontLoaded = false;
let banglaFontBase64 = null;

async function loadBanglaFont() {
  if (banglaFontLoaded) return banglaFontBase64;
  try {
    const response = await fetch(
      'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/hindsiliguri/HindSiliguri-Regular.ttf'
    );
    if (!response.ok) return null;
    const buffer = await response.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    banglaFontBase64 = btoa(binary);
    banglaFontLoaded = true;
    console.log('✅ বাংলা ফন্ট লোড হয়েছে');
    return banglaFontBase64;
  } catch (err) {
    console.log('⚠️ বাংলা ফন্ট লোড ব্যর্থ:', err.message);
    return null;
  }
}

async function setupBanglaFont(doc) {
  const fontBase64 = await loadBanglaFont();
  if (fontBase64) {
    try {
      doc.addFileToVFS('HindSiliguri-Regular.ttf', fontBase64);
      doc.addFont('HindSiliguri-Regular.ttf', 'HindSiliguri', 'normal');
      doc.setFont('HindSiliguri');
      return true;
    } catch (err) { return false; }
  }
  return false;
}

// XSS নিরাপত্তা
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

// সেশন ডেটালিস্ট
const sessionDatalist = `
  <datalist id="sessionOptions">
    <option value="2020-21"><option value="2021-22">
    <option value="2022-23"><option value="2023-24">
    <option value="2024-25"><option value="2025-26">
    <option value="2026-27"><option value="2027-28">
    <option value="2028-29"><option value="2029-30">
    <option value="2030-31">
  </datalist>`;

// সেকশন পরিবর্তন
function showSection(id) {
  if (pinTimerInterval) { clearInterval(pinTimerInterval); pinTimerInterval = null; }
  document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
  const t = document.getElementById(id + 'Section');
  if (t) { t.classList.remove('hidden'); t.classList.add('fade-in'); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// ছাত্রের হাজিরা (PIN) — Live Preview সহ
// ============================================================
async function submitPin() {
  const pin = document.getElementById('homePinInput').value.trim();
  if (pin.length !== 4) return alert('৪-ডিজিটের PIN দিন');

  const { data: sessions } = await db.from('attendance_sessions')
    .select('*').eq('pin', pin)
    .eq('is_active', true)
    .gte('expires_at', new Date().toISOString())
    .order('created_at', { ascending: false }).limit(1);

  if (!sessions || !sessions.length) {
    return showModal('❌', 'ভুল PIN', 'এই PIN সঠিক নয় বা মেয়াদ শেষ', 'red');
  }
  currentPinSession = sessions[0];
  showAttendanceForm();
}

function showAttendanceForm() {
  const s = currentPinSession;
  document.getElementById('attendanceModal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = `
    <div class="text-center mb-4">
      <div class="text-4xl mb-1">✅</div>
      <h3 class="text-lg font-bold text-gray-800">PIN সঠিক</h3>
      <p class="text-gray-500 text-sm">📅 ${escapeHtml(s.date)} · 📚 ${escapeHtml(s.course_code)}</p>
      <p class="text-xs text-gray-400">${escapeHtml(s.session)} · ${escapeHtml(s.year)}</p>
    </div>
    <input id="studentRollInput" placeholder="শেষ ৩ ডিজিট (রোল)"
      class="w-full text-center text-2xl font-bold border-4 border-indigo-300 rounded-2xl p-3 mb-3 focus:outline-none bg-indigo-50"
      maxlength="3" inputmode="numeric" autofocus>
    <div id="studentPreview" class="mb-3 min-h-[70px] bg-gray-50 rounded-xl p-3 text-center flex items-center justify-center">
      <p class="text-xs text-gray-400">৩ ডিজিট লিখলেই নাম দেখা যাবে</p>
    </div>
    <button onclick="findAndSubmit()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold btn-pop">
      ✅ হাজিরা নিশ্চিত করুন
    </button>
    <button onclick="closeModal()" class="w-full mt-2 text-gray-500 py-2 text-sm">বন্ধ করুন</button>
    <p class="text-xs text-center text-gray-400 mt-3">🔄 একই ফোন থেকে একাধিক ছাত্র হাজিরা দিতে পারবে</p>
  `;

  const input = document.getElementById('studentRollInput');
  input.addEventListener('input', async (e) => {
    const suffix = e.target.value.trim();
    if (suffix.length === 3) await previewStudent(suffix);
    else document.getElementById('studentPreview').innerHTML =
      `<p class="text-xs text-gray-400">${suffix.length}/3 ডিজিট লেখা হয়েছে</p>`;
  });
  input.addEventListener('keypress', e => {
    if (e.key === 'Enter') findAndSubmit();
  });
  input.focus();
}

async function previewStudent(suffix) {
  const preview = document.getElementById('studentPreview');
  preview.innerHTML = '<p class="text-gray-400 text-sm">🔍 খুঁজছি...</p>';

  const s = currentPinSession;
  const { data: students } = await db.from('students')
    .select('id, name, class_roll, reg_no')
    .eq('session', s.session).eq('year', s.year)
    .eq('status', 'active')
    .or(`class_roll.ilike.%${suffix},reg_no.ilike.%${suffix}`);

  if (!students || students.length === 0) {
    preview.innerHTML = '<p class="text-red-500 text-sm font-bold">❌ এই রোলে কোনো ছাত্র নেই</p>';
    return;
  }
  if (students.length > 1) {
    preview.innerHTML = `<p class="text-amber-600 text-sm font-bold">⚠️ ${students.length} জন মিলেছে — পুরো রোল দিন</p>`;
    return;
  }

  const stu = students[0];
  const { data: existing } = await db.from('attendance_records')
    .select('id').eq('session_id', currentPinSession.id).eq('student_id', stu.id);

  if (existing && existing.length > 0) {
    preview.innerHTML = `
      <div class="text-center">
        <p class="text-amber-600 text-sm font-bold">⚠️ ইতিমধ্যে হাজিরা দেওয়া হয়েছে</p>
        <p class="text-gray-700 font-bold mt-1">${escapeHtml(stu.name)}</p>
      </div>`;
    return;
  }

  preview.innerHTML = `
    <div class="text-center">
      <p class="text-xs text-emerald-600 mb-1">✅ পাওয়া গেছে</p>
      <p class="text-lg font-bold text-gray-800">${escapeHtml(stu.name)}</p>
      <p class="text-xs text-gray-500">রোল: ${escapeHtml(stu.class_roll)} · রেজি: ${escapeHtml(stu.reg_no || '-')}</p>
    </div>`;
}

async function findAndSubmit() {
  const suffix = document.getElementById('studentRollInput').value.trim();
  if (suffix.length !== 3) return alert('শেষ ৩ ডিজিট লিখুন');

  const { data, error } = await db.rpc('student_mark_attendance', {
    p_pin: currentPinSession.pin,
    p_roll_suffix: suffix,
    p_device_id: deviceId
  });

  if (error) {
    return document.getElementById('studentPreview').innerHTML =
      `<p class="text-red-500 text-center text-sm font-bold">❌ নেটওয়ার্ক ত্রুটি</p>`;
  }
  if (!data.ok) {
    document.getElementById('studentPreview').innerHTML =
      `<p class="text-amber-600 text-center text-sm font-bold">⚠️ ${escapeHtml(data.message)}</p>`;
    return;
  }
  showSuccessAndNext(data.student_name);
}

function showSuccessAndNext(name) {
  document.getElementById('modalContent').innerHTML = `
    <div class="text-center fade-in">
      <div class="text-6xl mb-3">🎉</div>
      <h3 class="text-xl font-bold text-emerald-600 mb-1">হাজিরা সম্পন্ন!</h3>
      <p class="text-gray-700 font-bold mb-4">${escapeHtml(name)}</p>
      <p class="text-gray-500 text-sm mb-6">📅 ${escapeHtml(currentPinSession.date)} · 📚 ${escapeHtml(currentPinSession.course_code)}</p>
      <button onclick="showAttendanceForm()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold btn-pop text-lg">
        ➕ আরেকজন ছাত্রের হাজিরা দিন
      </button>
      <button onclick="closeModal()" class="w-full mt-3 text-gray-500 py-2 text-sm">সম্পন্ন</button>
    </div>`;
}

function showModal(icon, title, msg, color) {
  const colors = { red: 'text-red-600', amber: 'text-amber-600', emerald: 'text-emerald-600' };
  document.getElementById('attendanceModal').classList.remove('hidden');
  document.getElementById('modalContent').innerHTML = `
    <div class="text-center">
      <div class="text-6xl mb-3">${icon}</div>
      <h3 class="text-xl font-bold ${colors[color]||'text-gray-800'} mb-2">${escapeHtml(title)}</h3>
      <p class="text-gray-600 mb-5">${escapeHtml(msg)}</p>
      <button onclick="closeModal()" class="w-full bg-gray-800 text-white py-3 rounded-xl font-bold btn-pop">ঠিক আছে</button>
    </div>`;
}

function closeModal() {
  document.getElementById('attendanceModal').classList.add('hidden');
  document.getElementById('homePinInput').value = '';
  currentPinSession = null;
}

// ============================================================
// ADMIN LOGIN
// ============================================================
async function adminLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPass').value;
  document.getElementById('adminErr').textContent = '';

  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) return document.getElementById('adminErr').textContent = 'ভুল ইমেইল বা পাসওয়ার্ড';

  const { data: teacher } = await db.from('teachers')
    .select('is_admin').eq('auth_user_id', data.user.id).maybeSingle();

  if (!teacher || !teacher.is_admin) {
    await db.auth.signOut();
    return document.getElementById('adminErr').textContent = 'আপনি অ্যাডমিন নন';
  }

  showSection('adminDashboard');
  showAdminTab('manageTeacher');
}

async function logout() {
  if (pinTimerInterval) { clearInterval(pinTimerInterval); pinTimerInterval = null; }
  await db.auth.signOut();
  currentTeacher = null;
  currentStudent = null;
  if (liveChannel) {
    await db.removeChannel(liveChannel);
    liveChannel = null;
  }
  showSection('home');
}

// ============================================================
// ADMIN TABS
// ============================================================
function showAdminTab(tab) {
  const el = document.getElementById('adminContent');
  const yearOpts = ['1st','2nd','3rd','4th','Preliminary to Masters','Masters Final']

async function addTeacher() {
  const name = document.getElementById('ntName').value.trim();
  const pin = document.getElementById('ntPin').value.trim();
  if (!name || pin.length < 4) return alert('নাম ও কমপক্ষে ৪-ডিজিটের PIN দিন');

  const { data, error } = await db.rpc('admin_add_teacher', { p_name: name, p_pin: pin });
  if (error || !data.ok) return alert(data?.message || error?.message || 'ব্যর্থ');
  alert('✅ শিক্ষক যোগ হয়েছে');
  document.getElementById('ntName').value = '';
  document.getElementById('ntPin').value = '';
  loadTeachers();
}

async function loadTeachers() {
  const { data } = await db.from('teachers')
    .select('id, name, is_admin')
    .order('created_at', { ascending: false });
  const el = document.getElementById('teacherList');
  if (!el) return;

  if (!data || !data.length) {
    el.innerHTML = '<p class="text-gray-400 text-sm">কোনো শিক্ষক নেই</p>';
    return;
  }

  el.innerHTML = data.map(t => `
    <div class="bg-gray-50 p-3 rounded-xl flex justify-between items-center gap-2">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <b class="text-sm">${escapeHtml(t.name)}</b>
          ${t.is_admin ? '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded-full text-xs">Admin</span>' : ''}
        </div>
      </div>
      ${!t.is_admin ? `
        <div class="flex gap-1">
          <button class="edit-teacher-btn bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-xs font-bold"
            data-id="${escapeHtml(t.id)}" data-name="${escapeHtml(t.name)}">✏️ এডিট</button>
          <button class="delete-teacher-btn bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold"
            data-id="${escapeHtml(t.id)}" data-name="${escapeHtml(t.name)}">🗑️ মুছুন</button>
        </div>
      ` : '<span class="text-xs text-gray-400">সুরক্ষিত</span>'}
    </div>
  `).join('');

  el.querySelectorAll('.edit-teacher-btn').forEach(btn => {
    btn.addEventListener('click', () => editTeacher(btn.dataset.id, btn.dataset.name));
  });
  el.querySelectorAll('.delete-teacher-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteTeacher(btn.dataset.id, btn.dataset.name));
  });
}

function editTeacher(teacherId, currentName) {
  const modal = document.getElementById('attendanceModal');
  document.getElementById('modalContent').innerHTML = `
    <div class="text-center mb-4">
      <div class="text-4xl mb-2">✏️</div>
      <h3 class="text-lg font-bold text-gray-800">শিক্ষকের নাম পরিবর্তন</h3>
    </div>
    <label class="block text-sm font-bold text-gray-700 mb-1">নতুন নাম</label>
    <input id="editTeacherName" value="${escapeHtml(currentName)}"
      class="w-full border-2 rounded-xl p-3 mb-3 focus:border-indigo-500 focus:outline-none">
    <div id="editTeacherStatus" class="text-sm mb-3"></div>
    <button id="saveTeacherEditBtn"
      class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold btn-pop">💾 সংরক্ষণ করুন</button>
    <button onclick="closeModal()" class="w-full mt-2 text-gray-500 py-2 text-sm">বাতিল</button>
  `;
  modal.classList.remove('hidden');
  document.getElementById('saveTeacherEditBtn').addEventListener('click', () => saveTeacherEdit(teacherId));
  document.getElementById('editTeacherName').focus();
}

async function saveTeacherEdit(teacherId) {
  const newName = document.getElementById('editTeacherName').value.trim();
  const status = document.getElementById('editTeacherStatus');
  if (!newName) { status.innerHTML = '<p class="text-red-500">❌ নাম দিন</p>'; return; }
  status.innerHTML = '<p class="text-gray-500">⏳ সেভ হচ্ছে...</p>';
  const nameSlug = newName.toLowerCase().replace(/\s+/g, '_');
  const { error } = await db.from('teachers')
    .update({ name: newName, name_slug: nameSlug })
    .eq('id', teacherId);
  if (error) { status.innerHTML = `<p class="text-red-500">❌ ${escapeHtml(error.message)}</p>`; return; }
  closeModal();
  alert('✅ আপডেট হয়েছে');
  loadTeachers();
}

async function deleteTeacher(id, name) {
  if (!confirm(`"${name}" কে মুছবেন?`)) return;
  const { error } = await db.from('teachers').delete().eq('id', id);
  if (error) return alert('❌ ' + error.message);
  alert('🗑️ মুছে ফেলা হয়েছে');
  loadTeachers();
}

// ============================================================
// Excel Preview
// ============================================================
let pendingExcelStudents = null;

async function previewExcel() {
  const file = document.getElementById('excelFile')?.files[0];
  if (!file) return alert('ফাইল সিলেক্ট করুন');

  const area = document.getElementById('excelPreviewArea');
  area.innerHTML = '<p class="text-center py-4">⏳ প্রসেস হচ্ছে...</p>';

  const session = document.getElementById('asSession').value.trim();
  const year = document.getElementById('asYear').value;
  if (!session) { area.innerHTML = '<p class="text-red-500 text-center">❌ সেশন লিখুন</p>'; return; }

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      const valid = [];
      const duplicatesInFile = [];
      const invalidRows = [];
      const seenRolls = new Set();
      const seenRegs = new Set();

      rows.slice(1).forEach((r, idx) => {
        const rowNum = idx + 2;
        const roll = String(r[0] || '').trim();
        const reg = String(r[1] || '').trim();
        const name = String(r[2] || '').trim();

        if (!roll || !name) {
          invalidRows.push({ row: rowNum, reason: 'রোল বা নাম নেই' });
          return;
        }
        if (seenRolls.has(roll)) {
          duplicatesInFile.push({ row: rowNum, roll, reason: 'একই রোল' });
          return;
        }
        if (reg && seenRegs.has(reg)) {
          duplicatesInFile.push({ row: rowNum, roll, reg, reason: 'একই রেজি' });
          return;
        }
        seenRolls.add(roll);
        if (reg) seenRegs.add(reg);
        valid.push({ session, year, class_roll: roll, reg_no: reg || null, name, status: 'active' });
      });

      let existsInDB = [];
      if (valid.length > 0) {
        const rolls = valid.map(v => v.class_roll);
        const { data: existing } = await db.from('students')
          .select('class_roll').eq('session', session).eq('year', year).in('class_roll', rolls);
        if (existing) {
          const existingRolls = new Set(existing.map(e => e.class_roll));
          existsInDB = valid.filter(v => existingRolls.has(v.class_roll));
        }
      }

      const dbExistingRolls = new Set(existsInDB.map(e => e.class_roll));
      const finalValid = valid.filter(v => !dbExistingRolls.has(v.class_roll));
      pendingExcelStudents = finalValid;

      area.innerHTML = `
        <div class="bg-white border-2 border-indigo-200 rounded-xl p-4 space-y-3">
          <h4 class="font-bold text-sm text-gray-700">📊 Excel যাচাই রিপোর্ট</h4>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="bg-emerald-50 p-2 rounded-lg">
              <p class="text-emerald-700 font-bold text-xs">✅ সঠিক</p>
              <p class="text-2xl font-bold text-emerald-800">${finalValid.length}</p>
            </div>
            <div class="bg-amber-50 p-2 rounded-lg">
              <p class="text-amber-700 font-bold text-xs">⚠️ Duplicate</p>
              <p class="text-2xl font-bold text-amber-800">${duplicatesInFile.length}</p>
            </div>
            <div class="bg-red-50 p-2 rounded-lg">
              <p class="text-red-700 font-bold text-xs">❌ Invalid</p>
              <p class="text-2xl font-bold text-red-800">${invalidRows.length}</p>
            </div>
            <div class="bg-orange-50 p-2 rounded-lg">
              <p class="text-orange-700 font-bold text-xs">🔁 DB-তে আছে</p>
              <p class="text-2xl font-bold text-orange-800">${existsInDB.length}</p>
            </div>
          </div>
          ${duplicatesInFile.length > 0 ? `
            <details class="text-xs bg-amber-50 p-2 rounded-lg">
              <summary class="font-bold cursor-pointer">⚠️ Duplicate দেখুন</summary>
              <ul class="mt-2 space-y-1 max-h-32 overflow-y-auto">
                ${duplicatesInFile.map(d => `<li>লাইন ${d.row}: রোল ${escapeHtml(d.roll)} — ${escapeHtml(d.reason)}</li>`).join('')}
              </ul>
            </details>` : ''}
          ${invalidRows.length > 0 ? `
            <details class="text-xs bg-red-50 p-2 rounded-lg">
              <summary class="font-bold cursor-pointer">❌ Invalid দেখুন</summary>
              <ul class="mt-2 space-y-1 max-h-32 overflow-y-auto">

async function bulkUpdateStudents() {
  const file = document.getElementById('bulkFile')?.files[0];
  if (!file) return alert('ফাইল সিলেক্ট করুন');
  const status = document.getElementById('bulkStatus');
  const session = document.getElementById('buSession').value.trim();
  const year = document.getElementById('buYear').value;
  if (!session) { status.innerHTML = '<p class="text-red-500">❌ সেশন লিখুন</p>'; return; }

  status.innerHTML = '<p class="text-gray-500">⏳ প্রসেস হচ্ছে...</p>';

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      const updates = rows.slice(1).map(r => ({
        class_roll: String(r[0] || '').trim(),
        reg_no: String(r[1] || '').trim(),
        name: String(r[2] || '').trim()
      })).filter(u => u.class_roll);

      if (!updates.length) {
        status.innerHTML = '<p class="text-red-500">❌ কোনো ডাটা নেই</p>';
        return;
      }

      const { data, error } = await db.rpc('bulk_update_students', {
        p_session: session, p_year: year, p_updates: updates
      });

      if (error) {
        status.innerHTML = `<p class="text-red-500">❌ ${escapeHtml(error.message)}</p>`;
        return;
      }

      status.innerHTML = `
        <div class="bg-emerald-50 p-4 rounded-xl">
          <p class="font-bold text-emerald-700 mb-2">✅ Bulk Update সম্পন্ন</p>
          <p class="text-sm">✓ সফল: ${data.updated} জন</p>
          <p class="text-sm">✗ পাওয়া যায়নি: ${data.not_found} জন</p>
          ${data.not_found_list && data.not_found_list.length > 0 
            ? `<p class="text-xs text-gray-500 mt-2">পাওয়া যায়নি: ${data.not_found_list.join(', ')}</p>` 
            : ''}
        </div>`;
    } catch (err) {
      status.innerHTML = `<p class="text-red-500">❌ ${escapeHtml(err.message)}</p>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function loadStudentList() {
  const session = document.getElementById('lstSession')?.value.trim();
  const year = document.getElementById('lstYear')?.value;
  const status = document.getElementById('lstStatus')?.value;
  const search = document.getElementById('lstSearch')?.value.trim().toLowerCase();

  let q = db.from('students')
    .select('id, session, year, class_roll, reg_no, name, status, phone')
    .order('class_roll');
  if (session) q = q.eq('session', session);
  if (year) q = q.eq('year', year);
  if (status) q = q.eq('status', status);

  const { data, error } = await q;
  if (error) {
    document.getElementById('studentListArea').innerHTML = `<p class="text-red-500">❌ ${error.message}</p>`;
    return;
  }

  let students = data || [];
  if (search) {
    students = students.filter(s =>
      (s.name && s.name.toLowerCase().includes(search)) ||
      (s.class_roll && s.class_roll.toLowerCase().includes(search)) ||
      (s.reg_no && s.reg_no.toLowerCase().includes(search))
    );
  }

  if (!students.length) {

      `<p class="text-gray-400 text-sm text-center py-8">কোনো ছাত্র পাওয়া যায়নি</p>`;
    return;
  }

  const statusIcon = { active: '✅', tc: '📤', inactive: '❌', graduated: '🎓', suspended: '⛔' };
  const area = document.getElementById('studentListArea');
  area.innerHTML = `
    <p class="text-sm text-gray-500 mb-2">মোট: ${students.length} জন</p>
    <div class="overflow-y-auto max-h-[500px] space-y-2">

            <p class="text-xs text-gray-500 truncate">

              ${escapeHtml(s.session)} · ${escapeHtml(s.year)}

          <button class="student-action-btn bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-xs"
            data-id="${escapeHtml(s.id)}">⚙️</button>

async function saveStudentEdit(studentId) {
  const roll = document.getElementById('edRoll').value.trim();
  const reg = document.getElementById('edReg').value.trim();
  const name = document.getElementById('edName').value.trim();
  const phone = document.getElementById('edPhone').value.trim();
  const guardian = document.getElementById('edGuardian').value.trim();
  const gPhone = document.getElementById('edGuardianPhone').value.trim();
  const address = document.getElementById('edAddress').value.trim();
  const status = document.getElementById('editStudentStatus');

  if (!roll || !name) {
    status.innerHTML = '<p class="text-red-500">❌ রোল ও নাম দিন</p>';
    return;
  }

  status.innerHTML = '<p class="text-gray-500">⏳ সেভ হচ্ছে...</p>';

  const { error } = await db.from('students')
    .update({
      class_roll: roll, reg_no: reg || null, name,
      phone: phone || null, guardian_name: guardian || null,
      guardian_phone: gPhone || null, address: address || null
    })
    .eq('id', studentId);

  if (error) {
    if (error.message.includes('duplicate')) {
      status.innerHTML = '<p class="text-red-500">❌ এই রোল অন্য ছাত্রের আছে!</p>';

    }
    return;
  }

  closeModal();
  alert('✅ আপডেট হয়েছে');
  loadStudentList();
}

async function changeStudentStatus(studentId, newStatus) {
  const labels = { active: 'সক্রিয়', tc: 'টিসি', inactive: 'নিষ্ক্রিয়', graduated: 'গ্র্যাজুয়েটেড' };
  if (!confirm(`"${labels[newStatus]}" হিসেবে মার্ক করবেন?`)) return;
  const updateData = { status: newStatus };
  if (newStatus === 'tc') updateData.tc_date = new Date().toISOString().split('T')[0];
  const { error } = await db.from('students').update(updateData).eq('id', studentId);
  if (error) return alert('❌ ' + error.message);
  closeModal();
  alert(`✅ ${labels[newStatus]} মার্ক হয়েছে`);
  loadStudentList();
}

async function deleteStudentPermanently(studentId, name) {
  if (!confirm(`⚠️ "${name}" কে মুছবেন?\n\nসমস্ত হাজিরা রেকর্ডও মুছে যাবে!`)) return;
  if (!confirm('নিশ্চিত? শেষবার জিজ্ঞেস।')) return;
  const { error } = await db.from('students').delete().eq('id', studentId);
  if (error) return alert('❌ ' + error.message);
  closeModal();
  alert('🗑️ মুছে ফেলা হয়েছে');
  loadStudentList();
}

      .eq('session', session).eq('year', year).eq('status', 'active')
      .order('class_roll');

    if (!students || !students.length) {
      area.innerHTML = '<p class="text-center text-gray-400 py-4">ছাত্র নেই</p>';
      return;
    }

    const { data: courses } = await db.from('courses')
      .select('*').eq('session', session).eq('year', year).order('course_code');

    if (!courses || !courses.length) {
      area.innerHTML = '<p class="text-center text-gray-400 py-4">কোর্স নেই</p>';
      return;
    }

    const { data: sessions } = await db.from('attendance_sessions')
      .select('id, course_code').eq('session', session).eq('year', year);

    const sessionIds = sessions?.map(s => s.id) || [];
    let records = [];
    if (sessionIds.length > 0) {
      const { data: recs } = await db.from('attendance_records')
        .select('student_id, session_id, status').in('session_id', sessionIds);
      records = recs || [];
    }

    const sessionMap = {};
    sessions?.forEach(s => { sessionMap[s.id] = s.course_code; });

    const report = students.map(stu => {
      const courseCounts = {};
      courses.forEach(c => { courseCounts[c.course_code] = 0; });
      records.filter(r => r.student_id === stu.id).forEach(r => {
        const code = sessionMap[r.session_id];
        if (code && (r.status === 'present' || r.status === 'late')) {
          courseCounts[code] = (courseCounts[code] || 0) + 1;
        }
      });
      const total = Object.values(courseCounts).reduce((a, b) => a + b, 0);
      return { class_roll: stu.class_roll, reg_no: stu.reg_no || '', name: stu.name, courseCounts, total };
    });

    const displayHeaders = courses.map(c => c.course_name ? `${c.course_name}-${c.course_code}` : c.course_code);

    currentAttendanceData = { session, year, courses, displayHeaders, report };

    area.innerHTML = `
      <p class="text-sm text-gray-600 mb-2">
        <b>সেশন:</b> ${escapeHtml(session)} | <b>ইয়ার:</b> ${escapeHtml(year)} | 
        <b>ছাত্র:</b> ${report.length} | <b>কোর্স:</b> ${courses.length}
      </p>
      <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
        <table class="min-w-full text-xs border">
          <thead class="bg-gray-100 sticky top-0">
            <tr>
              <th class="p-2 border" rowspan="2">Roll</th>
              <th class="p-2 border" rowspan="2">Reg No.</th>
              <th class="p-2 border text-left" rowspan="2">Student Name</th>
              <th class="p-2 border bg-indigo-100" colspan="${courses.length}">Course Name/Code</th>
              <th class="p-2 border bg-amber-100" rowspan="2">Total Class</th>
            </tr>
            <tr class="bg-indigo-50">
              ${displayHeaders.map(h => `<th class="p-2 border">${escapeHtml(h)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${report.map(r => `
              <tr class="hover:bg-gray-50">
                <td class="p-2 border text-center">${escapeHtml(r.class_roll)}</td>
                <td class="p-2 border text-center">${escapeHtml(r.reg_no)}</td>
                <td class="p-2 border">${escapeHtml(r.name)}</td>
                ${courses.map(c => `<td class="p-2 border text-center">${r.courseCounts[c.course_code] || 0}</td>`).join('')}
                <td class="p-2 border text-center font-bold bg-amber-50">${r.total}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (err) {
    area.innerHTML = `<p class="text-red-500 text-center py-4">❌ ${escapeHtml(err.message)}</p>`;
  }
}

      .select('id, name, class_roll, reg_no')
      .eq('session', session).eq('year', year)
      .or(`class_roll.eq.${roll},reg_no.eq.${roll}`).maybeSingle();

      area.innerHTML = '<p class="text-red-500 text-center py-4">❌ ছাত্র পাওয়া যায়নি</p>';
      return;
    }

    const { data: courses } = await db.from('courses')
      .select('*').eq('session', session).eq('year', year).order('course_code');

    const { data: sessions } = await db.from('attendance_sessions')
      .select('id, course_code, date')
      .eq('session', session).eq('year', year).order('date');

    const sessionIds = sessions?.map(s => s.id) || [];
    let records = [];
    if (sessionIds.length > 0) {
      const { data: recs } = await db.from('attendance_records')
        .select('*').eq('student_id', student.id).in('session_id', sessionIds);
      records = recs || [];
    }

    const dateMap = {};
    sessions?.forEach(s => {
      if (!dateMap[s.date]) dateMap[s.date] = {};
      const rec = records.find(r => r.session_id === s.id);
      dateMap[s.date][s.course_code] = rec ? rec.status : null;
    });

    const dates = Object.keys(dateMap).sort();
    const courseCodes = courses?.map(c => c.course_code) || [];

    currentIndividualData = { student, session, year, courseCodes, dates, dateMap };

    area.innerHTML = `
      <div class="bg-indigo-50 p-3 rounded-xl mb-3">
        <p class="text-sm"><b>নাম:</b> ${escapeHtml(student.name)}</p>
        <p class="text-sm"><b>রোল:</b> ${escapeHtml(student.class_roll)} | <b>রেজি:</b> ${escapeHtml(student.reg_no || '-')}</p>

              <th class="p-2 border">Date</th>
              ${courseCodes.map(c => `<th class="p-2 border">${escapeHtml(c)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${dates.map(d => `
              <tr class="hover:bg-gray-50">
                <td class="p-2 border text-center font-bold">${escapeHtml(d)}</td>
                ${courseCodes.map(c => {
                  const st = dateMap[d][c];
                  let display = '-'; let cls = 'text-gray-400';
                  if (st === 'present') { display = 'P'; cls = 'text-emerald-600 font-bold'; }
                  else if (st === 'absent') { display = 'A'; cls = 'text-red-600 font-bold'; }
                  else if (st === 'late') { display = 'L'; cls = 'text-amber-600 font-bold'; }
                  else if (st === 'excused') { display = 'E'; cls = 'text-blue-600 font-bold'; }
                  return `<td class="p-2 border text-center ${cls}">${display}</td>`;

        </table>
      </div>`;
  } catch (err) {
    area.innerHTML = `<p class="text-red-500 text-center py-4">❌ ${escapeHtml(err.message)}</p>`;
  }

// SESSION MANAGEMENT
// ============================================================
async function loadSessionList() {
  const { data: sessions } = await db.from('students')
    .select('session, year, is_archived')
    .order('session', { ascending: false });

  if (!sessions || !sessions.length) {
    document.getElementById('sessionListArea').innerHTML = '<p class="text-gray-400 text-center py-4">কোনো সেশন নেই</p>';
    return;
  }

  const combos = {};
  sessions.forEach(s => {
    const key = `${s.session}|${s.year}`;
    if (!combos[key]) combos[key] = { session: s.session, year: s.year, is_archived: s.is_archived, count: 0 };
    combos[key].count++;
  });

  const list = Object.values(combos);

  document.getElementById('sessionListArea').innerHTML = `
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm border">
        <thead class="bg-gray-100">
          <tr>
            <th class="p-2 border">সেশন</th>
            <th class="p-2 border">ইয়ার</th>
            <th class="p-2 border">ছাত্র</th>
            <th class="p-2 border">অবস্থা</th>
            <th class="p-2 border">কার্যক্রম</th>
          </tr>
        </thead>
        <tbody>
          ${list.map(c => `
            <tr class="hover:bg-gray-50">
              <td class="p-2 border text-center">${escapeHtml(c.session)}</td>
              <td class="p-2 border text-center">${escapeHtml(c.year)}</td>
              <td class="p-2 border text-center">${c.count}</td>
              <td class="p-2 border text-center">
                ${c.is_archived ? '<span class="text-amber-600">📦 আর্কাইভ</span>' : '<span class="text-emerald-600">✅ সক্রিয়</span>'}
              </td>
              <td class="p-2 border text-center">
                ${!c.is_archived ? `
                  <button class="archive-btn bg-amber-500 text-white px-3 py-1 rounded text-xs"
                    data-session="${escapeHtml(c.session)}" data-year="${escapeHtml(c.year)}">📦 Archive</button>
                ` : `
                  <button class="delete-btn bg-red-600 text-white px-3 py-1 rounded text-xs"
                    data-session="${escapeHtml(c.session)}" data-year="${escapeHtml(c.year)}">🗑️ Delete</button>
                `}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`;

  document.querySelectorAll('.archive-btn').forEach(btn => {
    btn.addEventListener('click', () => archiveSession(btn.dataset.session, btn.dataset.year));
  });
  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteArchivedSession(btn.dataset.session, btn.dataset.year));
  });
}

async function archiveSession(session, year) {
  if (!confirm(`সেশন ${session} · ${year} আর্কাইভ করবেন?\n\nডাটা থাকবে কিন্তু রিপোর্টে দেখাবে না।`)) return;
  const { data, error } = await db.rpc('archive_session', { p_session: session, p_year: year });
  if (error || !data.ok) return alert('❌ ' + (data?.message || error?.message));
  alert('📦 আর্কাইভ সম্পন্ন');
  loadSessionList();
}

async function deleteArchivedSession(session, year) {
  if (!confirm(`⚠️ সেশন ${session} · ${year} সম্পূর্ণ মুছবেন?\n\nএটি আর ফেরানো যাবে না!`)) return;
  if (!confirm('নিশ্চিত? শেষবার জিজ্ঞেস।')) return;
  const { data, error } = await db.rpc('delete_archived_session', { p_session: session, p_year: year });
  if (error || !data.ok) return alert('❌ ' + (data?.message || error?.message));
  alert('🗑️ মুছে ফেলা হয়েছে');
  loadSessionList();
}

async function generatePin() {
  const sel = document.getElementById('atCourseSelect');
  if (!sel || !sel.value) return alert('কোর্স সিলেক্ট করুন');
  const [course_code, session, year] = sel.value.split('|');
  const date = document.getElementById('atDate').value;
  if (!date) return alert('তারিখ দিন');

  const { data, error } = await db.rpc('teacher_create_session', {
    p_teacher_id: currentTeacher.id,
    p_session: session,
    p_year: year,
    p_course_code: course_code,
    p_date: date
  });

  if (error || !data.ok) return alert(data?.message || 'PIN তৈরি ব্যর্থ');

  renderPinDisplay(data.pin, data.session_id, 45);
}

function renderPinDisplay(pin, sessionId, minutesLeft) {
  const el = document.getElementById('pinDisplay');
  el.innerHTML = `
    <div class="bg-indigo-50 rounded-2xl p-6 text-center">
      <p class="text-gray-500 mb-1">ছাত্রদের দেখান</p>
      <p class="text-7xl font-bold text-indigo-600 tracking-widest">${escapeHtml(pin)}</p>
      <p class="pin-timer text-gray-600 mt-3" id="pinTimerDisplay">⏰ ৪৫ মিনিট বাকি</p>
      <button id="closePinBtn" class="mt-4 bg-red-600 text-white px-6 py-3 rounded-xl font-bold btn-pop w-full">
        🔒 PIN বন্ধ করুন
      </button>
    </div>`;

  let remaining = minutesLeft * 60;
  if (pinTimerInterval) clearInterval(pinTimerInterval);
  pinTimerInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(pinTimerInterval);
      pinTimerInterval = null;
      const t = document.getElementById('pinTimerDisplay');
      if (t) t.innerHTML = '⏰ মেয়াদ শেষ';
      const btn = document.getElementById('closePinBtn');
      if (btn) btn.disabled = true;
      return;
    }
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    const t = document.getElementById('pinTimerDisplay');
    if (t) t.innerHTML = `⏰ ${mins}:${String(secs).padStart(2, '0')} বাকি`;
  }, 1000);

  document.getElementById('closePinBtn').addEventListener('click', () => closePin(sessionId));
}

async function closePin(sessionId) {
  if (!confirm('PIN বন্ধ করবেন?')) return;
  const { data, error } = await db.rpc('close_attendance_session', {
    p_session_id: sessionId,
    p_teacher_id: currentTeacher.id
  });
  if (error || !data.ok) return alert('❌ ' + (data?.message || error?.message));
  if (pinTimerInterval) { clearInterval(pinTimerInterval); pinTimerInterval = null; }
  document.getElementById('pinDisplay').innerHTML = `
    <div class="bg-gray-100 rounded-2xl p-6 text-center">
      <p class="text-4xl mb-2">🔒</p>
      <p class="text-gray-600 font-bold">PIN বন্ধ হয়ে গেছে</p>
      <p class="text-xs text-gray-400 mt-2">আবার নতুন PIN তৈরি করতে পারবেন</p>
    </div>`;
}

async function loadLiveSessions() {
  const { data } = await db.from('attendance_sessions')
    .select('*').eq('teacher_id', currentTeacher.id)
    .eq('is_active', true)
    .gte('expires_at', new Date().toISOString())
    .order('created_at', { ascending: false });

  const sel = document.getElementById('liveSessionSelect');
  sel.innerHTML = data?.map(s => 
    `<option value="${s.id}">${escapeHtml(s.course_code)} — ${escapeHtml(s.date)} — PIN ${escapeHtml(s.pin)}</option>`
  ).join('') || '<option>কোনো সক্রিয় সেশন নেই</option>';

  if (data && data.length) {
    sel.onchange = () => subscribeLive(sel.value);
    subscribeLive(data[0].id);
  }
}

function subscribeLive(sessionId) {
  if (liveChannel) {
    db.removeChannel(liveChannel);
    liveChannel = null;
  }
  const refresh = async () => {
    const { data, error } = await db.from('attendance_records')
      .select('marked_at, students(name, class_roll)').eq('session_id', sessionId);
    const rows = error || !data ? [] : data;
    const el = document.getElementById('liveCount');
    if (el) el.innerHTML = `<p class="text-6xl font-bold text-emerald-600">${rows.length}</p><p class="text-gray-500">উপস্থিত</p>`;
    const el2 = document.getElementById('liveList');
    if (el2) el2.innerHTML = rows.sort((a,b) => new Date(b.marked_at) - new Date(a.marked_at))
      .map(r => `<div class="bg-emerald-50 px-3 py-2 rounded-lg flex justify-between">
        <span>✅ ${escapeHtml(r.students?.name)}</span>
        <span class="text-xs text-gray-400">${new Date(r.marked_at).toLocaleTimeString('bn-BD')}</span>
      </div>`).join('');
  };
  liveChannel = db.channel('live_' + sessionId)
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'attendance_records',
      filter: `session_id=eq.${sessionId}`
    }, refresh).subscribe();
  refresh();
}

async function manualAttendance() {
  const courseVal = document.getElementById('meCourse').value;
  const date = document.getElementById('meDate').value;
  const roll = document.getElementById('meRoll').value.trim();
  const status = document.getElementById('meStatus').value;
  if (!courseVal || !date || !roll) return alert('সব তথ্য দিন');

  const [course_code, session, year] = courseVal.split('|');

  let { data: sess } = await db.from('attendance_sessions')
    .select('*').eq('teacher_id', currentTeacher.id)
    .eq('session', session).eq('year', year)
    .eq('course_code', course_code).eq('date', date).maybeSingle();

  if (!sess) {
    const { data: pinData, error: pinErr } = await db.rpc('teacher_create_session', {
      p_teacher_id: currentTeacher.id, p_session: session, p_year: year,
      p_course_code: course_code, p_date: date
    });
    if (pinErr || !pinData?.ok || !pinData?.session_id) return alert(pinData?.message || 'সেশন তৈরি ব্যর্থ');
    const { data: newSess } = await db.from('attendance_sessions')
      .select('*').eq('id', pinData.session_id).maybeSingle();
    sess = newSess;
  }

  const { data: student } = await db.from('students')
    .select('id, name').eq('session', session).eq('year', year)
    .eq('status', 'active')
    .or(`class_roll.eq.${roll},reg_no.eq.${roll}`).maybeSingle();
  if (!student) return alert('ছাত্র পাওয়া যায়নি');

  const { error } = await db.from('attendance_records').upsert({
    session_id: sess.id, student_id: student.id,
    status, marked_by: currentTeacher.id
  }, { onConflict: 'session_id,student_id' });

  if (error) return alert('❌ ' + error.message);
  alert('✅ সেভ হয়েছে: ' + student.name);
  document.getElementById('meRoll').value = '';
}

async function loadMarkEntry() {
  const courseVal = document.getElementById('mkCourse').value;
  const examVal = document.getElementById('mkExam').value;
  const customExam = document.getElementById('mkCustomExam').value.trim();
  const exam = examVal === 'Others' ? (customExam || 'Others') : examVal;
  if (!courseVal) return alert('কোর্স সিলেক্ট করুন');
  if (examVal === 'Others' && !customExam) return alert('পরীক্ষার নাম লিখুন');

  // ✅ Claude's Fix #1: dropdown-এর মান থেকেই সরাসরি session/year পার্স
  // আগের কোডে `teacher_courses` টেবিলে আলাদা query + .single() ছিল,
  // যেটা একই কোর্স একাধিক সেশনে থাকলে ভুল/error দিত।
  const [course, session, year] = courseVal.split('|');
  if (!session || !year) return alert('কোর্স তথ্য অসম্পূর্ণ — আবার সিলেক্ট করুন');

  const { data: students, error: sErr } = await db.from('students')
    .select('id, name, class_roll, reg_no')
    .eq('session', session).eq('year', year).eq('status', 'active').order('class_roll');
  if (sErr) return alert('❌ ' + sErr.message);

  const { data: existing } = await db.from('marks')
    .select('student_id, marks').eq('session', session).eq('year', year)
    .eq('course_code', course).eq('exam_type', exam);

  const markMap = {};
  existing?.forEach(m => markMap[m.student_id] = m.marks);

  const table = document.getElementById('markTable');
  table.innerHTML = `
    <div class="overflow-y-auto max-h-96 space-y-2 mt-4">
      ${students?.map(s => `
        <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl">
          <span class="flex-1 text-sm">${escapeHtml(s.class_roll)} — ${escapeHtml(s.name)}</span>
          <input type="number" min="0" max="100" value="${markMap[s.id] ?? ''}"
            class="mark-input w-20 border-2 rounded-lg p-2 text-center"
            data-student-id="${escapeHtml(s.id)}" data-course="${escapeHtml(course)}"
            data-exam="${escapeHtml(exam)}" data-session="${escapeHtml(session)}"
            data-year="${escapeHtml(year)}">
        </div>
      `).join('') || '<p class="text-gray-400">ছাত্র নেই</p>'}
    </div>`;

  table.querySelectorAll('.mark-input').forEach(inp => {
    inp.addEventListener('change', () => {
      saveMark(inp.dataset.studentId, inp.value, inp.dataset.course,
        inp.dataset.exam, inp.dataset.session, inp.dataset.year, inp);
    });
  });
}

async function saveMark(studentId, marks, course, exam, session, year, inputEl) {
  // ✅ Claude's Fix #2: খালি ইনপুট চেক
  // Number('') === 0, তাই আগে ফাঁকা রাখলে ভুলে ০ সেভ হয়ে যেত।
  if (String(marks).trim() === '') return;

  const num = Number(marks);
  if (isNaN(num) || num < 0 || num > 100) {
    if (inputEl) inputEl.style.background = '#fecaca';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 1500);
    return alert('নম্বর ০-১০০ হতে হবে');
  }

  const { data, error } = await db.rpc('save_mark', {
    p_session: session, p_year: year, p_course_code: course,
    p_exam_type: exam, p_student_id: studentId, p_marks: num
  });

  if (error || !data?.ok) {
    if (inputEl) inputEl.style.background = '#fecaca';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 1500);
    return alert('❌ ' + (data?.message || error?.message));
  }
  
  if (inputEl) {
    inputEl.style.background = '#d1fae5';
    setTimeout(() => { if (inputEl) inputEl.style.background = ''; }, 800);
  }
}

// Marks Excel Template
async function downloadMarksTemplate() {
  const courseVal = document.getElementById('mkCourse').value;
  const examVal = document.getElementById('mkExam').value;
  const customExam = document.getElementById('mkCustomExam').value.trim();
  const exam = examVal === 'Others' ? (customExam || 'Others') : examVal;
  if (!courseVal) return alert('প্রথমে কোর্স সিলেক্ট করুন');

  const [course, session, year] = courseVal.split('|');
  const { data: students } = await db.from('students')
    .select('id, class_roll, reg_no, name')
    .eq('session', session).eq('year', year).eq('status', 'active').order('class_roll');

  if (!students?.length) return alert('ছাত্র নেই');

  const data = [['Class Roll', 'Reg No', 'Name', exam]];
  students.forEach(s => {
    data.push([s.class_roll, s.reg_no || '', s.name, '']);
  });

  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Marks');
  XLSX.writeFile(wb, `Marks_${course}_${exam}.xlsx`);
}

async function importMarksExcel() {
  const file = document.getElementById('marksFile')?.files[0];
  if (!file) return alert('ফাইল সিলেক্ট করুন');

  const courseVal = document.getElementById('mkCourse').value;
  const examVal = document.getElementById('mkExam').value;
  const customExam = document.getElementById('mkCustomExam').value.trim();
  const exam = examVal === 'Others' ? (customExam || 'Others') : examVal;
  if (!courseVal) return alert('কোর্স সিলেক্ট করুন');

  const [course, session, year] = courseVal.split('|');
  const status = document.getElementById('marksStatus');
  status.innerHTML = '<p class="text-gray-500">⏳ প্রসেস হচ্ছে...</p>';

  const { data: students } = await db.from('students')
    .select('id, class_roll, reg_no')
    .eq('session', session).eq('year', year).eq('status', 'active');

  const rollToStudent = {};
  students?.forEach(s => { rollToStudent[s.class_roll] = s.id; });

  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      let success = 0, notFound = 0, invalid = 0;
      const notFoundList = [];

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const roll = String(r[0] || '').trim();
        const markVal = r[3];

        if (!roll) continue;
        const studentId = rollToStudent[roll];
        if (!studentId) { notFound++; notFoundList.push(roll); continue; }

        // খালি ইনপুট skip (Claude fix)
        if (markVal === '' || markVal === undefined || markVal === null) continue;

        const num = Number(markVal);
        if (isNaN(num) || num < 0 || num > 100) { invalid++; continue; }

        const { error } = await db.rpc('save_mark', {
          p_session: session, p_year: year, p_course_code: course,
          p_exam_type: exam, p_student_id: studentId, p_marks: num
        });
        if (error) { invalid++; } else { success++; }
      }

      status.innerHTML = `
        <div class="bg-emerald-50 p-4 rounded-xl">
          <p class="font-bold text-emerald-700 mb-2">✅ Import সম্পন্ন</p>
          <p class="text-sm">✓ সফল: ${success}</p>
          <p class="text-sm">✗ পাওয়া যায়নি: ${notFound}</p>
          <p class="text-sm">❌ Invalid: ${invalid}</p>
          ${notFoundList.length > 0 ? `<p class="text-xs text-gray-500 mt-2">পাওয়া যায়নি: ${notFoundList.join(', ')}</p>` : ''}
        </div>`;
    } catch (err) {
      status.innerHTML = `<p class="text-red-500">❌ ${escapeHtml(err.message)}</p>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function loadStudentData() {

    .select('id, course_code, date')
    .eq('session', student.session).eq('year', student.year);

  const totalClasses = mySessions?.length || 0;
  const { data: records } = await db.from('attendance_records')
    .select('status, session_id, attendance_sessions(course_code, date)')
    .eq('student_id', student.id);

  const attended = records?.filter(r => r.status === 'present' || r.status === 'late').length || 0;
  const percentage = totalClasses > 0 ? ((attended / totalClasses) * 100).toFixed(1) : 0;
  const pColor = percentage >= 70 ? 'emerald' : percentage >= 50 ? 'amber' : 'red';

  const { data: notices } = await db.from('notices').select('*')
    .or(`expires_at.is.null,expires_at.gte.${new Date().toISOString()}`)
    .order('created_at', { ascending: false }).limit(5);

  document.getElementById('studentContent').innerHTML = `
    <div class="bg-indigo-50 rounded-2xl p-5 mb-4 text-center">
      <p class="text-gray-500 text-sm">${escapeHtml(student.name)}</p>
      <p class="text-xs text-gray-400">${escapeHtml(student.session)} · ${escapeHtml(student.year)} · রোল ${escapeHtml(student.class_roll)}</p>
    </div>
    <div class="bg-${pColor}-50 rounded-2xl p-6 mb-4 text-center">
      <p class="text-5xl font-bold text-${pColor}-600">${percentage}%</p>
      <p class="text-gray-500">উপস্থিতির হার</p>
      <p class="text-xs text-gray-400 mt-2">${attended} / ${totalClasses} ক্লাসে উপস্থিত</p>
    </div>
    <h3 class="font-bold mb-2">📋 হাজিরার ইতিহাস</h3>
    <div class="space-y-1 mb-6 max-h-60 overflow-y-auto">
      ${records?.length ? records.map(r => {
        const icons = { present: '✅', absent: '❌', late: '⏰', excused: '📝' };
        return `<div class="bg-gray-50 px-3 py-2 rounded-xl flex justify-between text-sm">
          <span>${icons[r.status] || '✅'} ${escapeHtml(r.attendance_sessions?.course_code || '-')}</span>
          <span class="text-gray-500">${escapeHtml(r.attendance_sessions?.date || '')}</span>
        </div>`;
      }).join('') : '<p class="text-gray-400 text-sm">কোনো রেকর্ড নেই</p>'}
    </div>
    <h3 class="font-bold mb-2">📢 নোটিশ</h3>
    ${notices?.map(n => `
      <div class="${n.priority === 'urgent' ? 'bg-red-50 border-l-4 border-red-500' : 'bg-pink-50'} p-3 rounded-xl mb-2">
        <b>${n.priority === 'urgent' ? '🚨 ' : ''}${escapeHtml(n.title)}</b>
        <p class="text-sm text-gray-600">${escapeHtml(n.content)}</p>
      </div>`).join('') || '<p class="text-gray-400 text-sm">কোনো নোটিশ নেই</p>'}
  `;
}

// ============================================================
// AUTO ADMIN SESSION CHECK
// ============================================================
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    const { data: teacher } = await db.from('teachers')
      .select('is_admin').eq('auth_user_id', session.user.id).maybeSingle();
    if (teacher?.is_admin) {
      showSection('adminDashboard');
      showAdminTab('manageTeacher');
    }
  }
})();

// ============================================================
// Service Worker
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('✅ Service Worker registered:', reg.scope))
      .catch(err => console.log('❌ Service Worker error:', err));
  });
}
</script>
</body>
